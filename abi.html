<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DirectRouter - واریز جفت توکن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .wallet-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .option-group {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }

        .option-group.selected {
            border-color: #667eea;
            background: #f8fafc;
        }

        .option-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .radio-custom {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: inline-block;
            position: relative;
        }

        .option-group.selected .radio-custom {
            border-color: #667eea;
            background: #667eea;
            box-shadow: inset 0 0 0 3px white;
        }

        .option-title {
            font-weight: 700;
            font-size: 18px;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .token-badge {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            word-break: break-all;
        }

        .token-badge.pol {
            background: #8247e5;
            color: white;
        }

        .token-badge.usdt {
            background: #26a17b;
            color: white;
        }

        .token-badge.aziz {
            background: #ef4444;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 12px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-approve {
            background: #f59e0b;
        }

        .btn-approve:hover:not(:disabled) {
            background: #d97706;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
        }

        .status.loading {
            background: #fef3c7;
            color: #92400e;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .info-box {
            background: #e0e7ff;
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            font-size: 12px;
            color: #3730a3;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>💰 DirectRouter</h1>
                <p>واریز جفت توکن به خزانه</p>
            </div>

            <div class="wallet-wrapper" id="wallet-btn"></div>

            <!-- گزینه اول: POL + AZIZ -->
            <div id="optionPOL" class="option-group selected" onclick="selectOption('pol')">
                <div class="option-header">
                    <div class="radio-custom"></div>
                    <div class="option-title">💜 POL + AZIZ</div>
                </div>
                <div class="form-group">
                    <label>💰 مقدار POL</label>
                    <input type="number" id="amountPOL" placeholder="مقدار POL" value="0.01" step="any">
                </div>
                <div class="form-group">
                    <label>📦 مقدار AZIZ</label>
                    <input type="number" id="amountAZIZ" placeholder="مقدار AZIZ" value="1000" step="any">
                </div>
                <div class="token-badge pol">POL: 0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE</div>
                <div class="token-badge aziz" id="azizAddressBadge">AZIZ: آدرس توکن</div>
            </div>

            <!-- گزینه دوم: USDT + AZIZ -->
            <div id="optionUSDT" class="option-group" onclick="selectOption('usdt')">
                <div class="option-header">
                    <div class="radio-custom"></div>
                    <div class="option-title">💚 USDT + AZIZ</div>
                </div>
                <div class="form-group">
                    <label>💵 مقدار USDT</label>
                    <input type="number" id="amountUSDT" placeholder="مقدار USDT" value="1" step="any">
                </div>
                <div class="form-group">
                    <label>📦 مقدار AZIZ</label>
                    <input type="number" id="amountAZIZ2" placeholder="مقدار AZIZ" value="1000" step="any">
                </div>
                <div class="token-badge usdt">USDT: 0xc2132D05D31c914a87C6611C10748AEb04B58e8F</div>
                <div class="token-badge aziz" id="azizAddressBadge2">AZIZ: آدرس توکن</div>
            </div>

            <!-- فیلد آدرس توکن AZIZ -->
            <div class="form-group">
                <label>🔑 آدرس توکن AZIZ</label>
                <input type="text" id="azizTokenAddress" placeholder="مثلاً 0x44a9f9a3882a1aa8789a4512ab9455fe08174f98" value="0x44a9f9a3882a1aa8789a4512ab9455fe08174f98">
            </div>

            <button id="approveBtn" class="btn-approve">✅ Approve توکن AZIZ به قرارداد</button>
            <button id="depositBtn">🚀 واریز به خزانه</button>

            <div id="status"></div>
            <div class="info-box">
                ⚠️ گزینه اول: POL + AZIZ &nbsp;&nbsp;|&nbsp;&nbsp; گزینه دوم: USDT + AZIZ
            </div>
        </div>
    </div>

    <script type="module">
        import { createWeb3Modal, defaultWagmiConfig } from "https://esm.sh/@web3modal/wagmi";
        import { polygon } from "https://esm.sh/wagmi/chains";
        import { watchAccount, writeContract, readContract, simulateContract } from "https://esm.sh/wagmi/actions";
        import { parseUnits } from "https://esm.sh/viem";

        const CONTRACT_ADDRESS = "0xa9bD51648a5EbaF4dBa5d7b37360Ae1a8dF6E40f";
        const USDT_ADDRESS = "0xc2132D05D31c914a87C6611C10748AEb04B58e8F";
        const NATIVE_POL = "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE";

        const ROUTER_ABI = [
            { "inputs": [], "name": "treasury", "outputs": [{ "type": "address" }], "stateMutability": "view", "type": "function" },
            { "inputs": [{ "type": "uint256", "name": "amount" }], "name": "approveUSDT", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
            { "inputs": [{ "type": "address", "name": "token" }, { "type": "uint256", "name": "amount" }], "name": "approveToken", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
            { "inputs": [{ "type": "address", "name": "tokenA" }, { "type": "uint256", "name": "amountA" }, { "type": "address", "name": "tokenB" }, { "type": "uint256", "name": "amountB" }], "name": "depositPair", "outputs": [], "stateMutability": "payable", "type": "function" }
        ];

        const ERC20_ABI = [
            { "inputs": [], "name": "decimals", "outputs": [{ "type": "uint8" }], "stateMutability": "view", "type": "function" }
        ];

        const projectId = "96f13374b0fe2f629a925617de0a2ba3";
        const chains = [polygon];

        const wagmiConfig = defaultWagmiConfig({
            chains, projectId,
            metadata: { name: "DirectRouter", description: "", url: window.location.href, icons: [] }
        });

        createWeb3Modal({ wagmiConfig, projectId, chains });
        document.getElementById("wallet-btn").appendChild(document.createElement("w3m-button"));

        let currentAccount = null;
        let selectedOption = "pol"; // 'pol' or 'usdt'

        window.selectOption = (opt) => {
            selectedOption = opt;
            document.getElementById("optionPOL").classList.remove("selected");
            document.getElementById("optionUSDT").classList.remove("selected");
            document.getElementById(`option${opt === 'pol' ? 'POL' : 'USDT'}`).classList.add("selected");
        };

        // آپدیت badge آدرس AZIZ
        const azizInput = document.getElementById("azizTokenAddress");
        const updateAzizBadges = () => {
            const addr = azizInput.value.trim();
            const short = addr.length > 10 ? addr.slice(0,6)+"..."+addr.slice(-4) : addr;
            document.getElementById("azizAddressBadge").innerHTML = `AZIZ: ${short}`;
            document.getElementById("azizAddressBadge2").innerHTML = `AZIZ: ${short}`;
        };
        azizInput.addEventListener("input", updateAzizBadges);
        updateAzizBadges();

        watchAccount(wagmiConfig, {
            onChange(account) {
                currentAccount = account?.address || null;
                const btns = ["approveBtn", "depositBtn"];
                btns.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.disabled = !currentAccount;
                });
            }
        });

        function showStatus(msg, type) {
            const div = document.getElementById("status");
            div.innerHTML = `<div class="status ${type}">${msg}</div>`;
            setTimeout(() => { if (div.innerHTML === `<div class="status ${type}">${msg}</div>`) div.innerHTML = ""; }, 5000);
        }

        // Approve AZIZ
        document.getElementById("approveBtn").addEventListener("click", async () => {
            if (!currentAccount) { showStatus("❌ کیف پول متصل نیست", "error"); return; }

            const azizAddress = document.getElementById("azizTokenAddress").value.trim();
            if (!azizAddress.match(/^0x[a-fA-F0-9]{40}$/i)) {
                showStatus("❌ آدرس توکن AZIZ معتبر نیست", "error");
                return;
            }

            let amountAZIZ;
            if (selectedOption === "pol") {
                amountAZIZ = document.getElementById("amountAZIZ").value;
            } else {
                amountAZIZ = document.getElementById("amountAZIZ2").value;
            }

            if (!amountAZIZ || parseFloat(amountAZIZ) <= 0) {
                showStatus("❌ مقدار AZIZ را وارد کنید", "error");
                return;
            }

            try {
                showStatus("🔄 دریافت decimals AZIZ...", "loading");
                let decimals = 18;
                try {
                    decimals = await readContract(wagmiConfig, {
                        address: azizAddress,
                        abi: ERC20_ABI,
                        functionName: "decimals",
                        chainId: polygon.id
                    });
                } catch(e) {}

                const amountWei = parseUnits(amountAZIZ, decimals);
                showStatus("🔄 Approve AZIZ به قرارداد...", "loading");
                
                const { request } = await simulateContract(wagmiConfig, {
                    address: CONTRACT_ADDRESS,
                    abi: ROUTER_ABI,
                    functionName: "approveToken",
                    args: [azizAddress, amountWei],
                    account: currentAccount,
                    chainId: polygon.id
                });

                const hash = await writeContract(wagmiConfig, request);
                showStatus(`✅ Approve AZIZ انجام شد! ${hash.slice(0,10)}...`, "success");
            } catch(e) {
                showStatus("❌ خطا: " + e.message.slice(0,100), "error");
            }
        });

        // Deposit
        document.getElementById("depositBtn").addEventListener("click", async () => {
            if (!currentAccount) { showStatus("❌ کیف پول متصل نیست", "error"); return; }

            const azizAddress = document.getElementById("azizTokenAddress").value.trim();
            if (!azizAddress.match(/^0x[a-fA-F0-9]{40}$/i)) {
                showStatus("❌ آدرس توکن AZIZ معتبر نیست", "error");
                return;
            }

            try {
                let tokenA, amountA, tokenB, amountB, value = 0n;
                let decimalsAZIZ = 18;

                try {
                    decimalsAZIZ = await readContract(wagmiConfig, {
                        address: azizAddress,
                        abi: ERC20_ABI,
                        functionName: "decimals",
                        chainId: polygon.id
                    });
                } catch(e) {}

                if (selectedOption === "pol") {
                    // POL + AZIZ
                    const amountPOL = document.getElementById("amountPOL").value;
                    const amountAZIZ = document.getElementById("amountAZIZ").value;
                    
                    if (!amountPOL || parseFloat(amountPOL) <= 0) { showStatus("❌ مقدار POL را وارد کنید", "error"); return; }
                    if (!amountAZIZ || parseFloat(amountAZIZ) <= 0) { showStatus("❌ مقدار AZIZ را وارد کنید", "error"); return; }
                    
                    tokenA = NATIVE_POL;
                    amountA = parseUnits(amountPOL, 18);
                    tokenB = azizAddress;
                    amountB = parseUnits(amountAZIZ, decimalsAZIZ);
                    value = parseUnits(amountPOL, 18);
                    
                    showStatus("🔄 واریز POL + AZIZ...", "loading");
                    
                    const { request } = await simulateContract(wagmiConfig, {
                        address: CONTRACT_ADDRESS,
                        abi: ROUTER_ABI,
                        functionName: "depositPair",
                        args: [tokenA, amountA, tokenB, amountB],
                        account: currentAccount,
                        chainId: polygon.id,
                        value: value
                    });
                    
                    const hash = await writeContract(wagmiConfig, request);
                    showStatus(`✅ واریز POL + AZIZ موفق! ${hash.slice(0,10)}...`, "success");
                    
                } else {
                    // USDT + AZIZ
                    const amountUSDT = document.getElementById("amountUSDT").value;
                    const amountAZIZ = document.getElementById("amountAZIZ2").value;
                    
                    if (!amountUSDT || parseFloat(amountUSDT) <= 0) { showStatus("❌ مقدار USDT را وارد کنید", "error"); return; }
                    if (!amountAZIZ || parseFloat(amountAZIZ) <= 0) { showStatus("❌ مقدار AZIZ را وارد کنید", "error"); return; }
                    
                    tokenA = USDT_ADDRESS;
                    amountA = parseUnits(amountUSDT, 6);
                    tokenB = azizAddress;
                    amountB = parseUnits(amountAZIZ, decimalsAZIZ);
                    
                    showStatus("🔄 واریز USDT + AZIZ...", "loading");
                    
                    const { request } = await simulateContract(wagmiConfig, {
                        address: CONTRACT_ADDRESS,
                        abi: ROUTER_ABI,
                        functionName: "depositPair",
                        args: [tokenA, amountA, tokenB, amountB],
                        account: currentAccount,
                        chainId: polygon.id,
                        value: 0
                    });
                    
                    const hash = await writeContract(wagmiConfig, request);
                    showStatus(`✅ واریز USDT + AZIZ موفق! ${hash.slice(0,10)}...`, "success");
                }
            } catch(e) {
                let msg = e.message.slice(0,150);
                if (msg.includes("execution reverted")) msg = "تراکنش برگشت خورد. احتمالاً نیاز به Approve دارید.";
                showStatus("❌ " + msg, "error");
            }
        });
    </script>
</body>
    </html>
