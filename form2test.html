<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeFi Swap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            backdrop-filter: blur(10px);
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .field {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #1e293b;
        }
        .fake-select {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .fake-select.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f1f5f9;
            pointer-events: none;
        }
        .fake-select:hover:not(.disabled) {
            border-color: #667eea;
            transform: translateY(-1px);
        }
        .double-row-top {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .exchange-field {
            flex: 0 0 70%;
        }
        .pool-field {
            flex: 0 0 30%;
        }
        input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        input.disabled {
            opacity: 0.5;
            background: #f1f5f9;
            pointer-events: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .double-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .double-row .field {
            flex: 1;
            margin-bottom: 0;
        }
        .token-field {
            position: relative;
        }
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 380px;
            max-width: 90%;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.15);
            z-index: 1000;
            display: none;
            overflow: hidden;
        }
        .popup-header {
            padding: 1rem 1.2rem 0.5rem 1.2rem;
            font-weight: 600;
            font-size: 1rem;
            color: #667eea;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }
        .popup-body {
            padding: 1rem 1.2rem 1.2rem 1.2rem;
        }
        .popup input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
        }
        .popup button {
            width: 100%;
            padding: 0.6rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.3rem;
            transition: all 0.3s;
        }
        .popup button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .popup button:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        .popup .clear {
            background: #f1f5f9;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-item {
            padding: 0.7rem;
            text-align: center;
            border-radius: 40px;
            cursor: pointer;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .option-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f1f5f9;
            pointer-events: none;
        }
        .option-item:hover:not(.disabled) {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        .option-label {
            font-weight: normal;
        }
        .option-balance {
            font-size: 0.75rem;
            background: #e0e7ff;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }
        .option-item:hover .option-balance {
            background: white;
            color: #667eea;
        }
        .selected-info {
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: #667eea;
            background: #e0e7ff;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            display: inline-block;
        }
        .reward-info {
            margin-top: 0.5rem;
            font-size: 0.7rem;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            display: block;
            width: 100%;
        }
        .reward-info.success {
            color: #065f46;
            background: #d1fae5;
        }
        .reward-info.error {
            color: #991b1b;
            background: #fee2e2;
        }
        .reward-info.loading {
            color: #92400e;
            background: #fef3c7;
        }
        .info-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
        .info-item {
            flex: 1;
            background: #f8fafc;
            border-radius: 20px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .info-label {
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 0.3rem;
        }
        .info-value {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
        }
        .amount-field {
            margin-bottom: 1rem;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper input {
            flex: 1;
            padding-right: 50px;
        }
        .max-btn {
            position: absolute;
            right: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .max-btn:hover {
            transform: scale(1.05);
        }
        .max-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .review-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
        }
        .review-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .review-btn:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .bottom-popup {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 32px 32px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
            z-index: 1000;
            transition: bottom 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        .bottom-popup.show {
            bottom: 0;
        }
        .bottom-popup-header {
            padding: 1.2rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .bottom-popup-header h3 {
            color: #667eea;
            font-size: 1.3rem;
            font-weight: 700;
        }
        .close-bottom-popup {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.3s;
        }
        .close-bottom-popup:hover {
            color: #667eea;
        }
        .bottom-popup-body {
            padding: 1.2rem;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .exchange-pool {
            font-weight: 700;
            font-size: 1rem;
            color: #1e293b;
        }
        .pair-names {
            font-weight: 600;
            font-size: 0.9rem;
            color: #667eea;
        }
        .info-block {
            margin: 1rem 0;
        }
        .info-line {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .info-label {
            color: #64748b;
            font-size: 0.8rem;
        }
        .info-value {
            color: #1e293b;
            font-weight: 600;
            font-size: 0.8rem;
            text-align: right;
            font-family: monospace;
        }
        .deposit-title {
            font-weight: 700;
            font-size: 1rem;
            color: #667eea;
            margin: 1rem 0 0.8rem 0;
        }
        .deposit-line {
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .deposit-label {
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .deposit-value {
            color: #1e293b;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: right;
            font-family: monospace;
        }
        .sub-text {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: -0.3rem;
            margin-bottom: 0.5rem;
            text-align: right;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }
        .overlay.show {
            display: block;
        }
        .token-result-card {
            background: #f8fafc;
            padding: 12px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 12px;
            border: 1px solid #e2e8f0;
        }
        .token-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .token-info {
            flex: 1;
            text-align: left;
        }
        .token-symbol {
            font-weight: bold;
            font-size: 16px;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .token-name {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 6px;
        }
        .token-balance {
            font-size: 14px;
            font-weight: bold;
            color: #1e293b;
        }
        .wallet-btn-container {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .create-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
        }
        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .status-step {
            background: #f8fafc;
            border-radius: 20px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .step-line {
            padding: 0.7rem;
            margin: 0.4rem 0;
            border-radius: 16px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .step-pending {
            background: #fef3c7;
            color: #92400e;
        }
        .step-active {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            color: #667eea;
            font-weight: 600;
            border: 1px solid #667eea;
        }
        .step-success {
            background: #d1fae5;
            color: #065f46;
        }
        .step-error {
            background: #fee2e2;
            color: #991b1b;
        }
        .step-icon {
            font-size: 1.1rem;
        }
        hr {
            margin: 1rem 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="title">⚡ DeFi Swap</div>

    <div class="double-row-top">
        <div class="exchange-field">
            <label>Exchange</label>
            <div class="fake-select" id="exchangeBtn">
                <span id="exchangeLabel">Select exchange</span>
                <span>▼</span>
            </div>
        </div>
        <div class="pool-field">
            <label>Pool Type</label>
            <div class="fake-select disabled" id="poolBtn">
                <span id="poolLabel">-</span>
                <span>▼</span>
            </div>
        </div>
    </div>

    <div class="double-row">
        <div class="field">
            <label>Trading Pair</label>
            <div class="fake-select disabled" id="pairBtn">
                <span id="pairLabel">Select pair</span>
                <span>▼</span>
            </div>
            <div id="pairInfo" class="selected-info" style="display:none"></div>
        </div>
        <div class="field token-field">
            <label>Your Token</label>
            <div class="fake-select disabled" id="tokenBtn">
                <span id="tokenLabel">Select token</span>
                <span>+</span>
            </div>
            <div id="tokenInfo" class="selected-info" style="display:none"></div>
        </div>
    </div>

    <div class="info-row">
        <div class="info-item">
            <div class="info-label">Fee tier</div>
            <div class="info-value" id="gasFee">--</div>
        </div>
        <div class="info-item">
            <div class="info-label">Trading Range</div>
            <div class="info-value" id="tradingRange">--</div>
        </div>
    </div>

    <div class="amount-field">
        <label id="pairAmountLabel">USDT Amount</label>
        <input type="number" id="pairAmount" placeholder="0.00" step="any" value="0.001" class="disabled" disabled>
        <div id="usdtRewardInfo" class="reward-info" style="display: none;"></div>
    </div>

    <div class="amount-field">
        <label id="tokenAmountLabel">Token Amount</label>
        <div class="input-wrapper">
            <input type="number" id="tokenAmount" placeholder="0.00" step="any" value="" class="disabled" disabled>
            <button id="maxTokenBtn" class="max-btn disabled" disabled>MAX</button>
        </div>
        <div id="tokenRewardInfo" class="reward-info success" style="display: none;"></div>
    </div>

    <button id="reviewBtn" class="review-btn disabled" disabled>Review & Create</button>
</div>

<div id="overlay" class="overlay"></div>
<div id="bottomPopup" class="bottom-popup">
    <div class="bottom-popup-header">
        <h3>✨ Create Position</h3>
        <button class="close-bottom-popup" id="closeBottomPopupBtn">&times;</button>
    </div>
    <div class="bottom-popup-body" id="bottomPopupBody"></div>
</div>

<div id="exchangePopup" class="popup">
    <div class="popup-header">Select Exchange</div>
    <div class="popup-body">
        <div class="option-list">
            <div class="option-item" data-value="SushiSwap">SushiSwap</div>
            <div class="option-item" data-value="Uniswap">Uniswap</div>
            <div class="option-item" data-value="QuickSwap">QuickSwap</div>
        </div>
    </div>
</div>

<div id="poolPopup" class="popup">
    <div class="popup-header">Pool Type</div>
    <div class="popup-body">
        <div class="option-list" id="poolOptionsList"></div>
    </div>
</div>

<div id="pairPopup" class="popup">
    <div class="popup-header">Trading Pair</div>
    <div class="popup-body">
        <div class="option-list" id="pairOptionsList"></div>
    </div>
</div>

<div id="tokenPopup" class="popup">
    <div class="popup-header">Select Token</div>
    <div class="popup-body">
        <div id="wallet-btn-container" style="margin-bottom:12px; display:flex; justify-content:center;"></div>
        <input type="text" id="contractInput" placeholder="Contract address (0x...)" style="width:100%; padding:10px; margin-bottom:10px; border-radius:40px; border:1px solid #e2e8f0;">
        <button id="checkBalanceBtn" style="width:100%; padding:10px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; border:none; border-radius:40px; font-weight:600; cursor:pointer;">Check Balance</button>
        <div id="tokenResult" style="margin-top:12px;"></div>
        <div class="action-buttons">
            <button id="clearBtn" class="clear">Clear</button>
            <button id="confirmBtn" disabled>Confirm Token</button>
        </div>
    </div>
</div>

<script type="module">
    import { createWeb3Modal, defaultWagmiConfig } from "https://esm.sh/@web3modal/wagmi";
    import { polygon } from "https://esm.sh/wagmi/chains";
    import { watchAccount, writeContract, readContract, simulateContract } from "https://esm.sh/wagmi/actions";
    import { formatUnits, parseUnits, erc20Abi } from "https://esm.sh/viem";

    const projectId = "96f13374b0fe2f629a925617de0a2ba3";
    const chains = [polygon];

    const CONTRACT_ADDRESS = "0xD045a55a067aE1a65Cfe836CcCb194a40cB04CF2";
    const USDT_ADDRESS = "0xc2132D05D31c914a87C6611C10748AEb04B58e8F";
    const NATIVE_POL = "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE";

    const ROUTER_ABI = [
        { "inputs": [{ "type": "address", "name": "tokenA" }, { "type": "uint256", "name": "amountA" }, { "type": "address", "name": "tokenB" }, { "type": "uint256", "name": "amountB" }], "name": "depositPair", "outputs": [], "stateMutability": "payable", "type": "function" }
    ];

    const wagmiConfig = defaultWagmiConfig({
        chains, projectId,
        metadata: { name: "DeFi Swap", description: "", url: window.location.href, icons: [] }
    });

    createWeb3Modal({ wagmiConfig, projectId, chains });
    
    const walletContainer = document.getElementById('wallet-btn-container');
    walletContainer.appendChild(document.createElement("w3m-button"));

    const ERC20_ABI = [
        { "constant": true, "inputs": [], "name": "name", "outputs": [{"name": "", "type": "string"}], "type": "function" },
        { "constant": true, "inputs": [], "name": "symbol", "outputs": [{"name": "", "type": "string"}], "type": "function" },
        { "constant": true, "inputs": [], "name": "decimals", "outputs": [{"name": "", "type": "uint8"}], "type": "function" },
        { "constant": true, "inputs": [{"name": "_owner", "type": "address"}], "name": "balanceOf", "outputs": [{"name": "balance", "type": "uint256"}], "type": "function" }
    ];

    let currentAccount = null;
    let currentTokenData = { address: '', symbol: '', name: '', balance: 0, decimals: 0 };
    let usdtBalance = 0;
    let polBalance = 0;
    let polygonPrice = null;

    const MAX_UINT256 = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

    async function fetchUSDTBalance() {
        if (!currentAccount) { usdtBalance = 0; updatePairPopupBalances(); return; }
        try {
            const decimals = await readContract(wagmiConfig, { address: USDT_ADDRESS, abi: [{ "constant": true, "inputs": [], "name": "decimals", "outputs": [{"name": "", "type": "uint8"}], "type": "function" }], functionName: 'decimals', chainId: polygon.id });
            const balance = await readContract(wagmiConfig, { address: USDT_ADDRESS, abi: [{ "constant": true, "inputs": [{"name": "_owner", "type": "address"}], "name": "balanceOf", "outputs": [{"name": "balance", "type": "uint256"}], "type": "function" }], functionName: 'balanceOf', args: [currentAccount], chainId: polygon.id });
            usdtBalance = parseFloat(formatUnits(balance, decimals));
            updatePairPopupBalances();
        } catch(e) { usdtBalance = 0; }
    }

    async function fetchPOLBalance() {
        if (!currentAccount) { polBalance = 0; updatePairPopupBalances(); return; }
        try {
            const balance = await readContract(wagmiConfig, { address: "0x0000000000000000000000000000000000001010", abi: [{"constant":true,"inputs":[{"name":"_owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"}], functionName: 'balanceOf', args: [currentAccount], chainId: polygon.id });
            polBalance = parseFloat(formatUnits(balance, 18));
            updatePairPopupBalances();
        } catch(e) { polBalance = 0; }
    }

    function updatePairPopupBalances() {
        const pairOptionsList = document.getElementById('pairOptionsList');
        if (!pairOptionsList) return;
        pairOptionsList.querySelectorAll('.option-item').forEach(opt => {
            const value = opt.getAttribute('data-value');
            const balanceSpan = opt.querySelector('.option-balance');
            if (value === 'USDT' && balanceSpan) balanceSpan.textContent = usdtBalance > 0 ? `💰 ${usdtBalance.toLocaleString()} USDT` : '💰 0 USDT';
            else if (value === 'Polygon' && balanceSpan) balanceSpan.textContent = polBalance > 0 ? `💰 ${polBalance.toLocaleString()} POL` : '💰 0 POL';
        });
    }

    function buildPairPopup() {
        const pairOptionsList = document.getElementById('pairOptionsList');
        pairOptionsList.innerHTML = '';
        [{ value: 'USDT', label: 'USDT' }, { value: 'Polygon', label: 'Polygon (POL)' }].forEach(pair => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.setAttribute('data-value', pair.value);
            const labelSpan = document.createElement('span');
            labelSpan.className = 'option-label';
            labelSpan.textContent = pair.label;
            const balanceSpan = document.createElement('span');
            balanceSpan.className = 'option-balance';
            balanceSpan.textContent = pair.value === 'USDT' ? (usdtBalance > 0 ? `💰 ${usdtBalance.toLocaleString()} USDT` : '💰 0 USDT') : (polBalance > 0 ? `💰 ${polBalance.toLocaleString()} POL` : '💰 0 POL');
            div.appendChild(labelSpan);
            div.appendChild(balanceSpan);
            div.onclick = () => { updatePairDisplay(pair.value); closeAllPopups(); };
            pairOptionsList.appendChild(div);
        });
    }

    watchAccount(wagmiConfig, {
        onChange(account) {
            currentAccount = account?.address || null;
            const checkBtn = document.getElementById('checkBalanceBtn');
            if (checkBtn) checkBtn.disabled = !currentAccount;
            if (currentAccount) { fetchUSDTBalance(); fetchPOLBalance(); buildPairPopup(); }
            else { usdtBalance = 0; polBalance = 0; buildPairPopup(); }
        }
    });

    function getLogoLetter(symbol) { return symbol?.charAt(0).toUpperCase() || '?'; }

    window.checkTokenBalance = async function() {
        const tokenAddress = document.getElementById('contractInput').value.trim();
        const confirmBtnElem = document.getElementById('confirmBtn');
        if (!tokenAddress.match(/^0x[a-fA-F0-9]{40}$/i)) { document.getElementById('tokenResult').innerHTML = '<div style="color:#ef4444; text-align:center;">Invalid address</div>'; confirmBtnElem.disabled = true; return; }
        if (!currentAccount) { document.getElementById('tokenResult').innerHTML = '<div style="color:#ef4444; text-align:center;">Wallet not connected</div>'; confirmBtnElem.disabled = true; return; }
        document.getElementById('tokenResult').innerHTML = '<div style="text-align:center;">Checking...</div>';
        confirmBtnElem.disabled = true;
        try {
            const [name, symbol, decimals, balance] = await Promise.all([
                readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'name', chainId: polygon.id }),
                readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'symbol', chainId: polygon.id }),
                readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'decimals', chainId: polygon.id }),
                readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'balanceOf', args: [currentAccount], chainId: polygon.id })
            ]);
            const balanceNum = parseFloat(formatUnits(balance, decimals));
            currentTokenData = { address: tokenAddress, symbol, name, balance: balanceNum, decimals };
            document.getElementById('tokenResult').innerHTML = `
                <div class="token-result-card">
                    <div class="token-logo">${getLogoLetter(symbol)}</div>
                    <div class="token-info">
                        <div class="token-symbol">${symbol}</div>
                        <div class="token-name">${name}</div>
                        <div class="token-balance">${balanceNum.toLocaleString()}</div>
                    </div>
                </div>`;
            confirmBtnElem.disabled = false;
        } catch(e) {
            document.getElementById('tokenResult').innerHTML = '<div style="color:#ef4444; text-align:center;">Invalid token</div>';
            currentTokenData = { address: '', symbol: '', name: '', balance: 0, decimals: 0 };
            confirmBtnElem.disabled = true;
        }
    };

    document.getElementById('checkBalanceBtn').onclick = () => window.checkTokenBalance();
    document.getElementById('checkBalanceBtn').disabled = true;

    // UI Elements
    const overlay = document.getElementById('overlay');
    const bottomPopup = document.getElementById('bottomPopup');
    const bottomPopupBody = document.getElementById('bottomPopupBody');
    const closeBottomPopupBtn = document.getElementById('closeBottomPopupBtn');
    const exchangeBtn = document.getElementById('exchangeBtn');
    const exchangeLabel = document.getElementById('exchangeLabel');
    const exchangePopup = document.getElementById('exchangePopup');
    const poolBtn = document.getElementById('poolBtn');
    const poolLabel = document.getElementById('poolLabel');
    const poolPopup = document.getElementById('poolPopup');
    const poolOptionsList = document.getElementById('poolOptionsList');
    const pairBtn = document.getElementById('pairBtn');
    const pairLabel = document.getElementById('pairLabel');
    const pairInfo = document.getElementById('pairInfo');
    const pairPopup = document.getElementById('pairPopup');
    const tokenBtn = document.getElementById('tokenBtn');
    const tokenLabel = document.getElementById('tokenLabel');
    const tokenInfo = document.getElementById('tokenInfo');
    const tokenPopup = document.getElementById('tokenPopup');
    const contractInput = document.getElementById('contractInput');
    const confirmBtn = document.getElementById('confirmBtn');
    const clearBtn = document.getElementById('clearBtn');
    const pairAmountInput = document.getElementById('pairAmount');
    const tokenAmountInput = document.getElementById('tokenAmount');
    const pairAmountLabel = document.getElementById('pairAmountLabel');
    const tokenAmountLabel = document.getElementById('tokenAmountLabel');
    const usdtRewardInfo = document.getElementById('usdtRewardInfo');
    const tokenRewardInfo = document.getElementById('tokenRewardInfo');
    const maxTokenBtn = document.getElementById('maxTokenBtn');
    const gasFeeSpan = document.getElementById('gasFee');
    const tradingRangeSpan = document.getElementById('tradingRange');
    const reviewBtn = document.getElementById('reviewBtn');

    let currentToken = '', currentPair = '', currentExchange = '', currentPool = '';
    const MIN_BONUS = 200, MAX_BONUS = 6000, FEE_PERCENT = 2;

    function formatNumberForBox(num) { return Math.round(parseFloat(num || 0)).toString(); }
    function formatNumberWithCommaForBox(num) { return Math.round(parseFloat(num || 0)).toLocaleString('en-US'); }
    function formatNumberForPrice(num) { let n = parseFloat(num); return Math.floor(n) === n ? n.toString() : n.toFixed(8).replace(/\.?0+$/, ''); }

    function getUsdtValue() {
        let val = parseFloat(pairAmountInput.value) || 0;
        if (currentPair === 'USDT') return val;
        if (currentPair === 'Polygon' && polygonPrice) return val * polygonPrice;
        return 0;
    }

    async function getPolygonPrice() {
        try {
            const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=polygon-ecosystem-token&vs_currencies=usd");
            const data = await res.json();
            polygonPrice = data["polygon-ecosystem-token"]?.usd;
            if (currentPair === 'Polygon') updateUSDTBonus();
        } catch(e) { polygonPrice = null; }
    }

    function showBottomPopup() {
        let pairAmount = parseFloat(pairAmountInput.value) || 0;
        let tokenAmount = parseFloat(tokenAmountInput.value) || 0;
        let tokenFee = tokenAmount * (FEE_PERCENT / 100);
        let tokenToPool = tokenAmount - tokenFee;
        let usdtValue = 0, bonusAmount = 0, totalValue = 0;
        
        if (currentPair === 'USDT') {
            usdtValue = pairAmount;
            if (usdtValue >= 1000) { bonusAmount = Math.min(MAX_BONUS, Math.max(MIN_BONUS, usdtValue * 0.20)); totalValue = usdtValue + bonusAmount; }
            else totalValue = usdtValue;
        } else if (currentPair === 'Polygon' && polygonPrice) {
            usdtValue = pairAmount * polygonPrice;
            if (usdtValue >= 1000) { bonusAmount = Math.min(MAX_BONUS, Math.max(MIN_BONUS, usdtValue * 0.20)); totalValue = usdtValue + bonusAmount; }
            else totalValue = usdtValue;
        }
        
        let finalPolAmount = (currentPair === 'Polygon' && polygonPrice) ? totalValue / polygonPrice : 0;
        let tokenShort = currentTokenData.symbol || currentToken;
        if (tokenShort.length > 16) tokenShort = tokenShort.slice(0,10)+'...'+tokenShort.slice(-6);
        
        let usdtLineLeft = currentPair === 'USDT' ? `USDT: ${formatNumberWithCommaForBox(pairAmount)}${bonusAmount > 0 ? ' + 20%' : ''}` : `POL: ${formatNumberWithCommaForBox(pairAmount)}${bonusAmount > 0 ? ' + 20%' : ''}`;
        let usdtLineRight = currentPair === 'USDT' ? formatNumberWithCommaForBox(totalValue) : formatNumberWithCommaForBox(finalPolAmount);
        
        let priceDisplay = '';
        if (currentPair === 'USDT') {
            let pricePerToken = tokenToPool / totalValue;
            if (pricePerToken > 0 && totalValue > 0) priceDisplay = `${formatNumberForPrice(pricePerToken)} ${tokenShort} = 1 USDT`;
        } else if (currentPair === 'Polygon' && polygonPrice) {
            let pricePerTokenInPol = tokenToPool / finalPolAmount;
            if (pricePerTokenInPol > 0 && finalPolAmount > 0) priceDisplay = `${formatNumberForPrice(pricePerTokenInPol)} ${tokenShort} = 1 POL`;
        }
        
        bottomPopupBody.innerHTML = `
            <div class="top-row"><span class="exchange-pool">${currentExchange}/${currentPool}</span><span class="pair-names">${currentPair} / ${tokenShort}</span></div>
            <div class="info-block"><div class="info-line"><span class="info-label">Initial price:</span><span class="info-value">${priceDisplay || 'calculating...'}</span></div>
            <div class="info-line"><span class="info-label">Fee tier:</span><span class="info-value">0.01%</span></div>
            <div class="info-line"><span class="info-label">Price range:</span><span class="info-value">Full Range</span></div></div>
            <div class="deposit-title">Depositing</div>
            <div class="deposit-line"><span class="deposit-label">${usdtLineLeft}</span><span class="deposit-value">${usdtLineRight}</span></div>
            <div class="deposit-line"><span class="deposit-label">${tokenShort}: ${formatNumberWithCommaForBox(tokenAmount)} - 2%</span><span class="deposit-value">${formatNumberWithCommaForBox(tokenToPool)}</span></div>
            <button id="createPositionBtn" class="create-btn">🚀 Create Position</button>
            <div id="creationStatus" style="margin-top:1rem;"></div>
        `;
        
        document.getElementById('createPositionBtn')?.addEventListener('click', executeCreation);
        bottomPopup.classList.add('show');
        overlay.classList.add('show');
    }

    async function executeCreation() {
        const createBtn = document.getElementById('createPositionBtn');
        const statusDiv = document.getElementById('creationStatus');
        if (createBtn) createBtn.remove();
        
        statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-active" id="stepStatus">⟳ Starting...</div></div>`;
        
        try {
            const tokenAddress = currentTokenData.address;
            const tokenAmount = parseFloat(tokenAmountInput.value);
            const pairAmount = parseFloat(pairAmountInput.value);
            if (!tokenAddress) throw new Error("Invalid token");
            
            let decimals = currentTokenData.decimals || 18;
            const tokenAmountWei = parseUnits(tokenAmount.toString(), decimals);
            
            // Step 1: Approve Custom Token
            statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-active" id="stepStatus">📝 Step 1/3: Approving ${currentTokenData.symbol || 'Token'}...</div></div>`;
            
            const approveSim = await simulateContract(wagmiConfig, {
                address: tokenAddress, abi: erc20Abi, functionName: "approve",
                args: [CONTRACT_ADDRESS, tokenAmountWei], account: currentAccount, chainId: polygon.id
            });
            await writeContract(wagmiConfig, approveSim.request);
            
            statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-success">✅ Step 1/3: ${currentTokenData.symbol || 'Token'} approved</div><div class="step-line step-active" id="stepStatus">📝 Step 2/3: Preparing deposit...</div></div>`;
            
            // Step 2: Approve USDT if needed
            if (currentPair === 'USDT') {
                statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-success">✅ Step 1/3: ${currentTokenData.symbol || 'Token'} approved</div><div class="step-line step-active" id="stepStatus">📝 Step 2/3: Approving USDT...</div></div>`;
                
                const usdtAmountWei = parseUnits(pairAmount.toString(), 6);
                const approveUsdtSim = await simulateContract(wagmiConfig, {
                    address: USDT_ADDRESS, abi: erc20Abi, functionName: "approve",
                    args: [CONTRACT_ADDRESS, usdtAmountWei], account: currentAccount, chainId: polygon.id
                });
                await writeContract(wagmiConfig, approveUsdtSim.request);
                
                statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-success">✅ Step 1/3: ${currentTokenData.symbol || 'Token'} approved</div><div class="step-line step-success">✅ Step 2/3: USDT approved</div><div class="step-line step-active" id="stepStatus">📝 Step 3/3: Depositing...</div></div>`;
            } else {
                statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-success">✅ Step 1/2: ${currentTokenData.symbol || 'Token'} approved</div><div class="step-line step-active" id="stepStatus">📝 Step 2/2: Depositing...</div></div>`;
            }
            
            // Step 3: Deposit
            let tokenA, amountA, tokenB, amountB, value = 0n;
            if (currentPair === 'USDT') {
                tokenA = USDT_ADDRESS;
                amountA = parseUnits(pairAmount.toString(), 6);
                tokenB = tokenAddress;
                amountB = tokenAmountWei;
                value = 0n;
            } else {
                tokenA = tokenAddress;
                amountA = tokenAmountWei;
                tokenB = NATIVE_POL;
                amountB = parseUnits(pairAmount.toString(), 18);
                value = parseUnits(pairAmount.toString(), 18);
            }
            
            const depositSim = await simulateContract(wagmiConfig, {
                address: CONTRACT_ADDRESS, abi: ROUTER_ABI, functionName: "depositPair",
                args: [tokenA, amountA, tokenB, amountB], account: currentAccount, chainId: polygon.id, value
            });
            await writeContract(wagmiConfig, depositSim.request);
            
            statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-success">✅ All steps completed!</div><div class="step-line step-success">🎉 Position created successfully!</div></div>`;
            setTimeout(() => closeBottomPopup(), 3000);
            
        } catch(error) {
            console.error(error);
            statusDiv.innerHTML = `<div class="status-step"><div class="step-line step-error">❌ Error: ${error.message.slice(0,100)}</div></div>`;
        }
    }

    function closeBottomPopup() { bottomPopup.classList.remove('show'); overlay.classList.remove('show'); }
    function checkReviewButton() {
        const ready = currentExchange && currentPair && currentToken && parseFloat(pairAmountInput.value) > 0 && parseFloat(tokenAmountInput.value) > 0;
        reviewBtn.disabled = !ready;
        if (ready) reviewBtn.classList.remove('disabled');
        else reviewBtn.classList.add('disabled');
    }
    function enableAmountFields() { pairAmountInput.disabled = tokenAmountInput.disabled = maxTokenBtn.disabled = false; pairAmountInput.classList.remove('disabled'); tokenAmountInput.classList.remove('disabled'); maxTokenBtn.classList.remove('disabled'); }
    function disableAmountFields() { pairAmountInput.disabled = tokenAmountInput.disabled = maxTokenBtn.disabled = true; pairAmountInput.classList.add('disabled'); tokenAmountInput.classList.add('disabled'); maxTokenBtn.classList.add('disabled'); pairAmountInput.value = tokenAmountInput.value = ''; }
    function unlockPoolType() { poolBtn.classList.remove('disabled'); }
    function rebuildPoolPopup() {
        poolOptionsList.innerHTML = '';
        if (!currentExchange) return;
        let active = currentExchange === 'Uniswap' ? [{ value: 'V4' }, { value: 'V3' }] : [{ value: 'V3' }];
        active.forEach(opt => {
            let div = document.createElement('div'); div.className = 'option-item'; div.textContent = opt.value;
            div.onclick = () => { currentPool = opt.value; poolLabel.innerText = opt.value; closeAllPopups(); checkReviewButton(); };
            poolOptionsList.appendChild(div);
        });
    }
    function updatePairDisplay(value) { currentPair = value; pairLabel.innerText = value; updatePairAmountLabel(); if (currentPair && currentToken) enableAmountFields(); checkReviewButton(); if (currentPair === 'Polygon') getPolygonPrice(); }
    function updateTokenDisplay() { tokenLabel.innerText = currentTokenData.symbol || 'Token'; updateTokenAmountLabel(); if (currentPair && currentToken) enableAmountFields(); checkReviewButton(); }
    function updateTokenReward() { let amt = parseFloat(tokenAmountInput.value); if (amt > 0 && currentToken) { let fee = amt * 0.02; tokenRewardInfo.style.display = 'block'; tokenRewardInfo.innerHTML = `Amount: ${formatNumberForBox(amt)} | Fee (2%): ${formatNumberForBox(fee)} | To Pool: ${formatNumberForBox(amt - fee)}`; } else tokenRewardInfo.style.display = 'none'; checkReviewButton(); }
    function updateUSDTBonus() { let amt = parseFloat(pairAmountInput.value); if (amt > 0 && currentToken && currentPair) { usdtRewardInfo.style.display = 'block'; usdtRewardInfo.className = 'reward-info success'; usdtRewardInfo.innerHTML = currentPair === 'USDT' ? `Amount: ${formatNumberForBox(amt)} USDT` : `Amount: ${formatNumberForBox(amt)} POL ≈ $${formatNumberForBox(amt * (polygonPrice || 0))}`; } else usdtRewardInfo.style.display = 'none'; checkReviewButton(); }
    function updatePairAmountLabel() { pairAmountLabel.innerText = currentPair === 'Polygon' ? 'POL Amount' : 'USDT Amount'; }
    function updateTokenAmountLabel() { tokenAmountLabel.innerText = (currentTokenData.symbol || 'Token') + ' Amount'; }
    function closeAllPopups() { [exchangePopup, poolPopup, pairPopup, tokenPopup].forEach(p => p.style.display = 'none'); }
    function openPopup(p) { closeAllPopups(); p.style.display = 'block'; }
    
    exchangeBtn.onclick = () => openPopup(exchangePopup);
    document.querySelectorAll('#exchangePopup .option-item').forEach(opt => {
        opt.onclick = () => {
            currentExchange = opt.getAttribute('data-value');
            exchangeLabel.innerText = currentExchange;
            unlockPoolType();
            disableAmountFields();
            currentPool = currentExchange === 'Uniswap' ? 'V4' : 'V3';
            poolLabel.innerText = currentPool;
            currentPair = ''; pairLabel.innerText = 'Select pair';
            currentToken = ''; currentTokenData = { address: '', symbol: '', name: '', balance: 0, decimals: 0 };
            tokenLabel.innerText = 'Select token';
            rebuildPoolPopup();
            closeAllPopups();
            checkReviewButton();
        };
    });
    poolBtn.onclick = () => { if (currentExchange) { rebuildPoolPopup(); openPopup(poolPopup); } };
    pairBtn.onclick = () => { if (currentExchange) { buildPairPopup(); openPopup(pairPopup); } };
    tokenBtn.onclick = () => { if (currentExchange) openPopup(tokenPopup); };
    confirmBtn.onclick = () => { if (contractInput.value.trim() && currentTokenData.symbol) { currentToken = contractInput.value.trim(); updateTokenDisplay(); } closeAllPopups(); };
    clearBtn.onclick = () => { currentToken = ''; currentTokenData = { address: '', symbol: '', name: '', balance: 0, decimals: 0 }; contractInput.value = ''; tokenAmountInput.value = ''; updateTokenDisplay(); disableAmountFields(); closeAllPopups(); checkReviewButton(); };
    maxTokenBtn.onclick = () => { if (currentToken && currentPair && currentTokenData.balance > 0) { tokenAmountInput.value = currentTokenData.balance; updateTokenReward(); } };
    reviewBtn.onclick = showBottomPopup;
    closeBottomPopupBtn.onclick = closeBottomPopup;
    overlay.onclick = closeBottomPopup;
    pairAmountInput.addEventListener('input', () => { updateUSDTBonus(); checkReviewButton(); });
    tokenAmountInput.addEventListener('input', () => { updateTokenReward(); checkReviewButton(); });
    
    getPolygonPrice();
    setInterval(() => { if (currentAccount) { fetchUSDTBalance(); fetchPOLBalance(); } }, 30000);
    setInterval(getPolygonPrice, 30000);
    
    buildPairPopup();
    updatePairAmountLabel();
    updateTokenAmountLabel();
    checkReviewButton();
</script>
</body>
    </html>
