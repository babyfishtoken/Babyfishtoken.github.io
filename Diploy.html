<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصال کیف پول</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    background: #0f172a;
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  
  .container {
    background: #1e293b;
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    min-width: 300px;
  }
  
  h2 {
    margin-bottom: 20px;
    font-size: 20px;
  }
  
  #wallet-btn {
    display: flex;
    justify-content: center;
  }
  
  #status {
    margin-top: 16px;
    font-size: 14px;
    color: #94a3b8;
    padding: 10px;
    background: #0f172a;
    border-radius: 8px;
  }
  
  #status.connected {
    color: #22c55e;
  }
  
  #status.error {
    color: #ef4444;
  }
</style>
</head>
<body>

<div class="container">
  <h2>🟣 اتصال به پالیگان</h2>
  <div id="wallet-btn"></div>
  <div id="status">⏳ منتظر اتصال...</div>
</div>

<script type="importmap">
{
  "imports": {
    "@web3modal/wagmi": "https://esm.sh/@web3modal/wagmi@4",
    "wagmi": "https://esm.sh/wagmi@2",
    "viem": "https://esm.sh/viem@2",
    "viem/chains": "https://esm.sh/viem@2/chains"
  }
}
</script>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig } from "@web3modal/wagmi";
import { polygon, polygonAmoy } from "viem/chains";
import { watchAccount, watchNetwork } from "wagmi";

const projectId = "96f13374b0fe2f629a925617de0a2ba3";

const metadata = {
  name: "Polygon App",
  description: "اتصال به پالیگان",
  url: window.location.origin,
  icons: []
};

// فقط پالیگان و آمُی
const chains = [polygon, polygonAmoy];

const wagmiConfig = defaultWagmiConfig({
  chains,
  projectId,
  metadata
});

const modal = createWeb3Modal({
  wagmiConfig,
  projectId,
  chains
});

// ساخت دکمه
const btn = document.createElement("w3m-button");
document.getElementById("wallet-btn").appendChild(btn);

// وضعیت
const statusEl = document.getElementById("status");

watchAccount(wagmiConfig, {
  onChange(account) {
    if (account?.address) {
      const addr = account.address;
      statusEl.innerHTML = `✅ ${addr.slice(0,6)}...${addr.slice(-4)}`;
      statusEl.className = "connected";
    } else {
      statusEl.innerHTML = "⏳ منتظر اتصال...";
      statusEl.className = "";
    }
  }
});

watchNetwork(wagmiConfig, {
  onChange(network) {
    const chainId = network?.chain?.id;
    if (chainId && chainId !== 137 && chainId !== 80002) {
      statusEl.innerHTML = "⚠️ لطفاً به شبکه پالیگان بروید";
      statusEl.className = "error";
    }
  }
});
</script>

</body>
</html>
