<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Test</title>
</head>
<body style="background:#0f172a;color:white;text-align:center;padding-top:100px;font-family:sans-serif;">

<h2>Wallet Connect Test</h2>

<div id="wallet-btn"></div>

<script type="module">

import { createWeb3Modal, defaultWagmiConfig }
from "https://esm.sh/@web3modal/wagmi";

import { polygon, polygonAmoy }
from "https://esm.sh/wagmi/chains";

const projectId = "96f13374b0fe2f629a925617de0a2ba3";

const metadata = {
  name: "Test App",
  description: "Wallet Test",
  url: "https://example.com",
  icons: []
};

const chains = [polygon, polygonAmoy];

const wagmiConfig = defaultWagmiConfig({
  chains,
  projectId,
  metadata
});

createWeb3Modal({
  wagmiConfig,
  projectId,
  chains
});

const btn = document.createElement("w3m-button");
document.getElementById("wallet-btn").appendChild(btn);

</script>

</body>
</html>
