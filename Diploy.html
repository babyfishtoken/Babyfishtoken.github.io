<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساخت توکن روی پالیگان</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0f172a;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    padding: 32px;
    border-radius: 16px;
    max-width: 450px;
    width: 100%;
    border: 1px solid #334155;
  }
  h2 {
    color: white;
    text-align: center;
    margin-bottom: 24px;
    font-size: 22px;
  }
  label {
    color: #94a3b8;
    font-size: 14px;
    font-weight: 600;
    display: block;
    margin-top: 12px;
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    padding: 12px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #7c3aed; }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  #connectBtn {
    background: #7c3aed;
    color: white;
  }
  #connectBtn:hover { background: #6d28d9; }
  #connectBtn.connected { background: #22c55e; }
  #deployBtn {
    background: #f59e0b;
    color: #0f172a;
  }
  #deployBtn:hover:not(:disabled) { background: #d97706; }
  #deployBtn:disabled {
    background: #475569;
    color: #94a3b8;
    cursor: not-allowed;
  }
  #status {
    margin-top: 16px;
    padding: 12px;
    background: #0f172a;
    border-radius: 8px;
    color: #94a3b8;
    font-size: 14px;
    text-align: center;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #status.green { color: #22c55e; }
  #status.red { color: #ef4444; }
  #status.yellow { color: #f59e0b; }
</style>
</head>
<body>

<div class="card">
  <h2>🚀 ساخت توکن روی پالیگان</h2>

  <label>نام توکن</label>
  <input type="text" id="tokenName" placeholder="مثلاً: MyCoin" value="TestToken">

  <label>نماد توکن</label>
  <input type="text" id="tokenSymbol" placeholder="مثلاً: TKN" value="TEST">

  <label>تعداد کل (با ۱۸ رقم اعشار)</label>
  <input type="number" id="initialSupply" placeholder="مثلاً: 1000000" value="1000000">

  <button id="connectBtn">🔗 اتصال کیف پول</button>
  <button id="deployBtn" disabled>⛏ استقرار توکن</button>

  <div id="status">⏳ منتظر اتصال...</div>
</div>

<script type="importmap">
{
  "imports": {
    "viem": "https://esm.sh/viem@2.x",
    "viem/chains": "https://esm.sh/viem@2.x/chains"
  }
}
</script>

<script type="module">
import { createWalletClient, custom, parseUnits, encodeFunctionData } from "viem";
import { polygon, polygonAmoy } from "viem/chains";

// ======== آدرس قرارداد شما ========
const CONTRACT_ADDRESS = "0x66168b1Abbf9b944052880F6Cc6331b8F9339d5D";

// ======== ABI قرارداد فکتوری ========
const CONTRACT_ABI = [
  {
    "inputs": [
      { "internalType": "string", "name": "name", "type": "string" },
      { "internalType": "string", "name": "symbol", "type": "string" },
      { "internalType": "uint256", "name": "initialSupply", "type": "uint256" }
    ],
    "name": "createToken",
    "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
    "stateMutability": "nonpayable",
    "type": "function"
  }
];

// ======== المان‌ها ========
const connectBtn = document.getElementById('connectBtn');
const deployBtn = document.getElementById('deployBtn');
const statusEl = document.getElementById('status');
const nameInput = document.getElementById('tokenName');
const symbolInput = document.getElementById('tokenSymbol');
const supplyInput = document.getElementById('initialSupply');

let walletClient = null;
let account = null;
let chainId = null;

function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = type || '';
}

// ======== اتصال کیف پول ========
async function connectWallet() {
  if (!window.ethereum) {
    setStatus('❌ متاماسک نصب نیست!', 'red');
    return;
  }

  try {
    setStatus('⏳ در حال اتصال...', 'yellow');
    connectBtn.disabled = true;

    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    account = accounts[0];

    const chainIdHex = await window.ethereum.request({ method: 'eth_chainId' });
    chainId = parseInt(chainIdHex, 16);

    if (chainId !== 137 && chainId !== 80002) {
      setStatus('⚠️ لطفاً شبکه را به پالیگان تغییر دهید', 'red');
      connectBtn.disabled = false;
      connectBtn.textContent = '🔄 تغییر به پالیگان';
      connectBtn.onclick = async () => {
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: '0x89' }]
          });
        } catch (e) {}
      };
      return;
    }

    walletClient = createWalletClient({
      chain: chainId === 137 ? polygon : polygonAmoy,
      transport: custom(window.ethereum)
    });

    const shortAddr = `${account.slice(0,6)}...${account.slice(-4)}`;
    setStatus(`✅ متصل: ${shortAddr}`, 'green');
    connectBtn.textContent = '✅ متصل شد';
    connectBtn.classList.add('connected');
    connectBtn.disabled = false;
    deployBtn.disabled = false;

    connectBtn.onclick = () => { window.location.reload(); };

  } catch (error) {
    setStatus(`❌ ${error.message}`, 'red');
    connectBtn.disabled = false;
  }
}

// ======== استقرار توکن ========
async function deployToken() {
  if (!walletClient || !account) {
    setStatus('❌ ابتدا کیف پول را متصل کنید', 'red');
    return;
  }

  const name = nameInput.value.trim();
  const symbol = symbolInput.value.trim();
  const supply = supplyInput.value.trim();

  if (!name || !symbol || !supply) {
    setStatus('❌ همه فیلدها را پر کنید', 'red');
    return;
  }

  if (isNaN(supply) || Number(supply) <= 0) {
    setStatus('❌ مقدار معتبر وارد کنید', 'red');
    return;
  }

  deployBtn.disabled = true;
  setStatus('⏳ در حال ارسال تراکنش...', 'yellow');

  try {
    const supplyWei = parseUnits(supply, 18);

    const data = encodeFunctionData({
      abi: CONTRACT_ABI,
      functionName: 'createToken',
      args: [name, symbol, supplyWei]
    });

    const hash = await walletClient.sendTransaction({
      account: account,
      to: CONTRACT_ADDRESS,
      data: data
    });

    setStatus(`⏳ در حال تایید... هش: ${hash.slice(0,10)}...`, 'yellow');

    const receipt = await walletClient.waitForTransactionReceipt({ hash });
    
    if (receipt.status === 'success') {
      setStatus(`✅ توکن "${name}" ساخته شد! 🎉`, 'green');
      deployBtn.textContent = '✅ ساخته شد';
    } else {
      setStatus('❌ تراکنش ناموفق بود', 'red');
    }

  } catch (error) {
    console.error(error);
    if (error.message?.includes('rejected')) {
      setStatus('❌ تراکنش رد شد', 'red');
    } else {
      setStatus(`❌ ${error.message}`, 'red');
    }
  }

  deployBtn.disabled = false;
}

// ======== رویدادها ========
connectBtn.addEventListener('click', connectWallet);
deployBtn.addEventListener('click', deployToken);

if (window.ethereum) {
  window.ethereum.on('chainChanged', () => window.location.reload());
  window.ethereum.on('accountsChanged', () => window.location.reload());
}

// بررسی اتصال قبلی
(async function init() {
  if (window.ethereum) {
    try {
      const accounts = await window.ethereum.request({ method: 'eth_accounts' });
      if (accounts && accounts.length > 0) {
        account = accounts[0];
        const chainIdHex = await window.ethereum.request({ method: 'eth_chainId' });
        chainId = parseInt(chainIdHex, 16);
        if (chainId === 137 || chainId === 80002) {
          walletClient = createWalletClient({
            chain: chainId === 137 ? polygon : polygonAmoy,
            transport: custom(window.ethereum)
          });
          const shortAddr = `${account.slice(0,6)}...${account.slice(-4)}`;
          setStatus(`✅ متصل: ${shortAddr}`, 'green');
          connectBtn.textContent = '✅ متصل شد';
          connectBtn.classList.add('connected');
          deployBtn.disabled = false;
        }
      }
    } catch (e) {}
  }
})();
</script>

</body>
</html>
