<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصال کیف پول - پالیگان</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f172a;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  background: #1e293b;
  padding: 48px 40px;
  border-radius: 24px;
  max-width: 500px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  border: 1px solid #334155;
}
.logo {
  font-size: 48px;
  margin-bottom: 12px;
}
h2 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #a855f7, #6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  color: #94a3b8;
  font-size: 14px;
  margin-bottom: 32px;
}
.network-badge {
  display: inline-block;
  background: #22c55e20;
  color: #22c55e;
  border: 1px solid #22c55e40;
  padding: 6px 18px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 24px;
}
#wallet-btn {
  display: flex;
  justify-content: center;
  margin: 16px 0;
}
w3m-button {
  --w3m-accent: #8247e5;
  --w3m-border-radius: 12px;
  width: 100% !important;
}
.status-box {
  margin-top: 20px;
  padding: 14px;
  background: #0f172a;
  border-radius: 12px;
  border: 1px solid #334155;
  font-size: 14px;
  color: #94a3b8;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.status-box.connected {
  border-color: #22c55e;
  color: #22c55e;
}
.status-box.error {
  border-color: #ef4444;
  color: #ef4444;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.dot.green { background: #22c55e; }
.dot.red { background: #ef4444; }
.dot.yellow { background: #eab308; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🟣</div>
  <h2>اتصال کیف پول</h2>
  <p class="subtitle">فقط شبکه پالیگان (Polygon)</p>
  
  <div class="network-badge">✅ Polygon Mainnet + Amoy Testnet</div>
  
  <div id="wallet-btn"></div>
  
  <div id="status" class="status-box">
    <span class="dot yellow"></span>
    در انتظار اتصال کیف پول...
  </div>
</div>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig } 
from "https://esm.sh/@web3modal/wagmi";

import { polygon, polygonAmoy } 
from "https://esm.sh/wagmi/chains";

import { watchAccount } from "https://esm.sh/wagmi";

const projectId = "96f13374b0fe2f629a925617de0a2ba3";

const metadata = {
  name: "Polygon Token Maker",
  description: "ساخت توکن روی شبکه پالیگان",
  url: window.location.origin,
  icons: []
};

// ✅ فقط همین دو شبکه مجاز هستند
const chains = [polygon, polygonAmoy];

const wagmiConfig = defaultWagmiConfig({
  chains,
  projectId,
  metadata
});

const web3modal = createWeb3Modal({
  wagmiConfig,
  projectId,
  chains
});

// ساخت دکمه
const btn = document.createElement("w3m-button");
document.getElementById("wallet-btn").appendChild(btn);

// وضعیت اتصال
const statusEl = document.getElementById("status");

watchAccount(wagmiConfig, {
  onChange(account) {
    if (account?.address) {
      const addr = account.address;
      statusEl.innerHTML = `
        <span class="dot green"></span>
        ✅ متصل: ${addr.slice(0,6)}...${addr.slice(-4)}
      `;
      statusEl.className = "status-box connected";
    } else {
      statusEl.innerHTML = `
        <span class="dot yellow"></span>
        در انتظار اتصال کیف پول...
      `;
      statusEl.className = "status-box";
    }
  }
});

// بررسی تغییر شبکه
import { watchNetwork } from "https://esm.sh/wagmi";

watchNetwork(wagmiConfig, {
  onChange(network) {
    const chainId = network?.chain?.id;
    if (chainId && chainId !== 137 && chainId !== 80002) {
      statusEl.innerHTML = `
        <span class="dot red"></span>
        ⚠️ لطفاً شبکه را به Polygon (پالیگان) تغییر دهید
      `;
      statusEl.className = "status-box error";
    } else if (chainId === 137) {
      statusEl.innerHTML = `
        <span class="dot green"></span>
        ✅ متصل به Polygon Mainnet
      `;
      statusEl.className = "status-box connected";
    } else if (chainId === 80002) {
      statusEl.innerHTML = `
        <span class="dot green"></span>
        ✅ متصل به Polygon Amoy (تست)
      `;
      statusEl.className = "status-box connected";
    }
  }
});

</script>

</body>
</html>
