<!DOCTYPE html>
<html>
<body style="background:#111;color:white;padding:30px">

<div id="wallet-btn"></div>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig }
from "https://esm.sh/@web3modal/wagmi";

import { polygon }
from "https://esm.sh/wagmi/chains";

const projectId = "96f13374b0fe2f629a925617de0a2ba3";

const wagmiConfig = defaultWagmiConfig({
  chains:[polygon],
  projectId,
  metadata:{
    name:"Test",
    description:"Test",
    url:"https://example.com",
    icons:[]
  }
});

createWeb3Modal({
  wagmiConfig,
  projectId,
  chains:[polygon]
});

document
.getElementById("wallet-btn")
.appendChild(document.createElement("w3m-button"));

document.body.insertAdjacentHTML(
"beforeend",
"<h3>Web3Modal Loaded Successfully</h3>"
);

</script>

</body>
</html>
