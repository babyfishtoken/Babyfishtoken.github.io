<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساخت توکن روی پالیگان</title>
<style>
  body {
    background: #0f172a;
    color: white;
    text-align: center;
    padding-top: 40px;
    font-family: sans-serif;
    margin: 0;
  }
  .container {
    max-width: 450px;
    margin: 0 auto;
    padding: 0 20px;
  }
  h2 {
    margin-bottom: 8px;
  }
  .sub {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 24px;
  }
  #wallet-btn {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .form-group {
    text-align: left;
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .form-group input {
    width: 100%;
    padding: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
  }
  .form-group input:focus {
    border-color: #7c3aed;
  }
  #deployBtn {
    width: 100%;
    padding: 14px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.2s;
  }
  #deployBtn:hover:not(:disabled) {
    background: #6d28d9;
  }
  #deployBtn:disabled {
    background: #475569;
    color: #94a3b8;
    cursor: not-allowed;
  }
  #status {
    margin-top: 16px;
    padding: 12px;
    background: #1e293b;
    border-radius: 8px;
    color: #94a3b8;
    font-size: 14px;
    min-height: 44px;
  }
  #status.connected { color: #22c55e; }
  #status.error { color: #ef4444; }
  #status.loading { color: #f59e0b; }
</style>
</head>
<body>

<div class="container">
  <h2>🚀 ساخت توکن روی پالیگان</h2>
  <p class="sub">کیف پول خود را متصل کنید و توکن بسازید</p>

  <!-- دکمه اتصال شما -->
  <div id="wallet-btn"></div>

  <div class="form-group">
    <label>نام توکن</label>
    <input type="text" id="tokenName" placeholder="مثلاً: MyCoin" value="TestToken">
  </div>

  <div class="form-group">
    <label>نماد توکن</label>
    <input type="text" id="tokenSymbol" placeholder="مثلاً: TKN" value="TEST">
  </div>

  <div class="form-group">
    <label>تعداد کل (با ۱۸ رقم اعشار)</label>
    <input type="number" id="initialSupply" placeholder="مثلاً: 1000000" value="1000000">
  </div>

  <button id="deployBtn" disabled>⛏ استقرار توکن</button>

  <div id="status">⏳ منتظر اتصال کیف پول...</div>
</div>

<script type="importmap">
{
  "imports": {
    "@web3modal/wagmi": "https://esm.sh/@web3modal/wagmi@4",
    "wagmi": "https://esm.sh/wagmi@2",
    "viem": "https://esm.sh/viem@2",
    "viem/chains": "https://esm.sh/viem@2/chains"
  }
}
</script>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig } from "@web3modal/wagmi";
import { polygon, polygonAmoy } from "viem/chains";
import { watchAccount, watchNetwork, getAccount, getNetwork, getWalletClient, getPublicClient } from "wagmi";
import { parseUnits, encodeFunctionData } from "viem";

// ======== تنظیمات ========
const CONTRACT_ADDRESS = "0x66168b1Abbf9b944052880F6Cc6331b8F9339d5D";
const CONTRACT_ABI = [{
  "inputs": [
    { "internalType": "string", "name": "name", "type": "string" },
    { "internalType": "string", "name": "symbol", "type": "string" },
    { "internalType": "uint256", "name": "initialSupply", "type": "uint256" }
  ],
  "name": "createToken",
  "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
  "stateMutability": "nonpayable",
  "type": "function"
}];

// ======== کد خود شما (دقیقاً همین) ========
const projectId = "96f13374b0fe2f629a925617de0a2ba3";

const metadata = {
  name: "My Polygon Website",
  description: "Web3 Polygon App",
  url: "babyfishtoken.github.io",
  icons: []
};

const chains = [polygon, polygonAmoy];

const wagmiConfig = defaultWagmiConfig({
  chains,
  projectId,
  metadata
});

createWeb3Modal({
  wagmiConfig,
  projectId,
  chains
});

// دکمه را دستی می‌سازیم (دقیقاً مثل کد خودتان)
const btn = document.createElement("w3m-button");
document.getElementById("wallet-btn").appendChild(btn);

// ======== المان‌ها ========
const deployBtn = document.getElementById('deployBtn');
const statusEl = document.getElementById('status');
const nameInput = document.getElementById('tokenName');
const symbolInput = document.getElementById('tokenSymbol');
const supplyInput = document.getElementById('initialSupply');

function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = type || '';
}

function checkConnection() {
  const account = getAccount(wagmiConfig);
  const network = getNetwork(wagmiConfig);
  const chainId = network?.chain?.id;
  
  if (account?.address && (chainId === 137 || chainId === 80002)) {
    setStatus(`✅ ${account.address.slice(0,6)}...${account.address.slice(-4)}`, 'connected');
    deployBtn.disabled = false;
  } else if (account?.address) {
    setStatus('⚠️ شبکه را به پالیگان تغییر دهید', 'error');
    deployBtn.disabled = true;
  } else {
    setStatus('⏳ منتظر اتصال کیف پول...', '');
    deployBtn.disabled = true;
  }
}

watchAccount(wagmiConfig, { onChange: checkConnection });
watchNetwork(wagmiConfig, { onChange: checkConnection });
checkConnection();

// ======== ساخت توکن ========
deployBtn.addEventListener('click', async () => {
  const account = getAccount(wagmiConfig);
  if (!account?.address) { 
    setStatus('❌ کیف پول متصل نیست', 'error'); 
    return; 
  }

  const name = nameInput.value.trim();
  const symbol = symbolInput.value.trim();
  const supply = supplyInput.value.trim();
  
  if (!name || !symbol || !supply) { 
    setStatus('❌ همه فیلدها را پر کنید', 'error'); 
    return; 
  }
  if (isNaN(supply) || Number(supply) <= 0) { 
    setStatus('❌ مقدار معتبر نیست', 'error'); 
    return; 
  }

  deployBtn.disabled = true;
  setStatus('⏳ در حال ارسال تراکنش...', 'loading');

  try {
    const walletClient = await getWalletClient(wagmiConfig);
    const data = encodeFunctionData({
      abi: CONTRACT_ABI,
      functionName: 'createToken',
      args: [name, symbol, parseUnits(supply, 18)]
    });

    const hash = await walletClient.sendTransaction({
      account: account.address,
      to: CONTRACT_ADDRESS,
      data
    });

    setStatus(`⏳ تایید تراکنش... ${hash.slice(0,10)}...`, 'loading');

    const publicClient = getPublicClient(wagmiConfig);
    const receipt = await publicClient.waitForTransactionReceipt({ hash });

    if (receipt.status === 'success') {
      setStatus(`✅ توکن "${name}" با موفقیت ساخته شد! 🎉`, 'connected');
      deployBtn.textContent = '✅ ساخته شد';
    } else {
      setStatus('❌ تراکنش ناموفق بود', 'error');
    }

  } catch (error) {
    console.error(error);
    if (error.message?.includes('rejected')) {
      setStatus('❌ تراکنش توسط کاربر رد شد', 'error');
    } else {
      setStatus(`❌ ${error.message}`, 'error');
    }
  }
  
  deployBtn.disabled = false;
});

</script>

</body>
</html>
