<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساخت توکن روی پالیگان</title>
<style>
  body {
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 40px 20px;
    font-family: sans-serif;
    margin: 0;
  }
  .box {
    max-width: 420px;
    margin: 0 auto;
  }
  h2 {
    margin-bottom: 8px;
    font-size: 22px;
  }
  .sub {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .field {
    text-align: left;
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    padding: 11px 14px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
  }
  .field input:focus {
    border-color: #7c3aed;
  }
  #deployBtn {
    width: 100%;
    padding: 14px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    transition: 0.2s;
  }
  #deployBtn:hover:not(:disabled) {
    background: #6d28d9;
  }
  #deployBtn:disabled {
    background: #475569;
    color: #94a3b8;
    cursor: not-allowed;
  }
  #status {
    margin-top: 16px;
    padding: 12px;
    background: #1e293b;
    border-radius: 8px;
    color: #94a3b8;
    font-size: 14px;
    min-height: 44px;
  }
  #status.ok { color: #22c55e; }
  #status.err { color: #ef4444; }
  #status.wait { color: #f59e0b; }
  
  /* استایل دکمه Web3Modal */
  w3m-button {
    display: block;
    width: 100%;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="box">
  <h2>🚀 ساخت توکن</h2>
  <p class="sub">روی شبکه پالیگان</p>

  <w3m-button></w3m-button>

  <div class="field">
    <label>نام توکن</label>
    <input type="text" id="tokenName" placeholder="مثلاً MyCoin" value="TestToken">
  </div>
  <div class="field">
    <label>نماد توکن</label>
    <input type="text" id="tokenSymbol" placeholder="مثلاً TKN" value="TEST">
  </div>
  <div class="field">
    <label>تعداد کل</label>
    <input type="number" id="initialSupply" placeholder="مثلاً 1000000" value="1000000">
  </div>

  <button id="deployBtn" disabled>⛏ ساخت توکن</button>
  <div id="status">⏳ منتظر اتصال...</div>
</div>

<script type="importmap">
{
  "imports": {
    "@web3modal/wagmi": "https://esm.sh/@web3modal/wagmi@4",
    "wagmi": "https://esm.sh/wagmi@2",
    "viem": "https://esm.sh/viem@2",
    "viem/chains": "https://esm.sh/viem@2/chains"
  }
}
</script>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig } from "@web3modal/wagmi";
import { polygon, polygonAmoy } from "viem/chains";
import { watchAccount, watchNetwork, getAccount, getNetwork, getWalletClient, getPublicClient } from "wagmi";
import { parseUnits, encodeFunctionData } from "viem";

// ======== تنظیمات ========
const CONTRACT_ADDRESS = "0x66168b1Abbf9b944052880F6Cc6331b8F9339d5D";
const CONTRACT_ABI = [{
  "inputs": [
    { "internalType": "string", "name": "name", "type": "string" },
    { "internalType": "string", "name": "symbol", "type": "string" },
    { "internalType": "uint256", "name": "initialSupply", "type": "uint256" }
  ],
  "name": "createToken",
  "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
  "stateMutability": "nonpayable",
  "type": "function"
}];

// ======== Web3Modal ========
const projectId = "96f13374b0fe2f629a925617de0a2ba3";
const metadata = {
  name: "Polygon Token Maker",
  description: "ساخت توکن روی پالیگان",
  url: window.location.origin,
  icons: []
};
const chains = [polygon, polygonAmoy];
const wagmiConfig = defaultWagmiConfig({ chains, projectId, metadata });

createWeb3Modal({ 
  wagmiConfig, 
  projectId, 
  chains,
  enableOnramp: false 
});

// ======== المان‌ها ========
const deployBtn = document.getElementById('deployBtn');
const statusEl = document.getElementById('status');
const nameInput = document.getElementById('tokenName');
const symbolInput = document.getElementById('tokenSymbol');
const supplyInput = document.getElementById('initialSupply');

function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = type || '';
}

function checkConnection() {
  const account = getAccount(wagmiConfig);
  const network = getNetwork(wagmiConfig);
  const chainId = network?.chain?.id;
  if (account?.address && (chainId === 137 || chainId === 80002)) {
    setStatus(`✅ ${account.address.slice(0,6)}...${account.address.slice(-4)}`, 'ok');
    deployBtn.disabled = false;
  } else if (account?.address) {
    setStatus('⚠️ شبکه را به پالیگان تغییر دهید', 'err');
    deployBtn.disabled = true;
  } else {
    setStatus('⏳ منتظر اتصال...', '');
    deployBtn.disabled = true;
  }
}

watchAccount(wagmiConfig, { onChange: checkConnection });
watchNetwork(wagmiConfig, { onChange: checkConnection });
checkConnection();

// ======== ساخت توکن ========
deployBtn.addEventListener('click', async () => {
  const account = getAccount(wagmiConfig);
  if (!account?.address) { setStatus('❌ کیف پول متصل نیست', 'err'); return; }

  const name = nameInput.value.trim();
  const symbol = symbolInput.value.trim();
  const supply = supplyInput.value.trim();
  if (!name || !symbol || !supply) { setStatus('❌ همه فیلدها را پر کنید', 'err'); return; }
  if (isNaN(supply) || Number(supply) <= 0) { setStatus('❌ مقدار معتبر نیست', 'err'); return; }

  deployBtn.disabled = true;
  setStatus('⏳ در حال ارسال...', 'wait');

  try {
    const walletClient = await getWalletClient(wagmiConfig);
    const data = encodeFunctionData({
      abi: CONTRACT_ABI,
      functionName: 'createToken',
      args: [name, symbol, parseUnits(supply, 18)]
    });

    const hash = await walletClient.sendTransaction({
      account: account.address,
      to: CONTRACT_ADDRESS,
      data
    });

    setStatus(`⏳ تایید... ${hash.slice(0,10)}...`, 'wait');

    const publicClient = getPublicClient(wagmiConfig);
    const receipt = await publicClient.waitForTransactionReceipt({ hash });

    setStatus(receipt.status === 'success' ? `✅ "${name}" ساخته شد! 🎉` : '❌ ناموفق', receipt.status === 'success' ? 'ok' : 'err');

  } catch (e) {
    setStatus(`❌ ${e.message?.includes('rejected') ? 'رد شد' : e.message}`, 'err');
  }
  deployBtn.disabled = false;
});
</script>

</body>
</html>
