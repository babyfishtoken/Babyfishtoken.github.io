<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polygon Token Creator</title>

<style>
body{
background:#0f172a;
color:#fff;
font-family:Arial,sans-serif;
margin:0;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
}

h2{
text-align:center;
}

#wallet-btn{
display:flex;
justify-content:center;
margin:20px 0;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#334155;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#7c3aed;
color:white;
font-size:16px;
cursor:pointer;
}

#status{
margin-top:15px;
padding:10px;
background:#0f172a;
border-radius:8px;
word-break:break-all;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>🚀 Polygon Token Creator</h2>

<div id="wallet-btn"></div>

<input id="tokenName" placeholder="Token Name">

<input id="tokenSymbol" placeholder="Token Symbol">

<input id="tokenSupply" type="number" placeholder="Initial Supply">

<button id="createBtn">
Create Token
</button>

<div id="status">
Connect wallet first
</div>

</div>
</div>

<script type="module">

import { createWeb3Modal, defaultWagmiConfig }
from "https://esm.sh/@web3modal/wagmi";

import { polygon, polygonAmoy }
from "https://esm.sh/wagmi/chains";

const projectId = "96f13374b0fe2f629a925617de0a2ba3";

const metadata = {
name: "Token Creator",
description: "Polygon Token Creator",
url: "https://example.com",
icons: []
};

const chains = [polygon, polygonAmoy];

const wagmiConfig = defaultWagmiConfig({
chains,
projectId,
metadata
});

createWeb3Modal({
wagmiConfig,
projectId,
chains
});

const btn = document.createElement("w3m-button");
document.getElementById("wallet-btn").appendChild(btn);

const FACTORY =
"0x66168b1Abbf9b944052880F6Cc6331b8F9339d5D";

const status =
document.getElementById("status");

document
.getElementById("createBtn")
.addEventListener("click", async()=>{

try{

if(!window.ethereum){
status.innerHTML =
"Wallet not found";
return;
}

const accounts =
await window.ethereum.request({
method:"eth_accounts"
});

if(!accounts.length){
status.innerHTML =
"Connect wallet first";
return;
}

const name =
document.getElementById("tokenName").value;

const symbol =
document.getElementById("tokenSymbol").value;

const supply =
document.getElementById("tokenSupply").value;

if(!name || !symbol || !supply){
status.innerHTML =
"Fill all fields";
return;
}

status.innerHTML =
"Preparing transaction...";

const selector =
"0x79f2e679";

const encoder = new TextEncoder();

function pad64(hex){
return hex.replace("0x","").padStart(64,"0");
}

function strToHex(str){
return Array.from(encoder.encode(str))
.map(b=>b.toString(16).padStart(2,"0"))
.join("");
}

const nameHex = strToHex(name);
const symbolHex = strToHex(symbol);

const offsetName =
(3 * 32).toString(16).padStart(64,"0");

const offsetSymbol =
(3 * 32 + 32 + Math.ceil(name.length/32)*32)
.toString(16).padStart(64,"0");

const supplyHex =
BigInt(supply).toString(16).padStart(64,"0");

const nameLength =
name.length.toString(16).padStart(64,"0");

const symbolLength =
symbol.length.toString(16).padStart(64,"0");

const nameData =
nameHex.padEnd(
Math.ceil(nameHex.length/64)*64,
"0"
);

const symbolData =
symbolHex.padEnd(
Math.ceil(symbolHex.length/64)*64,
"0"
);

const data =
selector +
offsetName +
offsetSymbol +
supplyHex +
nameLength +
nameData +
symbolLength +
symbolData;

status.innerHTML =
"Waiting wallet confirmation...";

const txHash =
await window.ethereum.request({
method:"eth_sendTransaction",
params:[{
from:accounts[0],
to:FACTORY,
data:data
}]
});

status.innerHTML =
"✅ Transaction Sent<br><br>" +
txHash;

}catch(err){

status.innerHTML =
"❌ " + err.message;

}

});

</script>

</body>
</html>
