<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت توکن روی پالیگان</title>
    <!-- کتابخانه Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; direction: rtl; background: #f0f4f8; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #connectBtn { background: #8247e5; color: white; }
        #connectBtn:hover { background: #6a32c9; }
        #deployBtn { background: #27ae60; color: white; }
        #deployBtn:hover { background: #1e8e4c; }
        #deployBtn:disabled { background: #95a5a6; cursor: not-allowed; }
        input, select { width: 100%; padding: 12px; margin: 6px 0 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        label { font-weight: 600; display: block; margin-top: 10px; }
        #status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #ecf0f1; text-align: center; }
        .network-badge { background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="card">
    <div style="text-align: center;">
        <span class="network-badge">🟢 شبکه پالیگان (Polygon)</span>
        <h2>🚀 ساخت توکن جدید</h2>
    </div>

    <label>نام توکن</label>
    <input type="text" id="tokenName" placeholder="مثلاً: MyCoin" value="TestToken">

    <label>نماد توکن</label>
    <input type="text" id="tokenSymbol" placeholder="مثلاً: TKN" value="TEST">

    <label>مقدار اولیه (تعداد کل)</label>
    <input type="number" id="initialSupply" placeholder="مثلاً: 1000000" value="1000000">

    <button id="connectBtn">🔗 اتصال کیف پول</button>
    <button id="deployBtn" disabled>⛏ استقرار توکن</button>

    <div id="status">✅ منتظر اتصال کیف پول...</div>
</div>

<script>
    // --- تنظیمات شبکه پالیگان (Mainnet) ---
    const POLYGON_CHAIN_ID = 137;
    const POLYGON_RPC = "https://polygon-rpc.com";

    // --- آدرس قرارداد و ABI (برای دیپلوی) ---
    // ⚠️ این مقادیر را با قرارداد خودت جایگزین کن
    const CONTRACT_ADDRESS = "0xYourContractAddressHere"; 
    const CONTRACT_ABI = [
        "function createToken(string name, string symbol, uint256 initialSupply) external"
    ];

    let signer, provider, contract;

    // --- اتصال کیف پول (فقط پالیگان) ---
    document.getElementById("connectBtn").onclick = async function() {
        if (!window.ethereum) {
            document.getElementById("status").innerHTML = "❌ متاماسک نصب نیست!";
            return;
        }

        try {
            // درخواست اتصال به کیف پول
            await window.ethereum.request({ method: "eth_requestAccounts" });

            provider = new ethers.providers.Web3Provider(window.ethereum);
            const network = await provider.getNetwork();

            // بررسی شبکه (فقط پالیگان مجاز است)
            if (network.chainId !== POLYGON_CHAIN_ID) {
                document.getElementById("status").innerHTML = "❌ لطفاً شبکه را به پالیگان (Polygon) تغییر دهید.";
                return;
            }

            signer = provider.getSigner();
            const address = await signer.getAddress();
            contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

            document.getElementById("status").innerHTML = `✅ متصل شد: ${address.slice(0,6)}...${address.slice(-4)}`;
            document.getElementById("deployBtn").disabled = false;
            document.getElementById("connectBtn").style.background = "#2ecc71";

        } catch (error) {
            document.getElementById("status").innerHTML = `❌ خطا: ${error.message}`;
        }
    };

    // --- دکمه استقرار (Deploy) ---
    document.getElementById("deployBtn").onclick = async function() {
        if (!contract) {
            document.getElementById("status").innerHTML = "❌ ابتدا کیف پول را متصل کنید.";
            return;
        }

        const name = document.getElementById("tokenName").value.trim();
        const symbol = document.getElementById("tokenSymbol").value.trim();
        const supply = document.getElementById("initialSupply").value.trim();

        if (!name || !symbol || !supply) {
            document.getElementById("status").innerHTML = "❌ لطفاً تمام فیلدها را پر کنید.";
            return;
        }

        this.disabled = true;
        document.getElementById("status").innerHTML = "⏳ در حال ارسال تراکنش...";

        try {
            // تبدیل مقدار به عدد (با احتساب 18 رقم اعشار)
            const decimals = 18;
            const initialSupplyWei = ethers.utils.parseUnits(supply, decimals);

            // فراخوانی قرارداد
            const tx = await contract.createToken(name, symbol, initialSupplyWei);
            document.getElementById("status").innerHTML = `⏳ منتظر تایید تراکنش... <a href="https://polygonscan.com/tx/${tx.hash}" target="_blank">مشاهده در پالیگان‌اسکن</a>`;

            await tx.wait();
            document.getElementById("status").innerHTML = `✅ توکن "${name}" با موفقیت ساخته شد! 🎉`;

        } catch (error) {
            document.getElementById("status").innerHTML = `❌ خطا: ${error.message || error}`;
        } finally {
            this.disabled = false;
        }
    };

    // --- تشخیص تغییر شبکه توسط کاربر ---
    if (window.ethereum) {
        window.ethereum.on("chainChanged", () => { window.location.reload(); });
        window.ethereum.on("accountsChanged", () => { window.location.reload(); });
    }
</script>
</body>
</html>
