<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Balance Checker - Polygon</title>
</head>
<body style="background:#0f172a;color:white;font-family:sans-serif;padding:20px;text-align:center;">

<h2>🔍 بررسی موجودی توکن در پالیگان</h2>

<div id="wallet-btn"></div>
<div id="walletAddress" style="margin:10px;color:#94a3b8;font-size:14px;"></div>

<div style="max-width:400px;margin:20px auto;">
    <input type="text" id="tokenInput" placeholder="نام توکن (مثلاً USDC) یا آدرس قرارداد (0x...)" value="USDC" style="width:100%;padding:10px;margin-bottom:10px;background:#1e293b;color:white;border:1px solid #334155;border-radius:8px;">
    
    <button id="checkBtn" onclick="checkBalance()" disabled style="width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;">بررسی موجودی</button>
</div>

<div id="result" style="margin-top:20px;"></div>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig } from "https://esm.sh/@web3modal/wagmi";
import { polygon } from "https://esm.sh/wagmi/chains";
import { watchAccount } from "https://esm.sh/wagmi/actions";
import { readContract } from "https://esm.sh/wagmi/actions";
import { formatUnits } from "https://esm.sh/viem";

const projectId = "96f13374b0fe2f629a925617de0a2ba3";
const chains = [polygon];

const wagmiConfig = defaultWagmiConfig({
    chains,
    projectId,
    metadata: { name: "Token Checker", description: "", url: window.location.href, icons: [] }
});

createWeb3Modal({ wagmiConfig, projectId, chains });
const btn = document.createElement("w3m-button");
document.getElementById("wallet-btn").appendChild(btn);

// ==================== لیست توکن‌های معروف پالیگان (برای جستجو با نام) ====================
const tokenList = [
    { name: "USDC", address: "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174", decimals: 6, symbol: "USDC" },
    { name: "USDT", address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", decimals: 6, symbol: "USDT" },
    { name: "DAI", address: "0x8f3Cf7ad23Cd3CaDbD9735AFf958023239c6A063", decimals: 18, symbol: "DAI" },
    { name: "WETH", address: "0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619", decimals: 18, symbol: "WETH" },
    { name: "WBTC", address: "0x1bfd67037b42cf73acF2047067bd4F2C47D9BfD6", decimals: 8, symbol: "WBTC" },
    { name: "MATIC", address: "0x0000000000000000000000000000000000001010", decimals: 18, symbol: "MATIC" },
    { name: "LINK", address: "0xb0897686c545045aFc77CF20eC7A532E3120E0F1", decimals: 18, symbol: "LINK" },
    { name: "AAVE", address: "0xD6DF932A45C0f255f85145f286eA0b292B21C90B", decimals: 18, symbol: "AAVE" },
    { name: "CRV", address: "0x172370d5Cd63279eFa6d502DAB29171933a610AF", decimals: 18, symbol: "CRV" },
    { name: "UNI", address: "0xb33EaAd8d922B1083446DC23f610c2567fB5180f", decimals: 18, symbol: "UNI" }
];

const ERC20_ABI = [
    { "constant": true, "inputs": [], "name": "symbol", "outputs": [{"name": "", "type": "string"}], "type": "function" },
    { "constant": true, "inputs": [], "name": "decimals", "outputs": [{"name": "", "type": "uint8"}], "type": "function" },
    { "constant": true, "inputs": [{"name": "_owner", "type": "address"}], "name": "balanceOf", "outputs": [{"name": "balance", "type": "uint256"}], "type": "function" }
];

let currentAccount = null;

watchAccount(wagmiConfig, {
    onChange(account) {
        if (account?.address) {
            currentAccount = account.address;
            document.getElementById('walletAddress').innerText = `✅ ${account.address.slice(0,6)}...${account.address.slice(38)}`;
            document.getElementById('checkBtn').disabled = false;
        } else {
            currentAccount = null;
            document.getElementById('walletAddress').innerText = '';
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('result').innerHTML = '';
        }
    }
});

window.checkBalance = async function() {
    const input = document.getElementById('tokenInput').value.trim();
    
    if (!input) {
        document.getElementById('result').innerHTML = '<div style="color:#ef4444;">❌ لطفاً نام توکن یا آدرس قرارداد را وارد کنید</div>';
        return;
    }
    
    if (!currentAccount) {
        document.getElementById('result').innerHTML = '<div style="color:#ef4444;">❌ کیف پول متصل نیست</div>';
        return;
    }
    
    // تشخیص اینکه ورودی آدرس است یا نام توکن
    let tokenAddress = null;
    let tokenInfo = null;
    
    // اگر ورودی شبیه آدرس باشد (با 0x شروع شود و 42 کاراکتر)
    if (input.match(/^0x[a-fA-F0-9]{40}$/i)) {
        tokenAddress = input;
    } else {
        // جستجو در لیست بر اساس نام (case-insensitive)
        const searchName = input.toLowerCase();
        tokenInfo = tokenList.find(t => t.name.toLowerCase() === searchName || t.symbol.toLowerCase() === searchName);
        if (tokenInfo) {
            tokenAddress = tokenInfo.address;
        } else {
            document.getElementById('result').innerHTML = '<div style="color:#ef4444;">❌ توکن یافت نشد. لطفاً آدرس قرارداد را مستقیماً وارد کنید</div>';
            return;
        }
    }
    
    document.getElementById('result').innerHTML = '<div>⏳ در حال بررسی...</div>';
    
    try {
        let symbol, decimals, balance;
        
        if (tokenInfo) {
            // از اطلاعات ذخیره شده استفاده کن
            symbol = tokenInfo.symbol;
            decimals = tokenInfo.decimals;
            balance = await readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'balanceOf', args: [currentAccount], chainId: polygon.id });
        } else {
            // آدرس مستقیم وارد شده - همه چیز را از قرارداد بخوان
            [symbol, decimals, balance] = await Promise.all([
                readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'symbol', chainId: polygon.id }),
                readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'decimals', chainId: polygon.id }),
                readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'balanceOf', args: [currentAccount], chainId: polygon.id })
            ]);
        }
        
        const formattedBalance = formatUnits(balance, decimals);
        const balanceNum = parseFloat(formattedBalance);
        
        if (balanceNum > 0) {
            document.getElementById('result').innerHTML = `
                <div style="background:#1e293b;padding:20px;border-radius:8px;">
                    <div style="color:#94a3b8;">${symbol}</div>
                    <div style="font-size:32px;font-weight:bold;color:#3b82f6;">${balanceNum.toLocaleString()}</div>
                    <div style="color:#22c55e;">✅ موجود در کیف پول</div>
                    <div style="font-size:10px;color:#64748b;margin-top:10px;">${tokenAddress}</div>
                </div>
            `;
        } else {
            document.getElementById('result').innerHTML = `
                <div style="background:#1e293b;padding:20px;border-radius:8px;">
                    <div style="color:#94a3b8;">${symbol}</div>
                    <div style="font-size:32px;font-weight:bold;color:#ef4444;">0</div>
                    <div style="color:#ef4444;">❌ در کیف پول نیست</div>
                </div>
            `;
        }
    } catch (error) {
        document.getElementById('result').innerHTML = `<div style="color:#ef4444;">❌ خطا: قرارداد معتبر نیست یا توکن پیدا نشد</div>`;
    }
}
</script>

</body>
  </html>
