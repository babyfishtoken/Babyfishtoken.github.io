<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 قیمت لحظه‌ای پالیگان - مستقیم از بلاکچین</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 30, 47, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-weight: 700;
            margin-bottom: 24px;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge {
            text-align: center;
            margin-bottom: 24px;
        }

        .onchain-badge {
            background: rgba(130, 71, 229, 0.2);
            border: 1px solid rgba(130, 71, 229, 0.5);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.7rem;
            color: #c084fc;
            display: inline-block;
        }

        .price-card {
            background: rgba(15, 15, 26, 0.8);
            border-radius: 28px;
            padding: 32px 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .token-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #8247e5, #6b21a5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 2rem;
            color: white;
            margin: 0 auto 16px auto;
            box-shadow: 0 8px 20px rgba(130, 71, 229, 0.3);
        }

        .token-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .token-symbol {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 20px;
            font-family: monospace;
        }

        .price-value {
            font-size: 3.2rem;
            font-weight: 800;
            text-align: center;
            direction: ltr;
            color: #ffffff;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 20px;
            display: inline-block;
            width: auto;
            margin: 0 auto;
        }

        .price-value small {
            font-size: 1rem;
            font-weight: 500;
            color: #64748b;
        }

        .price-change {
            margin-top: 16px;
            font-size: 0.9rem;
        }

        .positive {
            color: #4ade80;
        }

        .negative {
            color: #f87171;
        }

        .info-bar {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .update-time {
            font-size: 0.7rem;
            color: #64748b;
            direction: ltr;
            margin-bottom: 12px;
        }

        .refresh-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .error-state {
            background: rgba(127, 29, 29, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 10px;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #fca5a5;
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .source {
            font-size: 0.65rem;
            color: #475569;
            margin-top: 16px;
            text-align: center;
        }

        .address-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 10px;
            margin-top: 16px;
            font-size: 0.65rem;
            font-family: monospace;
            color: #64748b;
            word-break: break-all;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">
            <span class="onchain-badge">🔗 On-Chain | Chainlink Oracle</span>
        </div>
        <h1>📊 قیمت لحظه‌ای</h1>

        <div class="price-card">
            <div class="token-icon">POL</div>
            <div class="token-name">پالیگان</div>
            <div class="token-symbol">Polygon (POL)</div>
            <div class="price-value" id="pol-price">--- <small>USD</small></div>
            <div class="price-change" id="pol-change"></div>
        </div>

        <div class="info-bar">
            <div class="update-time" id="update-time">در حال خواندن از بلاکچین...</div>
            <button class="refresh-btn" onclick="fetchPrice()">🔄 بروزرسانی</button>
        </div>
        <div id="error-message" class="error-state" style="display: none;"></div>
        <div class="address-info">
            📍 اوراکل Chainlink POL/USD: 0xAB594600376Ec9fD91F8e885dADF0CE036862dE0
        </div>
        <div class="source">
            🔗 منبع: اوراکل Chainlink روی شبکه پالیگان | خوانش مستقیم از بلاکچین
        </div>
    </div>

    <script>
        // ============================================================
        // دریافت قیمت مستقیم از بلاکچین پالیگان
        // با استفاده از RPC جایگزین که رایگان و بدون نیاز به کلید است
        // ============================================================
        
        // لیست RPC های عمومی پالیگان (آزاد و بدون نیاز به کلید)
        const RPC_LIST = [
            "https://polygon-mainnet.g.alchemy.com/v2/demo",
            "https://rpc-mainnet.maticvigil.com",
            "https://polygon.llamarpc.com",
            "https://polygon-rpc.com"
        ];
        
        let currentRpcIndex = 0;
        
        // آدرس اوراکل Chainlink POL/USD روی شبکه پالیگان
        const CHAINLINK_POL_USD_FEED = "0xAB594600376Ec9fD91F8e885dADF0CE036862dE0";
        
        // متد latestRoundData (signature: 0xfeaf968c)
        const LATEST_ROUND_DATA_SIG = "0xfeaf968c";
        
        let lastPrice = null;
        
        // تابع برای امتحان RPC های مختلف
        async function tryRPCs() {
            for (let i = 0; i < RPC_LIST.length; i++) {
                try {
                    const rpc = RPC_LIST[i];
                    const result = await callContract(rpc);
                    if (result && result.price > 0) {
                        currentRpcIndex = i;
                        return result;
                    }
                } catch (error) {
                    console.log(`RPC ${RPC_LIST[i]} failed:`, error.message);
                    continue;
                }
            }
            throw new Error("تمامی RPC ها پاسخ ندادند");
        }
        
        // فراخوانی قرارداد از یک RPC خاص
        async function callContract(rpcUrl) {
            const payload = {
                jsonrpc: "2.0",
                method: "eth_call",
                params: [
                    {
                        to: CHAINLINK_POL_USD_FEED,
                        data: LATEST_ROUND_DATA_SIG
                    },
                    "latest"
                ],
                id: 1
            };
            
            const response = await fetch(rpcUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message || "RPC error");
            }
            
            const resultHex = data.result;
            
            if (!resultHex || resultHex === "0x") {
                throw new Error("No data received");
            }
            
            const hexWithoutPrefix = resultHex.slice(2);
            const answerHex = "0x" + hexWithoutPrefix.slice(64, 128);
            const priceRaw = parseInt(answerHex, 16);
            const price = priceRaw / 100000000;
            
            if (price <= 0 || isNaN(price)) {
                throw new Error("Invalid price");
            }
            
            return { price, raw: priceRaw };
        }
        
        async function fetchPrice() {
            const priceElem = document.getElementById("pol-price");
            const changeElem = document.getElementById("pol-change");
            const updateTimeElem = document.getElementById("update-time");
            const errorDiv = document.getElementById("error-message");
            
            priceElem.innerHTML = '<span class="loading">⟳ ...</span> <small>USD</small>';
            changeElem.innerHTML = '';
            errorDiv.style.display = "none";
            updateTimeElem.innerHTML = "در حال خواندن از بلاکچین...";
            
            try {
                const result = await tryRPCs();
                const price = result.price;
                
                priceElem.innerHTML = `${formatPrice(price)} <small>USD</small>`;
                
                if (lastPrice && lastPrice !== price) {
                    const changePercent = ((price - lastPrice) / lastPrice) * 100;
                    const isPositive = changePercent >= 0;
                    const changeText = `${isPositive ? '▲' : '▼'} ${Math.abs(changePercent).toFixed(3)}%`;
                    changeElem.innerHTML = `<span class="${isPositive ? 'positive' : 'negative'}">${changeText} (لحظه‌ای)</span>`;
                } else {
                    changeElem.innerHTML = '';
                }
                
                lastPrice = price;
                
                const now = new Date();
                const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                updateTimeElem.innerHTML = `✅ خوانده شده از بلاکچین: ${timeString}`;
                
            } catch (error) {
                console.error("خطا:", error);
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `⚠️ خطا: ${error.message}<br><small>در حال تلاش مجدد...</small>`;
                updateTimeElem.innerHTML = "❌ خطا در اتصال به شبکه پالیگان";
            }
        }
        
        function formatPrice(price) {
            if (price < 0.01) return price.toFixed(6);
            if (price < 1) return price.toFixed(4);
            if (price < 1000) return price.toFixed(4);
            return price.toLocaleString('en-US', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
        }
        
        fetchPrice();
        setInterval(fetchPrice, 15000);
    </script>
</body>
</html>
