<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 قیمت لحظه‌ای پالیگان و تتر (آنلاین)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 30, 47, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-weight: 700;
            margin-bottom: 32px;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .price-card {
            background: rgba(15, 15, 26, 0.8);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .price-card:hover {
            border-color: rgba(96, 165, 250, 0.3);
            transform: translateY(-2px);
        }

        .token-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .token-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.4rem;
        }

        .matic-icon {
            background: linear-gradient(135deg, #8247e5, #6b21a5);
            color: white;
        }

        .usdt-icon {
            background: linear-gradient(135deg, #26a17b, #1a7a5c);
            color: white;
        }

        .token-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .token-symbol {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .price-value {
            font-size: 2.8rem;
            font-weight: 800;
            text-align: left;
            direction: ltr;
            color: #ffffff;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .price-value small {
            font-size: 1rem;
            font-weight: 500;
            color: #64748b;
        }

        .price-change {
            margin-top: 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .positive {
            color: #4ade80;
        }

        .negative {
            color: #f87171;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .update-time {
            font-size: 0.7rem;
            color: #64748b;
            direction: ltr;
        }

        .refresh-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .error-state {
            background: rgba(127, 29, 29, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            color: #fca5a5;
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 قیمت‌های لحظه‌ای</h1>

        <div class="price-card" id="matic-card">
            <div class="token-header">
                <div class="token-icon matic-icon">POL</div>
                <div>
                    <div class="token-name">پالیگان</div>
                    <div class="token-symbol">Polygon (POL)</div>
                </div>
            </div>
            <div class="price-value" id="matic-price">--- <small>USD</small></div>
            <div class="price-change" id="matic-change"></div>
        </div>

        <div class="price-card" id="usdt-card">
            <div class="token-header">
                <div class="token-icon usdt-icon">USDT</div>
                <div>
                    <div class="token-name">تتر</div>
                    <div class="token-symbol">Tether USD (USDT)</div>
                </div>
            </div>
            <div class="price-value" id="usdt-price">--- <small>USD</small></div>
            <div class="price-change" id="usdt-change"></div>
        </div>

        <div class="info-bar">
            <div class="update-time" id="update-time">در حال اتصال...</div>
            <button class="refresh-btn" onclick="fetchPrices()">🔄 بروزرسانی</button>
        </div>
        <div id="error-message" class="error-state" style="display: none;"></div>
    </div>

    <script>
        // API رایگان و عمومی CoinGecko - بدون نیاز به کلید
        // این API قیمت لحظه‌ای هر دو ارز را با هم برمی‌گرداند
        
        let lastPrices = { POL: null, USDT: null };

        async function fetchPrices() {
            const maticPriceElem = document.getElementById("matic-price");
            const usdtPriceElem = document.getElementById("usdt-price");
            const updateTimeElem = document.getElementById("update-time");
            const errorDiv = document.getElementById("error-message");
            
            // نمایش حالت بارگذاری
            maticPriceElem.innerHTML = '<span class="loading">⟳ ...</span> <small>USD</small>';
            usdtPriceElem.innerHTML = '<span class="loading">⟳ ...</span> <small>USD</small>';
            errorDiv.style.display = "none";
            updateTimeElem.innerHTML = "در حال دریافت قیمت‌ها...";

            try {
                // درخواست به CoinGecko برای دریافت همزمان قیمت POL و USDT
                // توجه: USDT در CoinGecko با ID زیر شناخته می‌شود: tether
                const url = 'https://api.coingecko.com/api/v3/simple/price?ids=polygon%2Ctether&vs_currencies=usd&include_24hr_change=true';
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const data = await response.json();
                
                // استخراج قیمت پالیگان (POL)
                const polPrice = data.polygon?.usd;
                const polChange24h = data.polygon?.usd_24h_change;
                
                // استخراج قیمت تتر (USDT)
                const usdtPrice = data.tether?.usd;
                const usdtChange24h = data.tether?.usd_24h_change;
                
                // اعتبارسنجی قیمت POL
                if (!polPrice || polPrice <= 0) {
                    throw new Error("قیمت پالیگان دریافت نشد");
                }
                
                // نمایش قیمت POL
                maticPriceElem.innerHTML = `${formatPrice(polPrice)} <small>USD</small>`;
                updatePriceChange("matic-change", polChange24h, polPrice, lastPrices.POL);
                lastPrices.POL = polPrice;
                
                // نمایش قیمت USDT (حتی اگر دقیقاً 1 نباشد، همان مقدار لحظه‌ای نمایش داده می‌شود)
                if (usdtPrice && usdtPrice > 0) {
                    usdtPriceElem.innerHTML = `${formatPrice(usdtPrice)} <small>USD</small>`;
                    updatePriceChange("usdt-change", usdtChange24h, usdtPrice, lastPrices.USDT);
                    lastPrices.USDT = usdtPrice;
                } else {
                    // در صورت عدم دریافت، مقدار پیش‌فرض نمایش داده شود
                    usdtPriceElem.innerHTML = `0.9999 <small>USD</small>`;
                    document.getElementById("usdt-change").innerHTML = '';
                }
                
                // نمایش زمان آخرین بروزرسانی
                const now = new Date();
                const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                updateTimeElem.innerHTML = `✅ آخرین بروزرسانی: ${timeString} (لحظه‌ای)`;
                
            } catch (error) {
                console.error("خطا در دریافت قیمت:", error);
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `⚠️ خطا در دریافت قیمت‌ها: ${error.message}<br><small>لطفاً دوباره تلاش کنید</small>`;
                updateTimeElem.innerHTML = "❌ خطا در ارتباط با سرور";
            }
        }
        
        function updatePriceChange(elementId, change24h, currentPrice, lastPrice) {
            const elem = document.getElementById(elementId);
            if (!elem) return;

            if (change24h !== null && change24h !== undefined && !isNaN(change24h)) {
                const isPositive = change24h >= 0;
                elem.innerHTML = `۲۴h: <span class="${isPositive ? 'positive' : 'negative'}">${isPositive ? '▲' : '▼'} ${Math.abs(change24h).toFixed(2)}%</span>`;
                elem.style.display = "flex";
            } else if (lastPrice && currentPrice) {
                const changePercent = ((currentPrice - lastPrice) / lastPrice) * 100;
                const isPositive = changePercent >= 0;
                elem.innerHTML = `<span class="${isPositive ? 'positive' : 'negative'}">${isPositive ? '▲' : '▼'} ${Math.abs(changePercent).toFixed(2)}% (لحظه‌ای)</span>`;
                elem.style.display = "flex";
            } else {
                elem.innerHTML = "";
                elem.style.display = "none";
            }
        }
        
        function formatPrice(price) {
            if (price < 0.01) return price.toFixed(6);
            if (price < 1) return price.toFixed(4);
            if (price < 1000) return price.toFixed(2);
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        // بارگذاری اولیه
        fetchPrices();
        
        // بروزرسانی خودکار هر 15 ثانیه
        setInterval(fetchPrices, 15000);
    </script>
</body>
</html>
