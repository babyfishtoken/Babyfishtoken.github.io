<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قیمت لحظه‌ای پالیگان</title>

<style>
body{
    margin:0;
    font-family:tahoma,sans-serif;
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#fff;
}

.card{
    background:#1f2937;
    padding:25px;
    border-radius:20px;
    text-align:center;
    min-width:320px;
    box-shadow:0 0 25px rgba(0,0,0,.3);
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    margin-bottom:15px;
}

.title{
    font-size:22px;
    margin-bottom:15px;
}

.price{
    font-size:36px;
    font-weight:bold;
    color:#8b5cf6;
    margin:15px 0;
}

.update{
    color:#9ca3af;
    font-size:14px;
}
</style>
</head>
<body>

<div class="card">
    <img
        class="logo"
        src="https://cryptologos.cc/logos/polygon-matic-logo.png"
        alt="Polygon"
    >

    <div class="title">قیمت لحظه‌ای پالیگان (POL)</div>

    <div id="price" class="price">...</div>

    <div id="update" class="update">
        در حال دریافت اطلاعات...
    </div>
</div>

<script>
async function getPolygonPrice() {
    try {
        const response = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=polygon-ecosystem-token&vs_currencies=usd"
        );

        const data = await response.json();

        const price = data["polygon-ecosystem-token"].usd;

        document.getElementById("price").textContent =
            "$" + Number(price).toFixed(4);

        document.getElementById("update").textContent =
            "آخرین بروزرسانی: " +
            new Date().toLocaleTimeString("fa-IR");
    } catch (error) {
        document.getElementById("price").textContent = "خطا";
        document.getElementById("update").textContent =
            "دریافت قیمت ناموفق بود";
    }
}

getPolygonPrice();
setInterval(getPolygonPrice, 30000);
</script>

</body>
</html>
