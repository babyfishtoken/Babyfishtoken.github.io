<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Token Balance & Price Checker</title>
</head>
<body style="background:#0f172a;color:white;font-family:sans-serif;padding:20px;text-align:center;">

<h2>💰 بررسی موجودی و قیمت توکن</h2>

<!-- دکمه اتصال کیف پول -->
<div id="wallet-btn"></div>
<div id="walletAddress" style="margin:10px;color:#94a3b8;font-size:14px;"></div>

<!-- فرم جستجو -->
<div style="max-width:500px;margin:20px auto;">
    <select id="networkSelect" style="width:100%;padding:10px;margin-bottom:10px;background:#1e293b;color:white;border:1px solid #334155;border-radius:8px;">
        <option value="1">اتریوم (Ethereum)</option>
        <option value="137" selected>پالیگان (Polygon)</option>
        <option value="56">BSC</option>
    </select>
    
    <input type="text" id="tokenAddress" placeholder="آدرس توکن (0x...)" value="0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174" style="width:100%;padding:10px;margin-bottom:10px;background:#1e293b;color:white;border:1px solid #334155;border-radius:8px;">
    
    <div style="display:flex;gap:10px;margin-bottom:10px;">
        <input type="text" id="priceSource" placeholder="منبع قیمت (اختیاری: coingecko, binance, mexc, chainlink)" value="mexc" style="flex:2;padding:10px;background:#1e293b;color:white;border:1px solid #334155;border-radius:8px;">
        <select id="priceType" style="flex:1;padding:10px;background:#1e293b;color:white;border:1px solid #334155;border-radius:8px;">
            <option value="auto">خودکار</option>
            <option value="usd">USD</option>
            <option value="usdt">USDT</option>
        </select>
    </div>
    
    <button id="checkBtn" onclick="checkBalanceAndPrice()" disabled style="width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;">بررسی موجودی و قیمت</button>
</div>

<!-- نتیجه -->
<div id="result" style="margin-top:20px;"></div>

<script type="module">
import { createWeb3Modal, defaultWagmiConfig } from "https://esm.sh/@web3modal/wagmi";
import { mainnet, polygon, bsc } from "https://esm.sh/wagmi/chains";
import { watchAccount } from "https://esm.sh/wagmi/actions";
import { readContract } from "https://esm.sh/wagmi/actions";
import { formatUnits } from "https://esm.sh/viem";

// ==================== تنظیمات ====================
const projectId = "96f13374b0fe2f629a925617de0a2ba3";
const chains = [mainnet, polygon, bsc];

const wagmiConfig = defaultWagmiConfig({
    chains,
    projectId,
    metadata: { name: "Token Checker", description: "", url: window.location.href, icons: [] }
});

// ایجاد دکمه
createWeb3Modal({ wagmiConfig, projectId, chains });
const btn = document.createElement("w3m-button");
document.getElementById("wallet-btn").appendChild(btn);

// ==================== ABI توکن ====================
const ERC20_ABI = [
    { "constant": true, "inputs": [], "name": "symbol", "outputs": [{"name": "", "type": "string"}], "type": "function" },
    { "constant": true, "inputs": [], "name": "decimals", "outputs": [{"name": "", "type": "uint8"}], "type": "function" },
    { "constant": true, "inputs": [{"name": "_owner", "type": "address"}], "name": "balanceOf", "outputs": [{"name": "balance", "type": "uint256"}], "type": "function" }
];

// ==================== مپ شبکه ====================
const chainMap = { '1': mainnet, '137': polygon, '56': bsc };

// ==================== توابع دریافت قیمت ====================

// دریافت قیمت از MEXC (رایگان، بدون CORS)
async function getPriceFromMEXC(symbol) {
    try {
        const response = await fetch(`https://api.mexc.com/api/v3/ticker/price?symbol=${symbol}USDT`);
        if (!response.ok) throw new Error("MEXC error");
        const data = await response.json();
        return parseFloat(data.price);
    } catch (error) {
        console.log("MEXC failed:", error);
        return null;
    }
}

// دریافت قیمت از بایننس
async function getPriceFromBinance(symbol) {
    try {
        const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}USDT`);
        if (!response.ok) throw new Error("Binance error");
        const data = await response.json();
        return parseFloat(data.price);
    } catch (error) {
        console.log("Binance failed:", error);
        return null;
    }
}

// دریافت قیمت از CoinGecko
async function getPriceFromCoinGecko(tokenId) {
    try {
        const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${tokenId}&vs_currencies=usd`);
        if (!response.ok) throw new Error("CoinGecko error");
        const data = await response.json();
        return data[tokenId]?.usd || null;
    } catch (error) {
        console.log("CoinGecko failed:", error);
        return null;
    }
}

// مپ توکن‌های معروف به ID CoinGecko
const tokenToCoinGeckoId = {
    "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174": "usd-coin", // USDC
    "0xc2132D05D31c914a87C6611C10748AEb04B58e8F": "tether", // USDT
    "0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619": "ethereum", // WETH
    "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270": "matic-network", // POL/MATIC
    "0x0000000000000000000000000000000000001010": "matic-network", // Native POL
};

// مپ توکن به نماد برای صرافی‌ها
function getTokenSymbolFromAddress(address, symbol) {
    const symbolMap = {
        "USDC": "USDC",
        "USDT": "USDT",
        "WETH": "ETH",
        "POL": "MATIC",
        "MATIC": "MATIC"
    };
    return symbolMap[symbol] || symbol;
}

// تابع اصلی دریافت قیمت
async function fetchPrice(tokenAddress, tokenSymbol, networkId, source) {
    const symbol = getTokenSymbolFromAddress(tokenAddress, tokenSymbol);
    
    // روش اول: منبع مشخص شده توسط کاربر
    if (source === "mexc") {
        const price = await getPriceFromMEXC(symbol);
        if (price) return price;
    }
    if (source === "binance") {
        const price = await getPriceFromBinance(symbol);
        if (price) return price;
    }
    if (source === "coingecko") {
        const tokenId = tokenToCoinGeckoId[tokenAddress.toLowerCase()];
        if (tokenId) {
            const price = await getPriceFromCoinGecko(tokenId);
            if (price) return price;
        }
    }
    
    // روش دوم: خودکار - امتحان منابع مختلف
    // اول MEXC
    let price = await getPriceFromMEXC(symbol);
    if (price) return price;
    
    // دوم بایننس
    price = await getPriceFromBinance(symbol);
    if (price) return price;
    
    // سوم CoinGecko
    const tokenId = tokenToCoinGeckoId[tokenAddress.toLowerCase()];
    if (tokenId) {
        price = await getPriceFromCoinGecko(tokenId);
        if (price) return price;
    }
    
    // اگر همه منابع failed
    return null;
}

// ==================== وضعیت کیف پول ====================
let currentAccount = null;

watchAccount(wagmiConfig, {
    onChange(account) {
        if (account?.address) {
            currentAccount = account.address;
            document.getElementById('walletAddress').innerHTML = `✅ ${account.address.slice(0,6)}...${account.address.slice(38)}`;
            document.getElementById('checkBtn').disabled = false;
        } else {
            currentAccount = null;
            document.getElementById('walletAddress').innerHTML = '';
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('result').innerHTML = '';
        }
    }
});

// ==================== بررسی موجودی و قیمت ====================
window.checkBalanceAndPrice = async function() {
    const tokenAddress = document.getElementById('tokenAddress').value.trim();
    const network = document.getElementById('networkSelect').value;
    const priceSource = document.getElementById('priceSource').value.trim();
    const priceType = document.getElementById('priceType').value;
    
    if (!tokenAddress || !tokenAddress.match(/^0x[a-fA-F0-9]{40}$/)) {
        document.getElementById('result').innerHTML = '<div style="color:#ef4444;">❌ آدرس توکن نامعتبر</div>';
        return;
    }
    
    if (!currentAccount) {
        document.getElementById('result').innerHTML = '<div style="color:#ef4444;">❌ کیف پول متصل نیست</div>';
        return;
    }
    
    document.getElementById('result').innerHTML = '<div style="text-align:center;"><div>⏳ در حال بررسی موجودی...</div><div style="color:#94a3b8;font-size:12px;">در حال دریافت قیمت لحظه‌ای...</div></div>';
    
    try {
        const chain = chainMap[network];
        
        // دریافت اطلاعات توکن
        const [symbol, decimals, balance] = await Promise.all([
            readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'symbol', chainId: chain.id }),
            readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'decimals', chainId: chain.id }),
            readContract(wagmiConfig, { address: tokenAddress, abi: ERC20_ABI, functionName: 'balanceOf', args: [currentAccount], chainId: chain.id })
        ]);
        
        const formattedBalance = formatUnits(balance, decimals);
        const balanceNum = parseFloat(formattedBalance);
        
        // دریافت قیمت لحظه‌ای
        document.getElementById('result').innerHTML = '<div>⏳ در حال دریافت قیمت لحظه‌ای...</div>';
        const price = await fetchPrice(tokenAddress, symbol, network, priceSource);
        
        const totalValue = (balanceNum * (price || 0)).toFixed(4);
        
        // نمایش نتیجه
        let priceHtml = '';
        if (price) {
            priceHtml = `
                <div style="margin-top:12px;padding:12px;background:#0f172a;border-radius:8px;">
                    <div style="color:#94a3b8;">قیمت لحظه‌ای</div>
                    <div style="font-size:20px;font-weight:bold;color:#60a5fa;">$${price.toFixed(6)}</div>
                    <div style="margin-top:12px;color:#94a3b8;">ارزش کل</div>
                    <div style="font-size:24px;font-weight:bold;color:#22c55e;">$${parseFloat(totalValue).toLocaleString()}</div>
                </div>
            `;
        } else {
            priceHtml = `
                <div style="margin-top:12px;padding:12px;background:#0f172a;border-radius:8px;">
                    <div style="color:#f97316;">⚠️ قیمت لحظه‌ای در دسترس نیست</div>
                    <div style="font-size:14px;color:#94a3b8;">منابع: MEXC, Binance, CoinGecko</div>
                </div>
            `;
        }
        
        if (balanceNum > 0) {
            document.getElementById('result').innerHTML = `
                <div style="background:#1e293b;padding:20px;border-radius:12px;">
                    <div style="color:#94a3b8;">${symbol}</div>
                    <div style="font-size:32px;font-weight:bold;color:#3b82f6;">${balanceNum.toLocaleString()}</div>
                    <div style="color:#22c55e;">✅ موجود در کیف پول</div>
                    ${priceHtml}
                    <div style="margin-top:12px;font-size:11px;color:#475569;">
                        🔗 آدرس توکن: ${tokenAddress.slice(0,10)}...${tokenAddress.slice(-8)}
                    </div>
                </div>
            `;
        } else {
            document.getElementById('result').innerHTML = `
                <div style="background:#1e293b;padding:20px;border-radius:12px;">
                    <div style="color:#94a3b8;">${symbol}</div>
                    <div style="font-size:32px;font-weight:bold;color:#ef4444;">0</div>
                    <div style="color:#ef4444;">❌ در کیف پول نیست</div>
                    ${priceHtml}
                </div>
            `;
        }
    } catch (error) {
        console.error("Error:", error);
        document.getElementById('result').innerHTML = `<div style="color:#ef4444;background:#1e293b;padding:20px;border-radius:12px;">❌ خطا: ${error.message.slice(0,100)}</div>`;
    }
}
</script>

</body>
    </html>
