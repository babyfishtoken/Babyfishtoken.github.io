<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Solana Wallet</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:30px 15px;
    background:#111827;
    color:#fff;
    font-family:Arial,sans-serif
}

.box{
    max-width:700px;
    margin:auto;
    background:#1f2937;
    padding:25px;
    border-radius:18px
}

h1{
    text-align:center;
    color:#60a5fa;
    margin-top:0
}

textarea{
    width:100%;
    height:120px;
    padding:15px;
    background:#111827;
    color:#fff;
    border:1px solid #374151;
    border-radius:12px;
    font-size:16px;
    direction:ltr;
    text-align:left;
    resize:none
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    cursor:pointer
}

button:disabled{
    background:#475569;
    cursor:not-allowed
}

.status{
    margin-top:15px;
    text-align:center;
    color:#fbbf24
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#111827;
    border-radius:12px
}

.path{
    color:#60a5fa;
    font-family:monospace;
    direction:ltr;
    text-align:left;
    margin-bottom:7px
}

.address{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    color:#34d399;
    font-family:monospace;
    font-size:14px;
    padding:10px;
    background:#0b1220;
    border-radius:8px;
    margin-bottom:15px
}

.error{
    margin-top:15px;
    color:#f87171;
    text-align:center
}

.warning{
    margin-top:15px;
    padding:12px;
    background:#422006;
    color:#fbbf24;
    border-radius:10px;
    font-size:14px;
    line-height:1.7
}

.ok{
    margin-top:15px;
    padding:12px;
    background:#052e16;
    color:#4ade80;
    border-radius:10px;
    font-size:14px
}
</style>
</head>

<body>

<div class="box">

<h1>◎ Solana Wallet</h1>

<textarea
id="mnemonic"
placeholder="عبارت بازیابی ۱۲ کلمه‌ای را وارد کنید..."
autocomplete="off"
spellcheck="false"></textarea>

<button id="btn">
تولید آدرس‌های Solana
</button>

<div id="status" class="status"></div>

<div id="error" class="error"></div>

<div id="validation"></div>

<div id="results"></div>

</div>


<script type="module">

import {
    validateMnemonic,
    mnemonicToSeedSync
}
from "https://esm.sh/@scure/bip39@2.2.0";

import {
    wordlist
}
from "https://esm.sh/@scure/bip39@2.2.0/wordlists/english.js";

import {
    HDKey
}
from "https://esm.sh/micro-ed25519-hdkey@0.1.2";

import nacl
from "https://esm.sh/tweetnacl@1.0.3";


const btn =
document.getElementById("btn");

const input =
document.getElementById("mnemonic");

const status =
document.getElementById("status");

const error =
document.getElementById("error");

const validation =
document.getElementById("validation");

const results =
document.getElementById("results");


/* =========================
   Base58
========================= */

function base58(bytes){

    const alphabet =
    "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

    let digits=[0];

    for(const byte of bytes){

        let carry=byte;

        for(let i=0;i<digits.length;i++){

            const value =
            digits[i]*256+carry;

            digits[i]=value%58;

            carry=Math.floor(value/58);
        }

        while(carry>0){

            digits.push(carry%58);

            carry=Math.floor(carry/58);
        }
    }

    let result="";

    for(
        let i=0;
        i<bytes.length &&
        bytes[i]===0;
        i++
    ){
        result+="1";
    }

    for(
        let i=digits.length-1;
        i>=0;
        i--
    ){
        result+=alphabet[digits[i]];
    }

    return result;
}


/* =========================
   Seed → Solana Address
========================= */

function addressFromPath(seed,path){

    const hd =
    HDKey.fromMasterSeed(seed);

    const child =
    hd.derive(path);

    const keypair =
    nacl.sign.keyPair.fromSeed(
        child.privateKey
    );

    return base58(
        keypair.publicKey
    );
}


/* =========================
   Generate
========================= */

btn.addEventListener("click",()=>{

    status.textContent="";
    error.textContent="";
    validation.innerHTML="";
    results.innerHTML="";

    const phrase =
    input.value
    .trim()
    .replace(/\s+/g," ");

    if(!phrase){

        error.textContent =
        "❌ عبارت بازیابی را وارد کنید.";

        return;
    }


    const words =
    phrase.split(" ");


    if(words.length !== 12){

        error.textContent =
        "❌ باید دقیقاً ۱۲ کلمه وارد کنید.";

        return;
    }


    try{

        btn.disabled=true;

        status.textContent =
        "در حال پردازش...";


        /* =========================
           BIP39 Validation
        ========================= */

        let valid=false;

        try{

            valid =
            validateMnemonic(
                phrase,
                wordlist
            );

        }catch(e){

            valid=false;

        }


        if(valid){

            validation.innerHTML =
            `<div class="ok">
            ✓ عبارت ۱۲ کلمه‌ای از نظر BIP39 معتبر است.
            </div>`;

        }else{

            /*
             * اینجا عمداً متوقف نمی‌شویم.
             * Seed همچنان ساخته می‌شود.
             */

            validation.innerHTML =
            `<div class="warning">
            ⚠️ این عبارت توسط BIP39 بررسی‌کننده
            معتبر تشخیص داده نشد، اما برای بررسی
            آدرس‌ها ادامه می‌دهیم.
            </div>`;

        }


        /* =========================
           BIP39 Seed
        ========================= */

        const seed =
        mnemonicToSeedSync(
            phrase,
            ""
        );


        /*
         * مسیرهای مورد استفاده Phantom
         */

        const paths=[

            "m/44'/501'/0'/0'",
            "m/44'/501'/1'/0'",
            "m/44'/501'/2'/0'",
            "m/44'/501'/3'/0'",
            "m/44'/501'/4'/0'",

            "m/44'/501'/0'",
            "m/44'/501'/1'",
            "m/44'/501'/2'",
            "m/44'/501'/3'",
            "m/44'/501'/4'",

            "m/501'/0'/0/0",
            "m/501'/1'/0/0",
            "m/501'/2'/0/0",
            "m/501'/3'/0/0",
            "m/501'/4'/0/0"

        ];


        let html="";

        for(const path of paths){

            try{

                const address =
                addressFromPath(
                    seed,
                    path
                );


                html += `

                <div class="result"
                     style="display:block">

                    <div class="path">
                        ${path}
                    </div>

                    <div class="address">
                        ${address}
                    </div>

                </div>

                `;

            }catch(e){

                console.error(
                    path,
                    e
                );

            }

        }


        if(!html){

            throw new Error(
                "هیچ آدرسی تولید نشد."
            );

        }


        results.innerHTML=html;

        status.textContent =
        "✓ آدرس‌ها با موفقیت تولید شدند.";


    }catch(e){

        console.error(e);

        error.textContent =
        "❌ "+(
            e.message ||
            "خطای ناشناخته"
        );

        status.textContent="";

    }finally{

        btn.disabled=false;

    }

});

</script>

</body>
</html>
