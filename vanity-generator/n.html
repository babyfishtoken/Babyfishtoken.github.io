<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مشاهده موجودی ولت</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 500px;
            text-align: center;
        }
        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #0f3460;
            color: #fff;
            box-sizing: border-box;
            direction: ltr;
        }
        input::placeholder {
            color: #aaa;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #c73652;
        }
        #result {
            margin-top: 20px;
            background: #0f3460;
            padding: 16px;
            border-radius: 8px;
            color: #4fc3f7;
            font-size: 18px;
            min-height: 50px;
            word-break: break-all;
        }
        .error {
            color: #ff6b6b !important;
        }
        .loading {
            color: #ffd93d !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 مشاهده موجودی ولت</h1>
    <input type="text" id="walletInput" placeholder="مثال: 0x742d35Cc6634C0532925a3b844Bc9e7598f0b0C5" />
    <button onclick="getBalance()">بررسی موجودی</button>
    <div id="result">👈 آدرس را وارد کنید</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/web3@4.16.0/dist/web3.min.js"></script>
<script>
    // کلید اینفوورا و شبکه اصلی اتریوم
    const INFURA_KEY = '934a2ae012c840dea039c5c2571bce16';
    const web3 = new Web3(`https://mainnet.infura.io/v3/${INFURA_KEY}`);

    async function getBalance() {
        const address = document.getElementById('walletInput').value.trim();
        const resultDiv = document.getElementById('result');

        // اعتبارسنجی ساده آدرس
        if (!address || !address.startsWith('0x') || address.length !== 42) {
            resultDiv.innerHTML = '❌ آدرس نامعتبر است (باید ۰x + ۴۰ کاراکتر باشد)';
            resultDiv.className = 'error';
            return;
        }

        resultDiv.innerHTML = '⏳ در حال دریافت موجودی...';
        resultDiv.className = 'loading';

        try {
            // دریافت موجودی به Wei
            const balanceWei = await web3.eth.getBalance(address);
            // تبدیل به اتر
            const balanceEth = web3.utils.fromWei(balanceWei, 'ether');

            // نمایش با ۴ رقم اعشار
            resultDiv.innerHTML = `💰 موجودی: <strong>${parseFloat(balanceEth).toFixed(4)} ETH</strong>`;
            resultDiv.className = '';
        } catch (error) {
            resultDiv.innerHTML = '❌ خطا در اتصال به شبکه. مجدداً تلاش کنید.';
            resultDiv.className = 'error';
            console.error(error);
        }
    }

    // با فشار Enter هم کار کند
    document.getElementById('walletInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') getBalance();
    });
</script>

</body>
</html>
