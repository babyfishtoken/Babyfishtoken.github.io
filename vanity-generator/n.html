<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نمایش موجودی کل ولت</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #fff;
            font-size: 22px;
            text-align: center;
        }
        .subtitle {
            color: #aaa;
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #0f3460;
            color: #fff;
            box-sizing: border-box;
            direction: ltr;
        }
        input::placeholder {
            color: #aaa;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #c73652;
        }
        #result {
            margin-top: 20px;
            background: #0f3460;
            padding: 16px;
            border-radius: 8px;
            color: #4fc3f7;
            font-size: 16px;
            min-height: 50px;
            max-height: 500px;
            overflow-y: auto;
        }
        .total-balance {
            background: linear-gradient(135deg, #e94560, #c73652);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 16px;
            color: #fff;
        }
        .total-balance .amount {
            font-size: 28px;
            font-weight: bold;
        }
        .total-balance .label {
            font-size: 14px;
            opacity: 0.8;
        }
        .token-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a3a5c;
            color: #fff;
        }
        .token-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .token-logo {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #0f3460;
        }
        .token-symbol {
            font-weight: bold;
            color: #4fc3f7;
        }
        .token-name {
            color: #888;
            font-size: 12px;
        }
        .token-balance {
            text-align: left;
        }
        .token-amount {
            color: #ffd93d;
        }
        .token-usd {
            color: #6fcf97;
            font-size: 12px;
        }
        .error {
            color: #ff6b6b !important;
        }
        .loading {
            color: #ffd93d !important;
        }
        .no-tokens {
            color: #aaa;
            text-align: center;
            padding: 20px;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f3460;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💰 موجودی کل ولت</h1>
    <div class="subtitle">با یک کلیک، همه توکن‌ها را ببینید</div>
    <input type="text" id="walletInput" placeholder="مثال: 0x742d35Cc6634C0532925a3b844Bc9e7598f0b0C5" />
    <button onclick="getWalletBalance()">🔍 بررسی موجودی</button>
    <div id="result">👈 آدرس را وارد کنید</div>
</div>

<script>
    // ==================== Debank API ====================
    // Debank API (رایگان و بدون نیاز به کلید)
    async function getWalletBalance() {
        const address = document.getElementById('walletInput').value.trim();
        const resultDiv = document.getElementById('result');

        // اعتبارسنجی آدرس
        if (!address || !address.startsWith('0x') || address.length !== 42) {
            resultDiv.innerHTML = '❌ آدرس نامعتبر است (باید با 0x شروع شود)';
            resultDiv.className = 'error';
            return;
        }

        resultDiv.innerHTML = '⏳ در حال دریافت اطلاعات...';
        resultDiv.className = 'loading';

        try {
            // 1️⃣ دریافت موجودی کل (به دلار)
            const totalResponse = await fetch(
                `https://api.debank.com/chain/eth/total_balance?user_address=${address}`
            );
            const totalData = await totalResponse.json();
            
            // 2️⃣ دریافت لیست همه توکن‌ها
            const tokensResponse = await fetch(
                `https://api.debank.com/chain/eth/user/all_token_list?user_address=${address}`
            );
            const tokensData = await tokensResponse.json();

            // ساخت HTML
            let html = '';

            // ✅ موجودی کل
            const totalUsd = totalData.total_usd_value || 0;
            html += `
                <div class="total-balance">
                    <div class="label">💰 ارزش کل دارایی‌ها</div>
                    <div class="amount">$${totalUsd.toFixed(2)}</div>
                </div>
            `;

            // ✅ لیست توکن‌ها
            if (tokensData && tokensData.length > 0) {
                // مرتب‌سازی بر اساس ارزش (بزرگترین اول)
                tokensData.sort((a, b) => (b.usd_value || 0) - (a.usd_value || 0));

                // فقط توکن‌هایی که ارزش دارند یا موجودی دارند
                const filteredTokens = tokensData.filter(t => 
                    (t.usd_value && t.usd_value > 0.01) || 
                    (parseFloat(t.amount) > 0)
                );

                if (filteredTokens.length === 0) {
                    html += `<div class="no-tokens">😕 این ولت هیچ توکنی ندارد</div>`;
                } else {
                    filteredTokens.forEach(token => {
                        const logo = token.logo_url || '';
                        const amount = parseFloat(token.amount).toFixed(4);
                        const usdValue = token.usd_value ? token.usd_value.toFixed(2) : 0;
                        
                        html += `
                            <div class="token-item">
                                <div class="token-left">
                                    ${logo ? `<img src="${logo}" class="token-logo" />` : `<div class="token-logo"></div>`}
                                    <div>
                                        <span class="token-symbol">${token.symbol || '??'}</span>
                                        <span class="token-name">${token.name || ''}</span>
                                    </div>
                                </div>
                                <div class="token-balance">
                                    <div class="token-amount">${amount}</div>
                                    ${usdValue > 0 ? `<div class="token-usd">$${usdValue}</div>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
            } else {
                html += `<div class="no-tokens">😕 توکنی پیدا نشد</div>`;
            }

            resultDiv.innerHTML = html;
            resultDiv.className = '';

        } catch (error) {
            resultDiv.innerHTML = '❌ خطا در دریافت اطلاعات. مجدداً تلاش کنید.';
            resultDiv.className = 'error';
            console.error(error);
        }
    }

    // Enter
    document.getElementById('walletInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') getWalletBalance();
    });
</script>

</body>
</html>
