    // ABI حداقلی برای خواندن موجودی
    const ERC20_ABI = [
        {
            "constant": true,
            "inputs": [{"name": "_owner", "type": "address"}],
            "name": "balanceOf",
            "outputs": [{"name": "balance", "type": "uint256"}],
            "type": "function"
        },
        {
            "constant": true,
            "inputs": [],
            "name": "decimals",
            "outputs": [{"name": "", "type": "uint8"}],
            "type": "function"
        }
    ];

    async function getAllTokens() {
        const address = document.getElementById('walletInput').value.trim();
        const resultDiv = document.getElementById('result');

        if (!address || !address.startsWith('0x') || address.length !== 42) {
            resultDiv.innerHTML = '❌ آدرس نامعتبر است (باید با 0x شروع شود و 42 کاراکتر باشد)';
            resultDiv.className = 'error';
            return;
        }

        resultDiv.innerHTML = '⏳ در حال دریافت اطلاعات از شبکه اتریوم...';
        resultDiv.className = 'loading';

        let html = '';

        try {
            // 1️⃣ دریافت ETH
            const ethBalance = await web3.eth.getBalance(address);
            const ethAmount = web3.utils.fromWei(ethBalance, 'ether');
            html += `<div class="eth-balance">💰 ETH: <strong>${parseFloat(ethAmount).toFixed(6)}</strong></div>`;

            // 2️⃣ دریافت توکن‌ها
            let foundAny = false;
            let tokenCount = 0;
            const totalTokens = TOKEN_CONTRACTS.length;

            // برای جلوگیری از سنگین شدن، به صورت دسته‌ای پردازش می‌کنیم
            const batchSize = 10;
            for (let i = 0; i < TOKEN_CONTRACTS.length; i += batchSize) {
                const batch = TOKEN_CONTRACTS.slice(i, i + batchSize);
                
                for (const token of batch) {
                    try {
                        const contract = new web3.eth.Contract(ERC20_ABI, token.address);
                        const balance = await contract.methods.balanceOf(address).call();

                        if (parseFloat(balance) > 0) {
                            const formatted = parseFloat(balance) / Math.pow(10, token.decimals);
                            html += `<div class="token-item">
                                <span>
                                    <span class="token-symbol">${token.symbol}</span>
                                    <span class="token-name">${token.name || ''}</span>
                                </span>
                                <span class="token-balance">${formatted.toFixed(4)}</span>
                            </div>`;
                            foundAny = true;
                            tokenCount++;
                        }
                    } catch (e) {
                        // بعضی توکن‌ها ممکن است خطا بدهند (نادیده گرفته می‌شوند)
                        console.log(`خطا در ${token.symbol}:`, e.message);
                    }
                }
                
                // به‌روزرسانی وضعیت
                const progress = Math.min(i + batchSize, totalTokens);
                resultDiv.innerHTML = `⏳ در حال بررسی توکن‌ها... (${progress}/${totalTokens})`;
            }

            if (!foundAny && parseFloat(ethAmount) === 0) {
                html += `<div style="color:#aaa; text-align:center; padding:20px;">😕 این ولت هیچ توکنی ندارد</div>`;
            } else if (!foundAny) {
                html += `<div style="color:#aaa; text-align:center; padding:10px;">ℹ️ فقط ETH دارد (توکن معروفی پیدا نشد)</div>`;
            } else {
                html += `<div style="color:#6fcf97; text-align:center; padding:8px; font-size:13px;">✅ ${tokenCount} توکن پیدا شد</div>`;
            }

            resultDiv.innerHTML = html;
            resultDiv.className = '';

        } catch (error) {
            resultDiv.innerHTML = '❌ خطا در اتصال به شبکه. اینترنت خود را بررسی کنید.';
            resultDiv.className = 'error';
            console.error(error);
        }
    }

    // Enter
    document.getElementById('walletInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') getAllTokens();
