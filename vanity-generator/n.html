<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مشاهده همه توکن‌های ولت</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #16213e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #fff;
            font-size: 22px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #0f3460;
            color: #fff;
            box-sizing: border-box;
            direction: ltr;
        }
        input::placeholder {
            color: #aaa;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 14px;
            background: #e94560;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #c73652;
        }
        #result {
            margin-top: 20px;
            background: #0f3460;
            padding: 16px;
            border-radius: 8px;
            color: #4fc3f7;
            font-size: 16px;
            min-height: 50px;
            max-height: 400px;
            overflow-y: auto;
        }
        .token-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a3a5c;
            color: #fff;
        }
        .token-symbol {
            font-weight: bold;
            color: #4fc3f7;
        }
        .token-balance {
            color: #ffd93d;
        }
        .error {
            color: #ff6b6b !important;
        }
        .loading {
            color: #ffd93d !important;
        }
        .eth-balance {
            background: #0a2647;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            color: #fff;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 نمایش همه توکن‌های ولت</h1>
    <input type="text" id="walletInput" placeholder="مثال: 0x742d35Cc6634C0532925a3b844Bc9e7598f0b0C5" />
    <button onclick="getAllTokens()">بررسی موجودی</button>
    <div id="result">👈 آدرس را وارد کنید</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/web3@4.16.0/dist/web3.min.js"></script>
<script>
    const INFURA_KEY = '934a2ae012c840dea039c5c2571bce16';
    const web3 = new Web3(`https://mainnet.infura.io/v3/${INFURA_KEY}`);

    // ✅ قراردادهای معروف (می‌توانید اضافه کنید)
    const TOKEN_CONTRACTS = [
        { address: '0xdac17f958d2ee523a2206206994597c13d831ec7', symbol: 'USDT', decimals: 6 },
        { address: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48', symbol: 'USDC', decimals: 6 },
        { address: '0x514910771af9ca656af840dff83e8264ecf986ca', symbol: 'LINK', decimals: 18 },
        { address: '0x1f9840a85d5af5bf1d1762f925bdaddc4201f984', symbol: 'UNI', decimals: 18 },
        { address: '0x6b3595068778dd592e39a122f4f5a5cf09c90fe2', symbol: 'SUSHI', decimals: 18 },
        { address: '0x7fc66500c84a76ad7e9c93437bfc5ac33e2ddae9', symbol: 'AAVE', decimals: 18 },
    ];

    // ABI حداقلی برای خواندن موجودی
    const ERC20_ABI = [
        {
            "constant": true,
            "inputs": [{"name": "_owner", "type": "address"}],
            "name": "balanceOf",
            "outputs": [{"name": "balance", "type": "uint256"}],
            "type": "function"
        },
        {
            "constant": true,
            "inputs": [],
            "name": "decimals",
            "outputs": [{"name": "", "type": "uint8"}],
            "type": "function"
        }
    ];

    async function getAllTokens() {
        const address = document.getElementById('walletInput').value.trim();
        const resultDiv = document.getElementById('result');

        if (!address || !address.startsWith('0x') || address.length !== 42) {
            resultDiv.innerHTML = '❌ آدرس نامعتبر است';
            resultDiv.className = 'error';
            return;
        }

        resultDiv.innerHTML = '⏳ در حال دریافت اطلاعات...';
        resultDiv.className = 'loading';

        let html = '';

        try {
            // 1️⃣ دریافت ETH
            const ethBalance = await web3.eth.getBalance(address);
            const ethAmount = web3.utils.fromWei(ethBalance, 'ether');
            html += `<div class="eth-balance">💰 ETH: <strong>${parseFloat(ethAmount).toFixed(4)}</strong></div>`;

            // 2️⃣ دریافت توکن‌ها
            let foundAny = false;

            for (const token of TOKEN_CONTRACTS) {
                try {
                    const contract = new web3.eth.Contract(ERC20_ABI, token.address);
                    const balance = await contract.methods.balanceOf(address).call();

                    if (parseFloat(balance) > 0) {
                        const formatted = parseFloat(balance) / Math.pow(10, token.decimals);
                        html += `<div class="token-item">
                            <span class="token-symbol">${token.symbol}</span>
                            <span class="token-balance">${formatted.toFixed(4)}</span>
                        </div>`;
                        foundAny = true;
                    }
                } catch (e) {
                    // بعضی توکن‌ها ممکن است خطا بدهند (نادیده گرفته می‌شوند)
                    console.log(`خطا در ${token.symbol}:`, e.message);
                }
            }

            if (!foundAny && parseFloat(ethAmount) === 0) {
                html += `<div style="color:#aaa; text-align:center; padding:20px;">😕 این ولت هیچ توکنی ندارد</div>`;
            } else if (!foundAny) {
                html += `<div style="color:#aaa; text-align:center; padding:10px;">ℹ️ فقط ETH دارد (توکن معروفی پیدا نشد)</div>`;
            }

            resultDiv.innerHTML = html;
            resultDiv.className = '';

        } catch (error) {
            resultDiv.innerHTML = '❌ خطا در اتصال به شبکه';
            resultDiv.className = 'error';
            console.error(error);
        }
    }

    // Enter
    document.getElementById('walletInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') getAllTokens();
    });
</script>

</body>
</html>
