<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Chain Wallet Scanner</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111827;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: #60a5fa;
        }

        .chain-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .chain-selector label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #1f2937;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .chain-selector label:hover {
            background: #374151;
        }

        .chain-selector input[type="radio"] {
            display: none;
        }

        .chain-selector input[type="radio"]:checked + span {
            color: #60a5fa;
            font-weight: bold;
        }

        .chain-selector label:has(input:checked) {
            border-color: #60a5fa;
            background: #1e293b;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            font-size: 15px;
            direction: ltr;
            font-family: monospace;
        }

        .buttons {
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin: 15px;
            padding: 12px;
            background: #1f2937;
            border-radius: 10px;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1f2937;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #2563eb;
            padding: 12px;
            border: 1px solid #374151;
            font-size: 14px;
        }

        td {
            padding: 12px;
            border: 1px solid #374151;
            font-size: 13px;
            direction: ltr;
            font-family: monospace;
            word-break: break-all;
        }

        .row-number {
            color: #60a5fa;
            font-weight: bold;
        }

        .balance-positive {
            color: #34d399;
        }

        .balance-zero {
            color: #9ca3af;
        }

        .balance-error {
            color: #f87171;
        }

        .chain-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .chain-polygon {
            background: #8247e5;
            color: white;
        }

        .chain-ethereum {
            background: #627eea;
            color: white;
        }

        .chain-bsc {
            background: #f3ba2f;
            color: #1e293b;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            table {
                font-size: 11px;
            }
            td,
            th {
                padding: 6px;
            }
            textarea {
                height: 150px;
                font-size: 13px;
            }
            button {
                padding: 10px 15px;
                font-size: 14px;
                width: 100%;
                margin: 5px 0;
            }
            .buttons {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            .chain-selector {
                gap: 8px;
            }
            .chain-selector label {
                padding: 8px 12px;
                font-size: 13px;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #374151;
            border-top: 3px solid #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .total-balance {
            background: #1f2937;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 10px;
            display: inline-block;
            border: 1px solid #374151;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 Multi-Chain Wallet Scanner</h1>
        <p>آدرس کیف پول‌ها را وارد کنید (هر خط یک آدرس)</p>

        <!-- انتخاب شبکه -->
        <div class="chain-selector">
            <label>
                <input type="radio" name="chain" value="polygon" checked>
                <span>🟣 Polygon</span>
            </label>
            <label>
                <input type="radio" name="chain" value="ethereum">
                <span>🔵 Ethereum</span>
            </label>
            <label>
                <input type="radio" name="chain" value="bsc">
                <span>🟡 BNB Chain</span>
            </label>
        </div>

        <textarea id="wallets" placeholder="0x123...&#10;0x456...&#10;0x789..."></textarea>

        <div class="buttons">
            <button onclick="scanWallets()" id="scanBtn">🚀 شروع اسکن</button>
            <button onclick="downloadCSV()">📥 دانلود CSV</button>
            <button onclick="clearAll()">🗑️ پاک کردن</button>
        </div>

        <div id="status">✅ آماده اسکن</div>

        <table>
            <thead>
                <tr>
                    <th style="width:50px;">ردیف</th>
                    <th>آدرس کیف پول</th>
                    <th style="width:120px;">موجودی</th>
                </tr>
            </thead>
            <tbody id="result"></tbody>
        </table>
    </div>

    <script>
        // ============ شبکه‌های پشتیبانی‌شده ============
        const CHAINS = {
            polygon: {
                name: "Polygon",
                symbol: "POL",
                rpc: [
                    "https://polygon-rpc.com",
                    "https://polygon.drpc.org"
                ]
            },
            ethereum: {
                name: "Ethereum",
                symbol: "ETH",
                rpc: [
                    "https://ethereum.publicnode.com",
                    "https://cloudflare-eth.com"
                ]
            },
            bsc: {
                name: "BNB Chain",
                symbol: "BNB",
                rpc: [
                    "https://bsc-dataseed.binance.org",
                    "https://bsc.publicnode.com"
                ]
            }
        };

        // ============ دریافت موجودی هر شبکه ============
        async function getNativeBalance(chain, address) {
            try {
                const rpc = CHAINS[chain].rpc[0];

                const response = await fetch(rpc, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        jsonrpc: "2.0",
                        method: "eth_getBalance",
                        params: [
                            address,
                            "latest"
                        ],
                        id: 1
                    })
                });

                const data = await response.json();

                if (!data.result)
                    return "0";

                return (
                    Number(BigInt(data.result)) /
                    1e18
                ).toFixed(6);

            } catch (e) {
                return "Error";
            }
        }

        // ============ دریافت شبکه انتخاب‌شده ============
        function getSelectedChain() {
            const selected = document.querySelector('input[name="chain"]:checked');
            return selected ? selected.value : "polygon";
        }

        // ============ منطق اصلی برنامه ============
        let results = [];
        const CONCURRENCY = 8;
        let isScanning = false;

        async function scanWallets() {
            if (isScanning) {
                alert("اسکن در حال اجراست، لطفاً صبر کنید...");
                return;
            }

            results = [];
            const table = document.getElementById("result");
            const status = document.getElementById("status");

            table.innerHTML = "";

            const text = document.getElementById("wallets").value.trim();

            if (!text) {
                alert("لطفاً آدرس‌ها را وارد کنید");
                return;
            }

            const wallets = text
                .split("\n")
                .map(x => x.trim())
                .filter(x => x.length > 0 && x.startsWith("0x") && x.length === 42);

            if (wallets.length === 0) {
                alert("هیچ آدرس معتبری پیدا نشد (باید با 0x شروع شوند و 42 کاراکتر باشند)");
                return;
            }

            const chain = getSelectedChain();
            const chainInfo = CHAINS[chain];

            isScanning = true;
            const scanBtn = document.getElementById("scanBtn");
            scanBtn.disabled = true;
            scanBtn.innerHTML = '⏳ در حال اسکن...';

            status.innerHTML = `
                <div class="loading-spinner"></div>
                شروع اسکن ${wallets.length} آدرس در شبکه ${chainInfo.name}...
            `;

            let index = 0;
            let completed = 0;
            let errorCount = 0;

            async function worker() {
                while (index < wallets.length) {
                    const current = index++;
                    const address = wallets[current];

                    const balance = await getNativeBalance(chain, address);

                    if (balance === "Error") {
                        errorCount++;
                    }

                    const item = {
                        address: address,
                        balance: balance,
                        chain: chain
                    };

                    results.push(item);
                    addRow(current + 1, address, balance, chain);

                    completed++;
                    status.innerHTML = `
                        <div class="loading-spinner"></div>
                        اسکن شده: ${completed} از ${wallets.length}
                        (${Math.round(completed / wallets.length * 100)}%)
                        ${errorCount > 0 ? `| ❌ خطا: ${errorCount}` : ''}
                    `;

                    if (current % 20 === 0) {
                        await new Promise(r => setTimeout(r, 50));
                    }
                }
            }

            const workers = [];
            const workerCount = Math.min(CONCURRENCY, wallets.length);

            for (let i = 0; i < workerCount; i++) {
                workers.push(worker());
            }

            await Promise.all(workers);

            // مرتب‌سازی بر اساس موجودی
            results.sort((a, b) => {
                const aNum = parseFloat(a.balance);
                const bNum = parseFloat(b.balance);
                if (isNaN(aNum)) return 1;
                if (isNaN(bNum)) return -1;
                return bNum - aNum;
            });

            table.innerHTML = "";
            results.forEach((item, i) => {
                addRow(i + 1, item.address, item.balance, item.chain);
            });

            const validBalances = results
                .filter(r => !isNaN(parseFloat(r.balance)) && r.balance !== "Error")
                .map(r => parseFloat(r.balance));

            const totalPOL = validBalances.reduce((sum, val) => sum + val, 0);
            const nonZeroCount = validBalances.filter(b => b > 0).length;

            let statusMessage = `
                ✅ اسکن ${wallets.length} آدرس در شبکه ${chainInfo.name} با موفقیت پایان یافت
                <br>
                <span class="total-balance">
                    💰 مجموع موجودی: ${totalPOL.toFixed(6)} ${chainInfo.symbol}
                    ${nonZeroCount > 0 ? `| 🟢 ${nonZeroCount} کیف پول غیرصفر` : ''}
                </span>
            `;

            if (errorCount > 0) {
                statusMessage += `<br><span style="color:#f87171;">⚠️ ${errorCount} آدرس خطا داشت</span>`;
            }

            status.innerHTML = statusMessage;

            isScanning = false;
            scanBtn.disabled = false;
            scanBtn.innerHTML = '🚀 شروع اسکن';
        }

        function addRow(number, address, balance, chain) {
            const table = document.getElementById("result");
            const row = document.createElement("tr");

            const num = parseFloat(balance);
            let balanceClass = "balance-zero";
            let displayBalance = balance;

            if (balance === "Error") {
                balanceClass = "balance-error";
            } else if (!isNaN(num) && num > 0) {
                balanceClass = "balance-positive";
            }

            if (!isNaN(num) && balance !== "Error") {
                const symbol = CHAINS[chain]?.symbol || "";
                displayBalance = `${num.toFixed(6)} ${symbol}`;
            }

            const chainInfo = CHAINS[chain];
            const chainBadge = chainInfo ? 
                `<span class="chain-badge chain-${chain}">${chainInfo.symbol}</span>` : 
                '';

            row.innerHTML = `
                <td class="row-number">${number}</td>
                <td>
                    ${address}
                    <br>
                    <small>${chainBadge}</small>
                </td>
                <td class="${balanceClass}">${displayBalance}</td>
            `;

            table.appendChild(row);
        }

        function downloadCSV() {
            if (results.length === 0) {
                alert("ابتدا اسکن را انجام دهید");
                return;
            }

            let csv = "Address,Chain,Balance\n";

            results.forEach(item => {
                const chainName = CHAINS[item.chain]?.name || item.chain || "Unknown";
                const cleanBalance = isNaN(parseFloat(item.balance)) ? 
                    item.balance : 
                    parseFloat(item.balance).toFixed(6);
                csv += `${item.address},${chainName},${cleanBalance}\n`;
            });

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = `wallet-results-${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            if (results.length > 0 && !confirm("همه نتایج پاک شوند؟")) {
                return;
            }

            document.getElementById("wallets").value = "";
            document.getElementById("result").innerHTML = "";
            document.getElementById("status").innerHTML = "🗑️ پاک شد";
            results = [];
        }

        // Enter key support
        document.getElementById("wallets").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                scanWallets();
            }
        });

        // نمایش تعداد آدرس‌ها
        document.getElementById("wallets").addEventListener("input", function() {
            const count = this.value
                .split("\n")
                .filter(x => x.trim().startsWith("0x") && x.trim().length === 42)
                .length;

            const chain = getSelectedChain();
            const chainInfo = CHAINS[chain];

            if (count > 0) {
                document.getElementById("status").innerHTML = 
                    `📝 ${count} آدرس معتبر شناسایی شد | شبکه: ${chainInfo.name}`;
            }
        });

        // تغییر شبکه - به‌روزرسانی status
        document.querySelectorAll('input[name="chain"]').forEach(radio => {
            radio.addEventListener("change", function() {
                const chain = this.value;
                const chainInfo = CHAINS[chain];
                document.getElementById("status").innerHTML = 
                    `🔄 شبکه انتخاب‌شده: ${chainInfo.name} (${chainInfo.symbol})`;
            });
        });

        console.log("✅ Multi-Chain Wallet Scanner loaded!");
        console.log(`🔗 Supported chains: ${Object.keys(CHAINS).join(", ")}`);
        console.log(`⚡ Concurrency: ${CONCURRENCY}`);
    </script>

</body>
</html>
