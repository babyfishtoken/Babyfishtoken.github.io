<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Polygon Vanity Address Generator</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.min.js"></script>

<style>
body {
    font-family: Arial;
    background:#111827;
    color:white;
    text-align:center;
    padding:40px;
}

.box {
    max-width:600px;
    margin:auto;
    background:#1f2937;
    padding:30px;
    border-radius:15px;
}

input,button {
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button {
    background:#8247e5;
    color:white;
    cursor:pointer;
}

.result {
    background:#111;
    padding:15px;
    margin-top:20px;
    word-break:break-all;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="box">

<h1>Vanity Address Generator</h1>

<p>
ساخت آدرس رند Ethereum / Polygon
</p>

<input id="pattern" placeholder="مثلا: ABCD">

<button onclick="start()">شروع جستجو</button>

<div id="status"></div>

<div class="result" id="result"></div>

</div>


<script>

let running=false;


async function start(){

    if(running) return;

    let pattern =
    document.getElementById("pattern")
    .value
    .toLowerCase()
    .replace("0x","");


    if(!pattern){
        alert("الگو وارد کنید");
        return;
    }


    running=true;

    let count=0;

    document.getElementById("result").innerHTML="";


    while(running){

        let wallet =
        ethers.Wallet.createRandom();


        let address =
        wallet.address
        .toLowerCase()
        .replace("0x","");


        count++;


        document.getElementById("status").innerHTML =
        "تعداد تلاش: " + count;


        if(address.startsWith(pattern)){

            running=false;


            document.getElementById("result").innerHTML =
            `
            <h3>پیدا شد!</h3>
            
            Address:
            <br>
            ${wallet.address}

            <hr>

            Private Key:
            <br>
            ${wallet.privateKey}

            `;

        }

        // جلوگیری از فریز شدن مرورگر
        await new Promise(r=>setTimeout(r,0));
    }

}

</script>


</body>
  </html>
