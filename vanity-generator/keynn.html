<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جستجوی خودکار کیف پول</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px 15px;
    background:#111827;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:850px;
    margin:auto;
    background:#1f2937;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    margin-top:0;
    color:#60a5fa;
}

h1 span{
    color:#f59e0b;
    font-size:14px;
    display:block;
    margin-top:5px;
}

textarea{
    width:100%;
    height:120px;
    padding:15px;
    border:1px solid #374151;
    border-radius:12px;
    background:#111827;
    color:#fff;
    font-size:16px;
    resize:none;
    direction:ltr;
    text-align:left;
    transition:0.3s;
}

textarea.found{
    border:3px solid #34d399;
    box-shadow:0 0 30px rgba(52,211,153,0.4);
}

textarea.checking{
    border:2px solid #f59e0b;
    box-shadow:0 0 20px rgba(245,158,11,0.2);
}

.btn-group{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.btn-group button{
    flex:1;
    padding:12px 10px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:15px;
    cursor:pointer;
    min-width:70px;
    transition:0.2s;
}

.btn-group button:disabled{
    opacity:0.4;
    cursor:not-allowed;
}

.btn-primary{
    background:#2563eb;
}
.btn-primary:hover:not(:disabled){
    background:#1d4ed8;
}

.btn-random{
    background:#059669;
}
.btn-random:hover:not(:disabled){
    background:#047857;
}

.btn-copy{
    background:#7c3aed;
}
.btn-copy:hover:not(:disabled){
    background:#6d28d9;
}

.btn-start{
    background:#059669;
}
.btn-start:hover:not(:disabled){
    background:#047857;
}

.btn-stop{
    background:#dc2626;
}
.btn-stop:hover:not(:disabled){
    background:#b91c1c;
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#111827;
    border-radius:12px;
}

.label{
    color:#9ca3af;
    margin-bottom:8px;
}

.address{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    color:#34d399;
    font-family:monospace;
    font-size:15px;
}

.error{
    margin-top:15px;
    color:#f87171;
    text-align:center;
}

.status{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
    display:none;
}

.status.loading{
    display:block;
    background:#1e3a5f;
    color:#60a5fa;
}

.status.success{
    display:block;
    background:#064e3b;
    color:#34d399;
}

.status.error{
    display:block;
    background:#7f1d1d;
    color:#f87171;
}

.status.info{
    display:block;
    background:#1e3a5f;
    color:#60a5fa;
}

.status.found{
    display:block;
    background:#064e3b;
    color:#34d399;
    border:2px solid #34d399;
    animation: pulse 1.5s ease-in-out infinite;
}

.status.checking{
    display:block;
    background:#1e3a5f;
    color:#f59e0b;
    border:2px solid #f59e0b;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.info{
    margin-top:12px;
    color:#9ca3af;
    font-size:13px;
    text-align:center;
}

.counter{
    margin-top:10px;
    text-align:center;
    color:#60a5fa;
    font-size:14px;
}

.counter.found{
    color:#34d399;
    font-weight:bold;
    font-size:18px;
}

.counter.checking{
    color:#f59e0b;
}

/* ===== لیست‌های جداگانه ===== */
.lists-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
}

.list-box {
    background: #0a1a2f;
    border-radius: 12px;
    padding: 15px;
    border: 1px solid #2a4a6f;
    display: none;
}

.list-box .title {
    color: #60a5fa;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 10px;
    text-align: center;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a4a6f;
}

.list-box .title .count {
    color: #f59e0b;
    font-size: 14px;
}

.list-box .items {
    font-family: monospace;
    font-size: 13px;
    direction: ltr;
    text-align: left;
    color: #d1d5db;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 300px;
    overflow-y: auto;
    padding: 5px;
    line-height: 1.8;
}

.list-box .items::-webkit-scrollbar {
    width: 6px;
}

.list-box .items::-webkit-scrollbar-track {
    background: #1a2a3f;
    border-radius: 10px;
}

.list-box .items::-webkit-scrollbar-thumb {
    background: #3a6a9f;
    border-radius: 10px;
}

.list-box.addresses {
    border-color: #34d399;
}

.list-box.addresses .title {
    color: #34d399;
}

.list-box.mnemonics {
    border-color: #f59e0b;
}

.list-box.mnemonics .title {
    color: #f59e0b;
}

.copy-list-btn {
    background: #7c3aed;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.2s;
}

.copy-list-btn:hover {
    background: #6d28d9;
}

.stats{
    display:flex;
    justify-content:space-around;
    margin-top:10px;
    padding:10px;
    background:#0a2647;
    border-radius:8px;
    flex-wrap:wrap;
}

.stats div{
    text-align:center;
    padding:5px 10px;
}

.stats .number{
    color:#f59e0b;
    font-size:20px;
    font-weight:bold;
}

.stats .number.green{
    color:#34d399;
}

.stats .label{
    color:#9ca3af;
    font-size:12px;
}

.spinner {
    display:inline-block;
    width:16px;
    height:16px;
    border:3px solid #f59e0b;
    border-top:3px solid transparent;
    border-radius:50%;
    animation: spin 0.8s linear infinite;
    margin-right:8px;
    vertical-align:middle;
}

.spinner-white {
    border:3px solid #fff;
    border-top:3px solid transparent;
}
</style>
</head>

<body>

<div class="container">

    <h1>
        🔑 جستجوی خودکار کیف پول
        <span>⏳ ذخیره جداگانه آدرس‌ها و عبارات</span>
    </h1>

    <div id="status" class="status loading">⏳ در حال بارگذاری کلمات از فایل key.txt...</div>

    <textarea
        id="mnemonic"
        placeholder="12 کلمه را با فاصله وارد کنید..."
        autocomplete="off"
        spellcheck="false"></textarea>

    <div class="btn-group">
        <button class="btn-random" id="randomBtn" onclick="setRandomMnemonic()" disabled>
            🎲 تصادفی
        </button>
        <button class="btn-primary" onclick="generateAddress()">
            🔍 نمایش آدرس
        </button>
        <button class="btn-copy" onclick="copyMnemonic()" id="copyBtn" disabled>
            📋 کپی
        </button>
        <button class="btn-start" id="autoBtn" onclick="toggleAutoFind()" disabled>
            🚀 شروع جستجو
        </button>
    </div>

    <div id="counter" class="counter"></div>
    <div id="error" class="error"></div>

    <div id="result" class="result">
        <div class="label">آدرس کیف پول:</div>
        <div id="address" class="address"></div>
    </div>

    <!-- لیست‌های جداگانه -->
    <div class="lists-container">
        <!-- لیست آدرس‌ها -->
        <div id="addressListBox" class="list-box addresses">
            <div class="title">🔗 لیست آدرس‌ها <span class="count" id="addressCount">(0)</span></div>
            <div id="addressList" class="items"></div>
            <button class="copy-list-btn" onclick="copyAddressList()">📋 کپی همه آدرس‌ها</button>
        </div>

        <!-- لیست عبارات -->
        <div id="mnemonicListBox" class="list-box mnemonics">
            <div class="title">🔑 لیست عبارات ۱۲ کلمه‌ای <span class="count" id="mnemonicCount">(0)</span></div>
            <div id="mnemonicList" class="items"></div>
            <button class="copy-list-btn" onclick="copyMnemonicList()">📋 کپی همه عبارات</button>
        </div>
    </div>

    <div id="stats" class="stats" style="display:none;">
        <div>
            <div class="number" id="statAttempts">0</div>
            <div class="label">تعداد تلاش</div>
        </div>
        <div>
            <div class="number green" id="statFound">0</div>
            <div class="label">پیدا شده</div>
        </div>
        <div>
            <div class="number" id="statSpeed">0</div>
            <div class="label">سرعت (تلاش/ثانیه)</div>
        </div>
    </div>

    <div class="info">
        ⏳ هر کیف پول پیدا شده در دو لیست جداگانه ذخیره می‌شود | 🔒 آدرس‌ها و عبارات جدا
    </div>

</div>

<script>

let fileWords = [];
let isAutoFinding = false;
let autoInterval = null;
let attempts = 0;
let foundCount = 0;
let startTime = 0;

// آرایه‌های جداگانه
let foundAddresses = [];
let foundMnemonics = [];

const statusDiv = document.getElementById('status');
const randomBtn = document.getElementById('randomBtn');
const copyBtn = document.getElementById('copyBtn');
const autoBtn = document.getElementById('autoBtn');
const mnemonicInput = document.getElementById('mnemonic');
const resultDiv = document.getElementById('result');
const addressBox = document.getElementById('address');
const errorBox = document.getElementById('error');
const counterDiv = document.getElementById('counter');
const statsDiv = document.getElementById('stats');
const statAttempts = document.getElementById('statAttempts');
const statFound = document.getElementById('statFound');
const statSpeed = document.getElementById('statSpeed');

const addressListBox = document.getElementById('addressListBox');
const mnemonicListBox = document.getElementById('mnemonicListBox');
const addressList = document.getElementById('addressList');
const mnemonicList = document.getElementById('mnemonicList');
const addressCount = document.getElementById('addressCount');
const mnemonicCount = document.getElementById('mnemonicCount');

// ==================== بارگذاری فایل ====================
async function loadWords() {
    try {
        statusDiv.className = 'status loading';
        statusDiv.textContent = '⏳ در حال خواندن فایل key.txt...';
        statusDiv.style.display = 'block';

        const response = await fetch('key.txt');

        if (!response.ok) {
            throw new Error(`خطا: ${response.status}`);
        }

        const content = await response.text();
        fileWords = content.split(/\r?\n/).filter(line => line.trim() !== '');

        if (fileWords.length === 0) {
            throw new Error('فایل خالی است!');
        }

        if (fileWords.length < 12) {
            throw new Error(`فایل فقط ${fileWords.length} کلمه دارد! حداقل ۱۲ کلمه نیاز است.`);
        }

        statusDiv.className = 'status success';
        statusDiv.textContent = `✅ ${fileWords.length} کلمه بارگذاری شد!`;
        randomBtn.disabled = false;
        autoBtn.disabled = false;
        copyBtn.disabled = true;
        autoBtn.textContent = '🚀 شروع جستجو';

        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);

    } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.textContent = `❌ خطا: ${error.message}`;
        statusDiv.style.display = 'block';
        randomBtn.disabled = true;
        autoBtn.disabled = true;
        copyBtn.disabled = true;
        console.error('Error loading file:', error);
    }
}

// ==================== توابع کمکی ====================
function getRandomWords() {
    if (fileWords.length === 0) return null;
    let selectedWords = [];
    for (let i = 0; i < 12; i++) {
        const randomIndex = Math.floor(Math.random() * fileWords.length);
        selectedWords.push(fileWords[randomIndex]);
    }
    return selectedWords;
}

function setRandomMnemonic() {
    if (fileWords.length === 0) {
        errorBox.textContent = '❌ فایل بارگذاری نشده است!';
        return;
    }
    const words = getRandomWords();
    if (!words) return;
    mnemonicInput.value = words.join(' ');
    mnemonicInput.classList.remove('found', 'checking');
    copyBtn.disabled = false;
    errorBox.textContent = '';
    resultDiv.style.display = 'none';
    
    statusDiv.className = 'status success';
    statusDiv.textContent = '✅ ۱۲ کلمه تصادفی انتخاب شد!';
    statusDiv.style.display = 'block';
    setTimeout(() => {
        statusDiv.style.display = 'none';
    }, 2000);
}

// ==================== تولید آدرس ====================
function tryGenerateAddress(mnemonic) {
    try {
        if (typeof ethers === "undefined") {
            return { success: false, error: "کتابخانه ethers بارگذاری نشده است." };
        }
        const words = mnemonic.split(" ");
        if (words.length !== 12) {
            return { success: false, error: "عبارت باید دقیقاً ۱۲ کلمه داشته باشد." };
        }
        if (!ethers.Mnemonic.isValidMnemonic(mnemonic)) {
            return { success: false, error: "عبارت بازیابی معتبر نیست." };
        }
        const wallet = ethers.HDNodeWallet.fromPhrase(mnemonic);
        return { success: true, address: wallet.address };
    } catch (error) {
        console.error(error);
        return { success: false, error: "خطا در پردازش عبارت بازیابی." };
    }
}

function generateAddress() {
    const input = mnemonicInput;
    const result = resultDiv;
    const addressBox = document.getElementById("address");
    const errorBox = document.getElementById("error");

    result.style.display = "none";
    errorBox.textContent = "";

    const mnemonic = input.value.trim().replace(/\s+/g, " ");

    if (!mnemonic) {
        errorBox.textContent = "❌ عبارت بازیابی را وارد کنید.";
        return;
    }

    if (typeof ethers === "undefined") {
        errorBox.textContent = "❌ کتابخانه ethers بارگذاری نشده است.";
        return;
    }

    const words = mnemonic.split(" ");
    if (words.length !== 12) {
        errorBox.textContent = "❌ عبارت باید دقیقاً ۱۲ کلمه داشته باشد.";
        return;
    }

    try {
        if (!ethers.Mnemonic.isValidMnemonic(mnemonic)) {
            errorBox.textContent = "❌ عبارت بازیابی معتبر نیست.";
            return;
        }
        const wallet = ethers.HDNodeWallet.fromPhrase(mnemonic);
        const currentAddress = wallet.address;
        addressBox.textContent = currentAddress;
        result.style.display = "block";
        copyBtn.disabled = false;

    } catch (error) {
        console.error(error);
        errorBox.textContent = "❌ خطا در پردازش عبارت بازیابی.";
    }
}

// ==================== به‌روزرسانی لیست‌ها ====================
function updateLists() {
    // لیست آدرس‌ها
    if (foundAddresses.length > 0) {
        addressListBox.style.display = 'block';
        addressList.textContent = foundAddresses.join('\n');
        addressCount.textContent = `(${foundAddresses.length})`;
    }

    // لیست عبارات
    if (foundMnemonics.length > 0) {
        mnemonicListBox.style.display = 'block';
        mnemonicList.textContent = foundMnemonics.join('\n\n');
        mnemonicCount.textContent = `(${foundMnemonics.length})`;
    }
}

// ==================== کپی لیست‌ها ====================
function copyAddressList() {
    const text = foundAddresses.join('\n');
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        alert('✅ لیست آدرس‌ها کپی شد!');
    }).catch(() => {
        // fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('✅ لیست آدرس‌ها کپی شد!');
    });
}

function copyMnemonicList() {
    const text = foundMnemonics.join('\n\n');
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        alert('✅ لیست عبارات کپی شد!');
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('✅ لیست عبارات کپی شد!');
    });
}

// ==================== جستجوی خودکار ====================
function findAddressAuto() {
    if (isAutoFinding === false) return;

    attempts++;
    const words = getRandomWords();
    if (!words) {
        stopAutoFind();
        return;
    }

    const mnemonic = words.join(' ');
    
    mnemonicInput.value = mnemonic;
    mnemonicInput.classList.add('checking');
    mnemonicInput.classList.remove('found');

    const result = tryGenerateAddress(mnemonic);
    
    if (result.success) {
        const address = result.address;
        addressBox.textContent = address;
        resultDiv.style.display = "block";
        errorBox.textContent = "";
        copyBtn.disabled = false;

        statAttempts.textContent = attempts;
        statsDiv.style.display = 'flex';
        
        if (startTime > 0) {
            const elapsed = (Date.now() - startTime) / 1000;
            if (elapsed > 0) {
                const speed = Math.round(attempts / elapsed);
                statSpeed.textContent = speed;
            }
        }

        // ✅ پیدا شد - ذخیره در آرایه‌های جداگانه
        foundCount++;
        statFound.textContent = foundCount;
        
        foundAddresses.push(address);
        foundMnemonics.push(mnemonic);

        // به‌روزرسانی لیست‌ها
        updateLists();

        mnemonicInput.classList.remove('checking');
        mnemonicInput.classList.add('found');

        statusDiv.className = 'status found';
        statusDiv.textContent = `✅ کیف پول پیدا شد! (${foundCount} تا)`;
        statusDiv.style.display = 'block';
        
        counterDiv.className = 'counter found';
        counterDiv.textContent = `✅ ${foundCount} کیف پول پیدا شد!`;
        
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 2000);
        
    } else {
        errorBox.textContent = `❌ ${result.error}`;
        counterDiv.textContent = `🔄 خطا... (${attempts})`;
    }
}

function toggleAutoFind() {
    if (isAutoFinding) {
        stopAutoFind();
    } else {
        startAutoFind();
    }
}

function startAutoFind() {
    if (fileWords.length === 0) {
        errorBox.textContent = '❌ فایل بارگذاری نشده است!';
        return;
    }

    isAutoFinding = true;
    attempts = 0;
    foundCount = 0;
    startTime = Date.now();
    
    // ریست لیست‌ها (اختیاری - اگر می‌خواهید از صفر شروع شود)
    // foundAddresses = [];
    // foundMnemonics = [];
    // addressListBox.style.display = 'none';
    // mnemonicListBox.style.display = 'none';
    // addressList.textContent = '';
    // mnemonicList.textContent = '';
    
    statsDiv.style.display = 'flex';
    statAttempts.textContent = '0';
    statFound.textContent = '0';
    statSpeed.textContent = '0';
    
    autoBtn.textContent = '⏹ توقف';
    autoBtn.className = 'btn-stop';
    randomBtn.disabled = true;
    
    counterDiv.className = 'counter';
    counterDiv.textContent = '⚡ شروع جستجو...';
    errorBox.textContent = '';
    resultDiv.style.display = 'none';
    
    statusDiv.className = 'status info';
    statusDiv.textContent = '⚡ جستجو در حال اجرا...';
    statusDiv.style.display = 'block';

    setTimeout(() => {
        findAddressAuto();
    }, 200);
    
    autoInterval = setInterval(findAddressAuto, 50);
}

function stopAutoFind() {
    isAutoFinding = false;
    if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
    }
    
    autoBtn.textContent = '🚀 شروع جستجو';
    autoBtn.className = 'btn-start';
    randomBtn.disabled = false;
    
    if (foundCount === 0) {
        statusDiv.className = 'status info';
        statusDiv.textContent = '⏹ جستجو متوقف شد. هیچ کیف پولی پیدا نشد.';
        statusDiv.style.display = 'block';
        counterDiv.textContent = `⏹ متوقف شد. ${attempts} تلاش`;
        mnemonicInput.classList.remove('checking');
        
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);
    } else {
        statusDiv.className = 'status success';
        statusDiv.textContent = `✅ جستجو متوقف شد. ${foundCount} کیف پول پیدا شد!`;
        statusDiv.style.display = 'block';
        counterDiv.textContent = `✅ ${foundCount} کیف پول پیدا شد!`;
    }
}

// ==================== کپی ====================
function copyMnemonic() {
    const text = mnemonicInput.value;
    if (!text) return;

    navigator.clipboard.writeText(text).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ کپی شد!';
        setTimeout(() => {
            copyBtn.textContent = originalText;
        }, 2000);
    }).catch(() => {
        mnemonicInput.select();
        document.execCommand('copy');
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ کپی شد!';
        setTimeout(() => {
            copyBtn.textContent = originalText;
        }, 2000);
    });
}

// ==================== بارگذاری اولیه ====================
