<script type="module">

/* =========================================================
   IMPORTS - نسخه ساده و پایدار
========================================================= */

import {
    mnemonicToSeedSync,
    mnemonicToEntropy,
    validateMnemonic
} from "https://esm.sh/@scure/bip39@1.3.0";

import {
    wordlist as english
} from "https://esm.sh/@scure/bip39@1.3.0/wordlists/english.js";

import {
    HDKey
} from "https://esm.sh/@scure/bip32@1.4.0";

import {
    secp256k1
} from "https://esm.sh/@noble/curves@1.4.2/secp256k1";

import {
    sha256,
    sha224,
    sha512
} from "https://esm.sh/@noble/hashes@1.4.0/sha2.js";

import {
    keccak_256
} from "https://esm.sh/@noble/hashes@1.4.0/sha3.js";

import {
    blake2b
} from "https://esm.sh/@noble/hashes@1.4.0/blake2.js";

import {
    ripemd160
} from "https://esm.sh/@noble/hashes@1.4.0/legacy.js";

// استفاده از یک کتابخانه ساده برای ed25519
// https://github.com/dchest/tweetnacl-js
import nacl from "https://esm.sh/tweetnacl@1.0.3";

/* =========================================================
   DOM
========================================================= */

const input = document.getElementById("mnemonic");
const button = document.getElementById("generate");
const status = document.getElementById("status");
const results = document.getElementById("results");

/* =========================================================
   BASIC HELPERS
========================================================= */

const HARDENED = 0x80000000;

function harden(n){
    return (n + HARDENED) >>> 0;
}

function concat(...arrays){
    let length = 0;
    for(const array of arrays){
        length += array.length;
    }
    const result = new Uint8Array(length);
    let offset = 0;
    for(const array of arrays){
        result.set(array, offset);
        offset += array.length;
    }
    return result;
}

function hex(bytes){
    let result = "";
    for(const byte of bytes){
        result += byte.toString(16).padStart(2,"0");
    }
    return result;
}

function textBytes(text){
    return new TextEncoder().encode(text);
}

/* =========================================================
   HMAC SHA512
========================================================= */

function hmacSha512(key,data){
    const BLOCK = 128;
    if(key.length > BLOCK){
        key = sha512(key);
    }
    const k = new Uint8Array(BLOCK);
    k.set(key);
    const ipad = new Uint8Array(BLOCK);
    const opad = new Uint8Array(BLOCK);
    for(let i=0;i<BLOCK;i++){
        ipad[i] = k[i] ^ 0x36;
        opad[i] = k[i] ^ 0x5c;
    }
    return sha512(
        concat(
            opad,
            sha512(
                concat(ipad,data)
            )
        )
    );
}

/* =========================================================
   SLIP-0010 ED25519 با استفاده از tweetnacl
========================================================= */

function slip10(seed,path){
    let I = hmacSha512(textBytes("ed25519 seed"), seed);
    let key = I.slice(0,32);
    let chain = I.slice(32);
    
    for(const index of path){
        const indexBytes = new Uint8Array([
            (index >>> 24) & 255,
            (index >>> 16) & 255,
            (index >>> 8) & 255,
            index & 255
        ]);
        I = hmacSha512(chain, concat(new Uint8Array([0]), key, indexBytes));
        key = I.slice(0,32);
        chain = I.slice(32);
    }
    return key;
}

/* =========================================================
   BASE58
========================================================= */

const BTC58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
const XRP58 = "rpshnaf39wBUDNEGHJKLM4PQRST7VWXYZ2bcdeCg65jkm8oFqi1tuvAxyz";

function base58(bytes, alphabet=BTC58){
    if(bytes.length === 0){
        return "";
    }
    let digits = [0];
    for(const byte of bytes){
        let carry = byte;
        for(let i=0;i<digits.length;i++){
            const value = digits[i] * 256 + carry;
            digits[i] = value % 58;
            carry = Math.floor(value / 58);
        }
        while(carry > 0){
            digits.push(carry % 58);
            carry = Math.floor(carry / 58);
        }
    }
    let zeros = 0;
    while(zeros < bytes.length && bytes[zeros] === 0){
        zeros++;
    }
    let result = "";
    for(let i=0;i<zeros;i++){
        result += alphabet[0];
    }
    for(let i=digits.length-1; i>=0; i--){
        result += alphabet[digits[i]];
    }
    if(result.length > zeros && result[zeros] === alphabet[0]){
        result = result.slice(0,zeros) + result.slice(zeros+1);
    }
    return result;
}

/* =========================================================
   BASE58 CHECK
========================================================= */

function base58Check(payload, alphabet=BTC58){
    const checksum = sha256(sha256(payload)).slice(0,4);
    return base58(concat(payload,checksum), alphabet);
}

/* =========================================================
   SECP PUBLIC KEY
========================================================= */

function secpPublic(seed,path){
    const root = HDKey.fromMasterSeed(seed);
    const child = root.derive(path);
    if(!child.publicKey){
        throw new Error("Public key unavailable");
    }
    return child.publicKey;
}

/* =========================================================
   HASH160
========================================================= */

function hash160(data){
    return ripemd160(sha256(data));
}

/* =========================================================
   BITCOIN LEGACY
========================================================= */

function bitcoinLegacy(seed){
    const pub = secpPublic(seed, "m/44'/0'/0'/0/0");
    return base58Check(concat(new Uint8Array([0x00]), hash160(pub)));
}

/* =========================================================
   BITCOIN NESTED SEGWIT
========================================================= */

function bitcoinNested(seed){
    const pub = secpPublic(seed, "m/49'/0'/0'/0/0");
    const redeem = concat(new Uint8Array([0x00,0x14]), hash160(pub));
    return base58Check(concat(new Uint8Array([0x05]), hash160(redeem)));
}

/* =========================================================
   BECH32
========================================================= */

const BECH32 = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";

function polymod(values){
    const generator = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3];
    let chk = 1;
    for(const value of values){
        const top = chk >>> 25;
        chk = ((chk & 0x1ffffff) << 5) ^ value;
        for(let i=0;i<5;i++){
            if((top >>> i) & 1){
                chk ^= generator[i];
            }
        }
    }
    return chk >>> 0;
}

function hrpExpand(hrp){
    const result=[];
    for(let i=0;i<hrp.length;i++){
        result.push(hrp.charCodeAt(i) >>> 5);
    }
    result.push(0);
    for(let i=0;i<hrp.length;i++){
        result.push(hrp.charCodeAt(i) & 31);
    }
    return result;
}

function createChecksum(hrp, data, constant){
    const values = hrpExpand(hrp).concat(data).concat([0,0,0,0,0,0]);
    const mod = polymod(values) ^ constant;
    const result=[];
    for(let i=0;i<6;i++){
        result.push((mod >>> (5*(5-i))) & 31);
    }
    return result;
}

function bech32Encode(hrp, data, constant){
    const complete = data.concat(createChecksum(hrp, data, constant));
    return hrp + "1" + complete.map(x=>BECH32[x]).join("");
}

function convertBits(data, fromBits, toBits, pad=true){
    let acc=0;
    let bits=0;
    const result=[];
    const maxValue = (1 << toBits)-1;
    const maxAcc = (1 << (fromBits+toBits-1))-1;
    for(const value of data){
        if(value < 0 || (value >> fromBits) !== 0){
            return null;
        }
        acc = ((acc << fromBits) | value) & maxAcc;
        bits += fromBits;
        while(bits >= toBits){
            bits -= toBits;
            result.push((acc >>> bits) & maxValue);
        }
    }
    if(pad){
        if(bits > 0){
            result.push((acc << (toBits-bits)) & maxValue);
        }
    }else{
        if(bits >= fromBits || ((acc << (toBits-bits)) & maxValue) !== 0){
            return null;
        }
    }
    return result;
}

/* =========================================================
   BITCOIN NATIVE SEGWIT
========================================================= */

function bitcoinSegwit(seed){
    const pub = secpPublic(seed, "m/84'/0'/0'/0/0");
    const program = hash160(pub);
    const words = convertBits(program, 8, 5, true);
    return bech32Encode("bc", [0].concat(words), 1);
}

/* =========================================================
   BITCOIN TAPROOT
========================================================= */

function taggedHash(tag,data){
    const tagHash = sha256(textBytes(tag));
    return sha256(concat(tagHash, tagHash, data));
}

function bitcoinTaproot(seed){
    const node = HDKey.fromMasterSeed(seed).derive("m/86'/0'/0'/0/0");
    if(!node.privateKey){
        throw new Error("Private key unavailable");
    }
    let privateKey = node.privateKey;
    let point = secp256k1.ProjectivePoint.fromPrivateKey(privateKey);
    let compressed = point.toRawBytes(true);
    if((compressed[0] & 1) !== 0){
        const n = secp256k1.CURVE.n;
        const d = BigInt("0x"+hex(privateKey));
        const newD = n-d;
        const h = newD.toString(16).padStart(64,"0");
        privateKey = new Uint8Array(32);
        for(let i=0;i<32;i++){
            privateKey[i] = parseInt(h.slice(i*2,i*2+2), 16);
        }
        point = secp256k1.ProjectivePoint.fromPrivateKey(privateKey);
    }
    const xOnly = point.toRawBytes(true).slice(1);
    const tweak = taggedHash("TapTweak", xOnly);
    const tweakNumber = BigInt("0x"+hex(tweak));
    if(tweakNumber >= secp256k1.CURVE.n){
        throw new Error("Invalid Taproot tweak");
    }
    const Q = point.add(secp256k1.ProjectivePoint.BASE.multiply(tweakNumber));
    const qX = Q.toRawBytes(true).slice(1);
    const words = convertBits(qX, 8, 5, true);
    return bech32Encode("bc", [1].concat(words), 0x2bc830a3);
}

/* =========================================================
   ETHEREUM
========================================================= */

function ethereum(seed){
    const pub = secpPublic(seed, "m/44'/60'/0'/0/0");
    const point = secp256k1.ProjectivePoint.fromHex(pub);
    const uncompressed = point.toRawBytes(false);
    const hash = keccak_256(uncompressed.slice(1));
    return "0x" + hex(hash.slice(-20));
}

/* =========================================================
   SOLANA با tweetnacl
========================================================= */

function solana(seed){
    const key = slip10(seed, [harden(44), harden(501), harden(0), harden(0)]);
    // استفاده از tweetnacl برای تولید کلید عمومی
    const keyPair = nacl.sign.keyPair.fromSeed(key);
    return base58(keyPair.publicKey);
}

/* =========================================================
   XRP
========================================================= */

function xrp(seed){
    const pub = secpPublic(seed, "m/44'/144'/0'/0/0");
    const accountID = hash160(pub);
    return base58Check(concat(new Uint8Array([0x00]), accountID), XRP58);
}

/* =========================================================
   TRON
========================================================= */

function tron(seed){
    const pub = secpPublic(seed, "m/44'/195'/0'/0/0");
    const point = secp256k1.ProjectivePoint.fromHex(pub);
    const uncompressed = point.toRawBytes(false);
    const hash = keccak_256(uncompressed.slice(1));
    return base58Check(concat(new Uint8Array([0x41]), hash.slice(-20)));
}

/* =========================================================
   SUI
========================================================= */

function sui(seed){
    const key = slip10(seed, [harden(44), harden(784), harden(0), harden(0), harden(0)]);
    const keyPair = nacl.sign.keyPair.fromSeed(key);
    const pub = keyPair.publicKey;
    const data = concat(new Uint8Array([0x00]), pub);
    const digest = blake2b(data, {dkLen:32});
    return "0x"+hex(digest);
}

/* =========================================================
   STELLAR
========================================================= */

function crc16Xmodem(data){
    let crc=0;
    for(const byte of data){
        crc ^= byte << 8;
        for(let i=0;i<8;i++){
            if(crc & 0x8000){
                crc = ((crc << 1) ^ 0x1021) & 0xffff;
            }else{
                crc = (crc << 1) & 0xffff;
            }
        }
    }
    return crc;
}

const BASE32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

function base32(data){
    let buffer=0;
    let bits=0;
    let output="";
    for(const byte of data){
        buffer = (buffer << 8) | byte;
        bits += 8;
        while(bits >= 5){
            bits -= 5;
            output += BASE32[(buffer >>> bits) & 31];
        }
    }
    if(bits > 0){
        output += BASE32[(buffer << (5-bits)) & 31];
    }
    return output;
}

function stellar(seed){
    const key = slip10(seed, [harden(44), harden(148), harden(0)]);
    const keyPair = nacl.sign.keyPair.fromSeed(key);
    const pub = keyPair.publicKey;
    const payload = concat(new Uint8Array([0x30]), pub);
    const crc = crc16Xmodem(payload);
    const checksum = new Uint8Array([crc & 255, (crc >>> 8) & 255]);
    return base32(concat(payload, checksum));
}

/* =========================================================
   ICP
========================================================= */

function crc32(data){
    let crc=0xffffffff;
    for(const byte of data){
        crc ^= byte;
        for(let i=0;i<8;i++){
            if(crc & 1){
                crc = (crc >>> 1) ^ 0xedb88320;
            }else{
                crc >>>= 1;
            }
        }
    }
    return (crc ^ 0xffffffff) >>> 0;
}

function icp(seed){
    const key = slip10(seed, [harden(44), harden(223), harden(0), harden(0), 0]);
    const keyPair = nacl.sign.keyPair.fromSeed(key);
    const pub = keyPair.publicKey;
    const derPrefix = new Uint8Array([0x30,0x2a, 0x30,0x05, 0x06,0x03, 0x2b,0x65,0x70, 0x03,0x21, 0x00]);
    const der = concat(derPrefix, pub);
    const digest = sha224(der);
    const principal = concat(digest, new Uint8Array([0x02]));
    const crc = crc32(principal);
    const crcBytes = new Uint8Array([
        (crc >>> 24) & 255,
        (crc >>> 16) & 255,
        (crc >>> 8) & 255,
        crc & 255
    ]);
    return base32(concat(crcBytes, principal)).toLowerCase();
}

/* =========================================================
   LITECOIN
========================================================= */

function litecoin(seed){
    const pub = secpPublic(seed, "m/44'/2'/0'/0/0");
    return base58Check(concat(new Uint8Array([0x30]), hash160(pub)));
}

/* =========================================================
   DOGECOIN
========================================================= */

function dogecoin(seed){
    const pub = secpPublic(seed, "m/44'/3'/0'/0/0");
    return base58Check(concat(new Uint8Array([0x1e]), hash160(pub)));
}

/* =========================================================
   CARDANO
========================================================= */

async function cardano(seed, mnemonic){
    try {
        const module = await import("https://esm.sh/@emurgo/cardano-serialization-lib-browser@15.0.3");
        const CSL = module.default || module;
        const entropyHex = mnemonicToEntropy(mnemonic, english);
        const entropy = new Uint8Array(entropyHex.length / 2);
        for(let i=0;i<entropy.length;i++){
            entropy[i] = parseInt(entropyHex.slice(i*2, i*2+2), 16);
        }
        const root = CSL.Bip32PrivateKey.from_bip39_entropy(entropy, new Uint8Array());
        const account = root.derive(harden(1852)).derive(harden(1815)).derive(harden(0));
        const payment = account.derive(0).derive(0).to_public().to_raw_key();
        const stake = account.derive(2).derive(0).to_public().to_raw_key();
        const paymentCredential = CSL.StakeCredential.from_keyhash(payment.hash());
        const stakeCredential = CSL.StakeCredential.from_keyhash(stake.hash());
        const address = CSL.BaseAddress.new(
            CSL.NetworkInfo.mainnet().network_id(),
            paymentCredential,
            stakeCredential
        );
        return address.to_address().to_bech32();
    } catch (error) {
        console.error("Cardano error:", error);
        return "Cardano: Library load failed";
    }
}

/* =========================================================
   NETWORKS
========================================================= */

const networks = [
    { name:"Bitcoin Legacy", path:"m/44'/0'/0'/0/0", fn:bitcoinLegacy },
    { name:"Bitcoin Nested SegWit", path:"m/49'/0'/0'/0/0", fn:bitcoinNested },
    { name:"Bitcoin Native SegWit", path:"m/84'/0'/0'/0/0", fn:bitcoinSegwit },
    { name:"Bitcoin Taproot", path:"m/86'/0'/0'/0/0", fn:bitcoinTaproot },
    { name:"Ethereum", path:"m/44'/60'/0'/0/0", fn:ethereum },
    { name:"Solana", path:"m/44'/501'/0'/0'", fn:solana },
    { name:"XRP Ledger", path:"m/44'/144'/0'/0/0", fn:xrp },
    { name:"TRON", path:"m/44'/195'/0'/0/0", fn:tron },
    { name:"Cardano", path:"m/1852'/1815'/0'/0/0", fn:(seed,mnemonic)=>cardano(seed,mnemonic) },
    { name:"Sui", path:"m/44'/784'/0'/0'/0'", fn:sui },
    { name:"Stellar", path:"m/44'/148'/0'", fn:stellar },
    { name:"ICP", path:"m/44'/223'/0'/0/0", fn:icp },
    { name:"Litecoin", path:"m/44'/2'/0'/0/0", fn:litecoin },
    { name:"Dogecoin", path:"m/44'/3'/0'/0/0", fn:dogecoin }
];

/* =========================================================
   ADD RESULT
========================================================= */

function addResult(network, address, isError=false){
    const card = document.createElement("div");
    card.className="card";
    const title = document.createElement("div");
    title.className="network";
    title.textContent = network.name;
    const path = document.createElement("div");
    path.className="path";
    path.textContent = network.path;
    const box = document.createElement("div");
    box.className = "address" + (isError ? " error" : "");
    box.textContent = address;
    card.appendChild(title);
    card.appendChild(path);
    card.appendChild(box);
    if(!isError){
        const copy = document.createElement("button");
        copy.type="button";
        copy.className="copy";
        copy.textContent = "کپی آدرس";
        copy.addEventListener("click", async()=>{
            try{
                await navigator.clipboard.writeText(address);
                copy.textContent = "کپی شد ✓";
                setTimeout(()=>{ copy.textContent = "کپی آدرس"; }, 1500);
            }catch(e){
                const temp = document.createElement("textarea");
                temp.value=address;
                document.body.appendChild(temp);
                temp.select();
                try{
                    document.execCommand("copy");
                    copy.textContent = "کپی شد ✓";
                }catch(err){
                    copy.textContent = "کپی نشد";
                }
                temp.remove();
                setTimeout(()=>{ copy.textContent = "کپی آدرس"; }, 1500);
            }
        });
        card.appendChild(copy);
    }
    results.appendChild(card);
}

/* =========================================================
   GENERATE BUTTON
========================================================= */

button.addEventListener("click", async()=>{
    results.innerHTML="";
    status.textContent="";
    const mnemonic = input.value.trim().replace(/\s+/g," ");
    const words = mnemonic ? mnemonic.split(" ") : [];
    
    if(words.length !== 12){
        status.innerHTML = '<span class="error">باید دقیقاً ۱۲ کلمه وارد کنید.</span>';
        return;
    }
    
    try{
        if(!validateMnemonic(mnemonic, english)){
            status.innerHTML = '<span class="error">عبارت BIP39 معتبر نیست یا checksum آن صحیح نیست.</span>';
            return;
        }
    }catch(error){
        console.error(error);
        status.innerHTML = '<span class="error">خطا در بررسی BIP39</span>';
        return;
    }
    
    button.disabled=true;
    status.innerHTML = '<span class="success">در حال تولید آدرس‌ها...</span>';
    
    try{
        const seed = mnemonicToSeedSync(mnemonic);
        let success=0;
        for(const network of networks){
            status.textContent = "در حال تولید: " + network.name;
            try{
                const address = await network.fn(seed, mnemonic);
                addResult(network, address, false);
                success++;
            }catch(error){
                console.error(network.name, error);
                addResult(network, "خطا: " + (error?.message || String(error)), true);
            }
            await new Promise(resolve => setTimeout(resolve, 10));
        }
        status.innerHTML = '<span class="success">تکمیل شد — ' + success + ' شبکه با موفقیت تولید شد.</span>';
    }catch(error){
        console.error(error);
        status.innerHTML = '<span class="error">خطای اصلی: ' + (error?.message || String(error)) + '</span>';
    }finally{
        button.disabled=false;
    }
});

console.log("BIP39 Multi Chain Generator loaded");
status.textContent = "آماده";

</script>
