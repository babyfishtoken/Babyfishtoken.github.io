<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Solana Wallet</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:30px 15px;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif
}

.box{
    max-width:600px;
    margin:auto;
    background:#1f2937;
    padding:25px;
    border-radius:18px
}

h1{
    text-align:center;
    color:#60a5fa
}

textarea{
    width:100%;
    height:120px;
    padding:15px;
    background:#111827;
    color:white;
    border:1px solid #374151;
    border-radius:12px;
    font-size:16px;
    direction:ltr;
    text-align:left;
    resize:none
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer
}

button:disabled{
    background:#475569
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#111827;
    border-radius:12px
}

.address{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    color:#34d399;
    font-family:monospace
}

.error{
    margin-top:15px;
    color:#f87171;
    text-align:center
}
</style>
</head>

<body>

<div class="box">

<h1>◎ Solana Wallet</h1>

<textarea
id="mnemonic"
placeholder="12 کلمه را با فاصله وارد کنید..."
autocomplete="off"
spellcheck="false"></textarea>

<button id="btn" onclick="generate()">
نمایش آدرس Solana
</button>

<div id="error" class="error"></div>

<div id="result" class="result">

<div style="color:#9ca3af;margin-bottom:10px">
آدرس Solana:
</div>

<div id="address" class="address"></div>

</div>

</div>

<script type="module">

import {
    validateMnemonic,
    mnemonicToSeedSync
}
from "https://esm.sh/@scure/bip39@2.2.0";

import {
    wordlist
}
from "https://esm.sh/@scure/bip39@2.2.0/wordlists/english.js";

import {
    derivePath
}
from "https://esm.sh/ed25519-hd-key@1.3.0";

import nacl
from "https://esm.sh/tweetnacl@1.0.3";


/* Base58 */

function base58(bytes){

    const alphabet =
    "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";

    let digits=[0];

    for(const byte of bytes){

        let carry=byte;

        for(let i=0;i<digits.length;i++){

            const value =
            digits[i]*256+carry;

            digits[i]=value%58;

            carry=Math.floor(value/58);
        }

        while(carry){

            digits.push(carry%58);

            carry=Math.floor(carry/58);
        }
    }

    let result="";

    for(
        let i=0;
        i<bytes.length && bytes[i]===0;
        i++
    ){
        result+="1";
    }

    for(
        let i=digits.length-1;
        i>=0;
        i--
    ){
        result+=alphabet[digits[i]];
    }

    return result;
}


/* ساخت آدرس */

window.generate = function(){

    const input =
    document.getElementById("mnemonic");

    const error =
    document.getElementById("error");

    const result =
    document.getElementById("result");

    const addressBox =
    document.getElementById("address");

    const btn =
    document.getElementById("btn");


    error.textContent="";
    result.style.display="none";


    const phrase =
    input.value
    .trim()
    .replace(/\s+/g," ");


    if(!phrase){

        error.textContent=
        "❌ عبارت بازیابی را وارد کنید.";

        return;
    }


    if(phrase.split(" ").length!==12){

        error.textContent=
        "❌ باید دقیقاً ۱۲ کلمه وارد کنید.";

        return;
    }


    try{

        btn.disabled=true;


        /* BIP39 */

        if(!validateMnemonic(
            phrase,
            wordlist
        )){

            throw new Error(
                "عبارت ۱۲ کلمه‌ای معتبر نیست."
            );
        }


        /* Seed */

        const seed =
        mnemonicToSeedSync(phrase);


        /*
         * Solana
         *
         * m/44'/501'/0'/0'
         */

        const derived =
        derivePath(
            "m/44'/501'/0'/0'",
            seed
        );


        /*
         * Ed25519
         */

        const keypair =
        nacl.sign.keyPair.fromSeed(
            derived.key
        );


        /*
         * Public Key
         */

        const address =
        base58(keypair.publicKey);


        addressBox.textContent =
        address;

        result.style.display =
        "block";


    }catch(e){

        console.error(e);

        error.textContent =
        "❌ "+e.message;

    }finally{

        btn.disabled=false;

    }

};

</script>

</body>
</html>
