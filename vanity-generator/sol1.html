<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mnemonic → Solana Address</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ed25519-hd-key@1.3.0/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:30px 15px;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:auto;
    background:#1f2937;
    padding:25px;
    border-radius:18px;
}

h1{
    text-align:center;
    color:#60a5fa;
}

textarea{
    width:100%;
    height:120px;
    padding:15px;
    border:1px solid #374151;
    border-radius:12px;
    background:#111827;
    color:white;
    font-size:16px;
    direction:ltr;
    text-align:left;
    resize:none;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#111827;
    border-radius:12px;
}

.label{
    color:#9ca3af;
    margin-bottom:10px;
}

.address{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    color:#34d399;
    font-family:monospace;
}

.error{
    margin-top:15px;
    color:#f87171;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>◎ Solana Wallet</h1>

<textarea
id="mnemonic"
placeholder="12 کلمه را با فاصله وارد کنید..."
autocomplete="off"
spellcheck="false"></textarea>

<button onclick="generateAddress()">
نمایش آدرس Solana
</button>

<div id="error" class="error"></div>

<div id="result" class="result">

<div class="label">
آدرس کیف پول Solana:
</div>

<div id="address" class="address"></div>

</div>

</div>

<script>

function generateAddress(){

const mnemonic =
document.getElementById("mnemonic")
.value
.trim()
.replace(/\s+/g," ");

const error =
document.getElementById("error");

const result =
document.getElementById("result");

const addressBox =
document.getElementById("address");

error.textContent="";
result.style.display="none";


/* بررسی تعداد کلمات */

if(mnemonic.split(" ").length !== 12){

error.textContent =
"❌ باید دقیقاً ۱۲ کلمه وارد کنید.";

return;

}


/* بررسی وجود کتابخانه‌ها */

if(typeof ethers === "undefined"){

error.textContent =
"❌ کتابخانه ethers بارگذاری نشده.";

return;

}

if(typeof ed25519HdKey === "undefined"){

error.textContent =
"❌ کتابخانه ed25519 بارگذاری نشده.";

return;

}

if(typeof solanaWeb3 === "undefined"){

error.textContent =
"❌ کتابخانه Solana بارگذاری نشده.";

return;

}


try{


/* بررسی معتبر بودن mnemonic */

if(!ethers.Mnemonic.isValidMnemonic(mnemonic)){

error.textContent =
"❌ عبارت ۱۲ کلمه‌ای معتبر نیست.";

return;

}


/*
ساخت seed از BIP39
*/

const mnemonicObj =
ethers.Mnemonic.fromPhrase(mnemonic);

const seed =
mnemonicObj.computeSeed();


/*
مسیر استاندارد Solana
*/

const path =
"m/44'/501'/0'/0'";


/*
تبدیل seed به کلید Ed25519
*/

const derived =
ed25519HdKey.derivePath(
path,
seed.slice(2)
);


/*
ساخت Public Key
*/

const keypair =
solanaWeb3.Keypair.fromSeed(
derived.key
);


/*
آدرس Solana
*/

const address =
keypair.publicKey.toBase58();


addressBox.textContent =
address;

result.style.display =
"block";


}catch(e){

console.error(e);

error.textContent =
"❌ خطا: " + e.message;

}

}

</script>

</body>
</html>
