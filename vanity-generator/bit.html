<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIP39 Bitcoin + Solana</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#111827;
    color:#ffffff;
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#d1d5db;
}

textarea{
    width:100%;
    height:130px;
    padding:15px;
    resize:none;

    background:#1f2937;
    color:#ffffff;

    border:1px solid #374151;
    border-radius:12px;

    font-family:Arial,sans-serif;
    font-size:16px;

    direction:ltr;
    text-align:left;

    outline:none;
}

textarea:focus{
    border-color:#3b82f6;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;

    border:0;
    border-radius:12px;

    background:#2563eb;
    color:white;

    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    background:#4b5563;
    cursor:not-allowed;
}

.status{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    line-height:1.8;
}

.status.error{
    display:block;
    background:#450a0a;
    color:#fca5a5;
}

.status.success{
    display:block;
    background:#052e16;
    color:#86efac;
}

.card{
    margin-top:20px;
    padding:18px;

    background:#1f2937;
    border-radius:12px;
}

.card-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.path{
    direction:ltr;
    text-align:left;

    color:#9ca3af;
    font-family:monospace;
    font-size:13px;

    margin-bottom:10px;
}

.address{
    min-height:50px;

    padding:14px;

    background:#111827;
    border-radius:9px;

    direction:ltr;
    text-align:left;

    word-break:break-all;

    font-family:monospace;
    font-size:14px;

    line-height:1.6;
}

.copy{
    background:#374151;
    font-size:14px;
}

.copy:hover{
    background:#4b5563;
}

</style>
</head>


<body>

<div class="container">

<h1>
BIP-39 → Bitcoin + Solana
</h1>


<label for="mnemonic">
عبارت ۱۲ کلمه‌ای BIP-39
</label>


<textarea
    id="mnemonic"
    placeholder="word1 word2 word3 ... word12"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
></textarea>


<button id="generateBtn">
ساخت هر دو آدرس
</button>


<div id="status" class="status"></div>


<!-- BITCOIN -->

<div class="card">

    <div class="card-title">
        Bitcoin
    </div>

    <div class="path">
        m/84'/0'/0'/0/0
    </div>

    <div
        id="btcAddress"
        class="address"
    >
        ---
    </div>

    <button
        class="copy"
        onclick="copyAddress('btcAddress')"
    >
        کپی آدرس Bitcoin
    </button>

</div>


<!-- SOLANA -->

<div class="card">

    <div class="card-title">
        Solana
    </div>

    <div class="path">
        m/44'/501'/0'/0'
    </div>

    <div
        id="solAddress"
        class="address"
    >
        ---
    </div>

    <button
        class="copy"
        onclick="copyAddress('solAddress')"
    >
        کپی آدرس Solana
    </button>

</div>

</div>



<script type="module">


/*
========================================================
IMPORTS
========================================================
*/


import * as bip39
from "https://esm.sh/@scure/bip39@2.4.0";


import { wordlist }
from "https://esm.sh/@scure/bip39@2.4.0/wordlists/english.js";


import { HDKey }
from "https://esm.sh/@scure/bip32@2.4.0";


import { sha256 }
from "https://esm.sh/@noble/hashes@2.0.1/sha2.js";


import { sha512 }
from "https://esm.sh/@noble/hashes@2.0.1/sha2.js";


import { hmac }
from "https://esm.sh/@noble/hashes@2.0.1/hmac.js";


import { ripemd160 }
from "https://esm.sh/@noble/hashes@2.0.1/legacy.js";


import * as ed25519
from "https://esm.sh/@noble/ed25519@3.0.0";


import { bech32 }
from "https://esm.sh/@scure/base@2.0.0";


import { base58 }
from "https://esm.sh/@scure/base@2.0.0";



/*
========================================================
HTML ELEMENTS
========================================================
*/


const mnemonicInput =
    document.getElementById("mnemonic");


const generateBtn =
    document.getElementById("generateBtn");


const status =
    document.getElementById("status");


const btcAddress =
    document.getElementById("btcAddress");


const solAddress =
    document.getElementById("solAddress");



/*
========================================================
STATUS
========================================================
*/


function showError(message){

    status.className =
        "status error";

    status.textContent =
        message;
}


function showSuccess(message){

    status.className =
        "status success";

    status.textContent =
        message;
}



/*
========================================================
UINT32 BIG ENDIAN
========================================================
*/


function uint32BE(number){

    return new Uint8Array([

        (number >>> 24) & 255,
        (number >>> 16) & 255,
        (number >>> 8) & 255,
        number & 255

    ]);

}



/*
========================================================
CONCATENATE ARRAYS
========================================================
*/


function concatBytes(...arrays){

    let length = 0;

    for(const arr of arrays){

        length += arr.length;

    }

    const result =
        new Uint8Array(length);

    let offset = 0;

    for(const arr of arrays){

        result.set(arr,offset);

        offset += arr.length;

    }

    return result;
}



/*
========================================================
SOLANA
SLIP-0010 ED25519
========================================================

Master:

HMAC-SHA512(
    key = "ed25519 seed",
    data = seed
)

Child:

HMAC-SHA512(
    key = chainCode,
    data = 0x00 || privateKey || index
)

Solana path:

m/44'/501'/0'/0'

All components are hardened.
========================================================
*/


function slip10Master(seed){

    const key =
        new TextEncoder().encode(
            "ed25519 seed"
        );

    const I =
        hmac(
            sha512,
            key,
            seed
        );

    return {

        key:I.slice(0,32),

        chainCode:I.slice(32,64)

    };

}



function slip10Child(parent,index){

    /*
    Hardened index
    */

    const HARDENED =
        (index + 0x80000000) >>> 0;


    const indexBytes =
        uint32BE(HARDENED);


    const data =
        concatBytes(

            new Uint8Array([0]),

            parent.key,

            indexBytes

        );


    const I =
        hmac(
            sha512,
            parent.chainCode,
            data
        );


    return {

        key:I.slice(0,32),

        chainCode:I.slice(32,64)

    };

}



function deriveSolanaKey(seed){

    let node =
        slip10Master(seed);


    /*
    m/44'
    */

    node =
        slip10Child(node,44);


    /*
    m/44'/501'
    */

    node =
        slip10Child(node,501);


    /*
    m/44'/501'/0'
    */

    node =
        slip10Child(node,0);


    /*
    m/44'/501'/0'/0'
    */

    node =
        slip10Child(node,0);


    return node.key;

}



/*
========================================================
SOLANA ADDRESS
========================================================
*/


async function makeSolanaAddress(seed){

    const privateKey =
        deriveSolanaKey(seed);


    /*
    Ed25519 public key
    */

    const publicKey =
        await ed25519.getPublicKeyAsync(
            privateKey
        );


    /*
    Solana uses Base58
    */

    return base58.encode(
        publicKey
    );

}



/*
========================================================
BITCOIN
========================================================

BIP84:

m/84'/0'/0'/0/0

P2WPKH:

bc1...
========================================================
*/


function makeBitcoinAddress(seed){

    /*
    Master BIP32 key
    */

    const root =
        HDKey.fromMasterSeed(seed);


    /*
    BIP84 path
    */

    const child =
        root.derive(
            "m/84'/0'/0'/0/0"
        );


    if(!child.publicKey){

        throw new Error(
            "Bitcoin public key ساخته نشد."
        );

    }


    const publicKey =
        child.publicKey;


    /*
    HASH160
    =
    RIPEMD160(
        SHA256(
            compressedPublicKey
        )
    )
    */

    const hash =
        ripemd160(
            sha256(publicKey)
        );


    /*
    SegWit version 0
    */

    const words =
        bech32.toWords(hash);


    words.unshift(0);


    /*
    Bitcoin mainnet prefix = bc
    */

    const address =
        bech32.encode(
            "bc",
            words,
            90
        );


    return address;

}



/*
========================================================
GENERATE
========================================================
*/


async function generate(){

    generateBtn.disabled =
        true;


    btcAddress.textContent =
        "---";


    solAddress.textContent =
        "---";


    status.className =
        "status";


    status.textContent =
        "";


    try{

        /*
        -----------------------------------------------
        READ MNEMONIC
        -----------------------------------------------
        */

        let mnemonic =
            mnemonicInput.value
            .trim()
            .replace(/\s+/g," ");


        if(!mnemonic){

            throw new Error(
                "عبارت ۱۲ کلمه‌ای را وارد کنید."
            );

        }


        /*
        -----------------------------------------------
        CHECK 12 WORDS
        -----------------------------------------------
        */

        const words =
            mnemonic.split(" ");


        if(words.length !== 12){

            throw new Error(
                "عبارت باید دقیقاً ۱۲ کلمه داشته باشد."
            );

        }


        /*
        -----------------------------------------------
        BIP39 VALIDATION
        -----------------------------------------------
        */

        const valid =
            bip39.validateMnemonic(
                mnemonic,
                wordlist
            );


        if(!valid){

            throw new Error(
                "عبارت BIP-39 معتبر نیست یا Checksum آن صحیح نیست."
            );

        }


        /*
        -----------------------------------------------
        BIP39 → SEED
        -----------------------------------------------
        */

        const seed =
            await bip39.mnemonicToSeed(
                mnemonic
            );


        /*
        -----------------------------------------------
        BITCOIN
        -----------------------------------------------
        */

        const bitcoin =
            makeBitcoinAddress(
                seed
            );


        btcAddress.textContent =
            bitcoin;


        /*
        -----------------------------------------------
        SOLANA
        -----------------------------------------------
        */

        const solana =
            await makeSolanaAddress(
                seed
            );


        solAddress.textContent =
            solana;


        /*
        -----------------------------------------------
        SUCCESS
        -----------------------------------------------
        */

        showSuccess(
            "هر دو آدرس با موفقیت ساخته شدند."
        );

    }
    catch(error){

        console.error(error);

        showError(
            "خطا: " +
            (error.message || error)
        );

    }
    finally{

        generateBtn.disabled =
            false;

    }

}



/*
========================================================
BUTTON
========================================================
*/


generateBtn.addEventListener(
    "click",
    generate
);



/*
========================================================
COPY
========================================================
*/


window.copyAddress =
async function(id){

    const element =
        document.getElementById(id);


    const value =
        element.textContent.trim();


    if(
        !value ||
        value === "---"
    ){

        return;

    }


    try{

        await navigator.clipboard.writeText(
            value
        );

        alert(
            "آدرس کپی شد."
        );

    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            value;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        alert(
            "آدرس کپی شد."
        );

    }

};


</script>

</body>
    </html>
