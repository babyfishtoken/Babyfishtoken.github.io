<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BIP39 Bitcoin + Solana</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;

    background:#111827;
    color:#fff;

    font-family:
        Arial,
        Tahoma,
        sans-serif;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#d1d5db;
}

textarea{

    width:100%;
    height:130px;

    padding:15px;

    resize:none;

    background:#1f2937;
    color:#fff;

    border:1px solid #374151;
    border-radius:12px;

    font-size:16px;
    line-height:1.7;

    direction:ltr;
    text-align:left;

    outline:none;
}

textarea:focus{
    border-color:#3b82f6;
}

button{

    width:100%;

    margin-top:15px;

    padding:15px;

    border:0;
    border-radius:12px;

    background:#2563eb;
    color:white;

    font-size:17px;

    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    background:#4b5563;
    cursor:not-allowed;
}

.status{

    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:10px;

    line-height:1.8;
}

.status.error{

    display:block;

    background:#450a0a;

    color:#fca5a5;
}

.status.success{

    display:block;

    background:#052e16;

    color:#86efac;
}

.card{

    margin-top:20px;

    padding:18px;

    background:#1f2937;

    border-radius:12px;
}

.card-title{

    font-size:18px;

    font-weight:bold;

    margin-bottom:8px;
}

.path{

    direction:ltr;

    text-align:left;

    color:#9ca3af;

    font-family:monospace;

    font-size:13px;

    margin-bottom:10px;
}

.address{

    min-height:50px;

    padding:14px;

    background:#111827;

    border-radius:9px;

    direction:ltr;

    text-align:left;

    word-break:break-all;

    font-family:monospace;

    font-size:14px;

    line-height:1.6;
}

.copy{

    background:#374151;

    font-size:14px;
}

.copy:hover{

    background:#4b5563;
}

</style>

</head>


<body>


<div class="container">


<h1>
BIP-39 → Bitcoin + Solana
</h1>


<label for="mnemonic">

عبارت ۱۲ کلمه‌ای BIP-39

</label>


<textarea
    id="mnemonic"
    placeholder="word1 word2 word3 ... word12"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
></textarea>


<button id="generateBtn">

ساخت هر دو آدرس

</button>


<div
    id="status"
    class="status">
</div>


<!-- =========================
     BITCOIN
========================= -->

<div class="card">

    <div class="card-title">

        Bitcoin

    </div>


    <div class="path">

        m/84'/0'/0'/0/0

    </div>


    <div
        id="btcAddress"
        class="address">

        ---

    </div>


    <button
        class="copy"
        onclick="copyAddress('btcAddress')">

        کپی آدرس Bitcoin

    </button>

</div>



<!-- =========================
     SOLANA
========================= -->

<div class="card">

    <div class="card-title">

        Solana

    </div>


    <div class="path">

        m/44'/501'/0'/0'

    </div>


    <div
        id="solAddress"
        class="address">

        ---

    </div>


    <button
        class="copy"
        onclick="copyAddress('solAddress')">

        کپی آدرس Solana

    </button>

</div>


</div>



<script type="module">


/*
========================================================
BIP39
========================================================
*/

import * as bip39
from "https://esm.sh/@scure/bip39@2.4.0";

import {
    wordlist
}
from "https://esm.sh/@scure/bip39@2.4.0/wordlists/english.js";



/*
========================================================
BITCOINJS
========================================================
*/

import * as bitcoin
from "https://esm.sh/bitcoinjs-lib@6.1.7";

import * as ecc
from "https://esm.sh/tiny-secp256k1@2.2.3";

import {
    BIP32Factory
}
from "https://esm.sh/bip32@4.0.0";



/*
========================================================
SOLANA / ED25519
========================================================
*/

import {
    sha512
}
from "https://esm.sh/@noble/hashes@1.8.0/sha2.js";

import {
    hmac
}
from "https://esm.sh/@noble/hashes@1.8.0/hmac.js";

import * as ed25519
from "https://esm.sh/@noble/ed25519@3.0.0";

import {
    base58
}
from "https://esm.sh/@scure/base@2.0.0";



/*
========================================================
BIP32
========================================================
*/

const bip32 =
    BIP32Factory(ecc);



/*
========================================================
HTML ELEMENTS
========================================================
*/

const mnemonicInput =
    document.getElementById("mnemonic");

const generateBtn =
    document.getElementById("generateBtn");

const status =
    document.getElementById("status");

const btcAddress =
    document.getElementById("btcAddress");

const solAddress =
    document.getElementById("solAddress");



/*
========================================================
STATUS
========================================================
*/

function showError(message){

    status.className =
        "status error";

    status.textContent =
        message;

}


function showSuccess(message){

    status.className =
        "status success";

    status.textContent =
        message;

}



/*
========================================================
SOLANA
SLIP-0010 ED25519
========================================================
*/


function concatBytes(...arrays){

    let length = 0;

    for(const a of arrays){

        length += a.length;

    }

    const result =
        new Uint8Array(length);

    let offset = 0;

    for(const a of arrays){

        result.set(a,offset);

        offset += a.length;

    }

    return result;

}



function uint32BE(number){

    return new Uint8Array([

        (number >>> 24) & 255,

        (number >>> 16) & 255,

        (number >>> 8) & 255,

        number & 255

    ]);

}



function slip10Master(seed){

    const key =
        new TextEncoder().encode(
            "ed25519 seed"
        );

    const I =
        hmac(
            sha512,
            key,
            seed
        );

    return {

        key:I.slice(0,32),

        chainCode:I.slice(32,64)

    };

}



function slip10Child(parent,index){

    /*
    Solana uses hardened derivation
    */

    const hardened =
        (index + 0x80000000) >>> 0;

    const indexBytes =
        uint32BE(hardened);

    const data =
        concatBytes(

            new Uint8Array([0]),

            parent.key,

            indexBytes

        );

    const I =
        hmac(
            sha512,
            parent.chainCode,
            data
        );

    return {

        key:I.slice(0,32),

        chainCode:I.slice(32,64)

    };

}



function deriveSolanaPrivateKey(seed){

    let node =
        slip10Master(seed);


    /*
    m/44'
    */

    node =
        slip10Child(
            node,
            44
        );


    /*
    m/44'/501'
    */

    node =
        slip10Child(
            node,
            501
        );


    /*
    m/44'/501'/0'
    */

    node =
        slip10Child(
            node,
            0
        );


    /*
    m/44'/501'/0'/0'
    */

    node =
        slip10Child(
            node,
            0
        );


    return node.key;

}



async function makeSolanaAddress(seed){

    const privateKey =
        deriveSolanaPrivateKey(seed);


    const publicKey =
        await ed25519.getPublicKeyAsync(
            privateKey
        );


    return base58.encode(
        publicKey
    );

}



/*
========================================================
BITCOIN
BIP84
========================================================

m/84'/0'/0'/0/0

Native SegWit P2WPKH
========================================================
*/


function makeBitcoinAddress(seed){

    /*
    Bitcoin mainnet
    */

    const network =
        bitcoin.networks.bitcoin;


    /*
    Create BIP32 root
    */

    const root =
        bip32.fromSeed(
            seed,
            network
        );


    /*
    BIP84 first receiving address
    */

    const child =
        root.derivePath(
            "m/84'/0'/0'/0/0"
        );


    if(!child.publicKey){

        throw new Error(
            "کلید عمومی Bitcoin ساخته نشد."
        );

    }


    /*
    P2WPKH

    HASH160(public key)
    */

    const payment =
        bitcoin.payments.p2wpkh({

            pubkey:
                child.publicKey,

            network:
                network

        });


    if(!payment.address){

        throw new Error(
            "آدرس Bitcoin ساخته نشد."
        );

    }


    return payment.address;

}



/*
========================================================
GENERATE
========================================================
*/

async function generate(){

    generateBtn.disabled =
        true;


    btcAddress.textContent =
        "---";


    solAddress.textContent =
        "---";


    status.className =
        "status";


    status.textContent =
        "";


    try{

        /*
        -----------------------------------------------
        READ MNEMONIC
        -----------------------------------------------
        */

        let mnemonic =
            mnemonicInput.value
            .trim()
            .replace(/\s+/g," ");


        if(!mnemonic){

            throw new Error(
                "عبارت ۱۲ کلمه‌ای را وارد کنید."
            );

        }


        /*
        -----------------------------------------------
        EXACTLY 12 WORDS
        -----------------------------------------------
        */

        const words =
            mnemonic.split(" ");


        if(words.length !== 12){

            throw new Error(
                "عبارت باید دقیقاً ۱۲ کلمه داشته باشد."
            );

        }


        /*
        -----------------------------------------------
        BIP39 CHECKSUM
        -----------------------------------------------
        */

        const valid =
            bip39.validateMnemonic(
                mnemonic,
                wordlist
            );


        if(!valid){

            throw new Error(
                "عبارت BIP-39 معتبر نیست یا Checksum آن صحیح نیست."
            );

        }


        /*
        -----------------------------------------------
        BIP39 → SEED
        -----------------------------------------------
        */

        const seed =
            await bip39.mnemonicToSeed(
                mnemonic
            );


        /*
        ===============================================
        BITCOIN
        ===============================================
        */

        const bitcoinAddress =
            makeBitcoinAddress(
                seed
            );


        btcAddress.textContent =
            bitcoinAddress;


        /*
        ===============================================
        SOLANA
        ===============================================
        */

        const solanaAddress =
            await makeSolanaAddress(
                seed
            );


        solAddress.textContent =
            solanaAddress;


        /*
        ===============================================
        SUCCESS
        ===============================================
        */

        showSuccess(
            "آدرس Bitcoin و Solana با موفقیت ساخته شدند."
        );

    }
    catch(error){

        console.error(error);

        showError(
            "خطا: " +
            (
                error.message ||
                error
            )
        );

    }
    finally{

        generateBtn.disabled =
            false;

    }

}



/*
========================================================
BUTTON
========================================================
*/

generateBtn.addEventListener(
    "click",
    generate
);



/*
========================================================
COPY
========================================================
*/

window.copyAddress =
async function(id){

    const element =
        document.getElementById(id);


    const value =
        element.textContent.trim();


    if(
        !value ||
        value === "---"
    ){

        return;

    }


    try{

        await navigator.clipboard.writeText(
            value
        );

        alert(
            "آدرس کپی شد."
        );

    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            value;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        alert(
            "آدرس کپی شد."
        );

    }

};


</script>

</body>

    </html>
