<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIP39 Bitcoin + Solana</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#111827;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

textarea{
    width:100%;
    height:120px;
    padding:15px;
    border:1px solid #374151;
    border-radius:12px;
    background:#1f2937;
    color:#fff;
    font-size:16px;
    direction:ltr;
    text-align:left;
    resize:none;
    outline:none;
}

textarea:focus{
    border-color:#3b82f6;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    background:#4b5563;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    display:none;
}

.status.error{
    display:block;
    background:#450a0a;
    color:#fca5a5;
}

.status.success{
    display:block;
    background:#052e16;
    color:#86efac;
}

.card{
    margin-top:20px;
    padding:18px;
    background:#1f2937;
    border-radius:12px;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.path{
    direction:ltr;
    text-align:left;
    color:#9ca3af;
    font-family:monospace;
    font-size:13px;
    margin-bottom:10px;
}

.address{
    min-height:50px;
    padding:14px;
    background:#111827;
    border-radius:9px;
    direction:ltr;
    text-align:left;
    word-break:break-all;
    font-family:monospace;
    font-size:14px;
    line-height:1.6;
}

.copy{
    background:#374151;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>BIP-39 → Bitcoin + Solana</h1>

<p>عبارت ۱۲ کلمه‌ای انگلیسی BIP-39 را وارد کنید:</p>

<textarea
    id="mnemonic"
    placeholder="word1 word2 word3 ... word12"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
></textarea>

<button id="generateBtn">
ساخت آدرس Bitcoin و Solana
</button>

<div id="status" class="status"></div>


<div class="card">

    <div class="title">Bitcoin</div>

    <div class="path">
        m/84'/0'/0'/0/0
    </div>

    <div id="btcAddress" class="address">---</div>

    <button
        class="copy"
        onclick="copyAddress('btcAddress')">
        کپی آدرس Bitcoin
    </button>

</div>


<div class="card">

    <div class="title">Solana</div>

    <div class="path">
        m/44'/501'/0'/0'
    </div>

    <div id="solAddress" class="address">---</div>

    <button
        class="copy"
        onclick="copyAddress('solAddress')">
        کپی آدرس Solana
    </button>

</div>

</div>


<script type="module">

/*
========================================================
IMPORTS
========================================================
*/

import * as bip39
from "https://esm.sh/@scure/bip39@2.4.0";

import { wordlist }
from "https://esm.sh/@scure/bip39@2.4.0/wordlists/english.js";

import { HDKey }
from "https://esm.sh/@scure/bip32@2.0.1";

import { sha256, sha512 }
from "https://esm.sh/@noble/hashes@2.4.0/sha2.js";

import { ripemd160 }
from "https://esm.sh/@noble/hashes@2.4.0/legacy.js";

import { hmac }
from "https://esm.sh/@noble/hashes@2.4.0/hmac.js";

import * as ed25519
from "https://esm.sh/@noble/ed25519@3.0.0";

import {
    bech32,
    base58
}
from "https://esm.sh/@scure/base@2.4.0";


/*
========================================================
ELEMENTS
========================================================
*/

const input =
    document.getElementById("mnemonic");

const button =
    document.getElementById("generateBtn");

const status =
    document.getElementById("status");

const btc =
    document.getElementById("btcAddress");

const sol =
    document.getElementById("solAddress");


/*
========================================================
STATUS
========================================================
*/

function error(message){

    status.className = "status error";
    status.textContent = message;

}

function success(message){

    status.className = "status success";
    status.textContent = message;

}


/*
========================================================
SOLANA SLIP-0010
========================================================
*/

function concat(...arrays){

    let length = 0;

    for(const a of arrays){
        length += a.length;
    }

    const out =
        new Uint8Array(length);

    let offset = 0;

    for(const a of arrays){

        out.set(a,offset);

        offset += a.length;
    }

    return out;
}


function uint32BE(n){

    return new Uint8Array([
        (n >>> 24) & 255,
        (n >>> 16) & 255,
        (n >>> 8) & 255,
        n & 255
    ]);
}


/*
Master key for SLIP-0010 Ed25519
*/

function slip10Master(seed){

    const key =
        new TextEncoder().encode(
            "ed25519 seed"
        );

    const I =
        hmac(
            sha512,
            key,
            seed
        );

    return {
        key:I.slice(0,32),
        chainCode:I.slice(32,64)
    };
}


/*
Hardened child
*/

function slip10Child(parent,index){

    const hardened =
        (index + 0x80000000) >>> 0;

    const data =
        concat(
            new Uint8Array([0]),
            parent.key,
            uint32BE(hardened)
        );

    const I =
        hmac(
            sha512,
            parent.chainCode,
            data
        );

    return {
        key:I.slice(0,32),
        chainCode:I.slice(32,64)
    };
}


/*
Solana:

m/44'/501'/0'/0'
*/

function deriveSolana(seed){

    let node =
        slip10Master(seed);

    node =
        slip10Child(node,44);

    node =
        slip10Child(node,501);

    node =
        slip10Child(node,0);

    node =
        slip10Child(node,0);

    return node.key;
}


async function makeSolanaAddress(seed){

    const privateKey =
        deriveSolana(seed);

    const publicKey =
        await ed25519.getPublicKeyAsync(
            privateKey
        );

    return base58.encode(publicKey);
}


/*
========================================================
BITCOIN BIP84
========================================================

m/84'/0'/0'/0/0

Native SegWit P2WPKH
========================================================
*/

function makeBitcoinAddress(seed){

    /*
    BIP32 master
    */

    const root =
        HDKey.fromMasterSeed(seed);


    /*
    BIP84
    */

    const child =
        root.derive(
            "m/84'/0'/0'/0/0"
        );


    if(!child.publicKey){

        throw new Error(
            "Bitcoin public key ساخته نشد."
        );
    }


    /*
    Compressed public key
    */

    const publicKey =
        child.publicKey;


    /*
    HASH160
    */

    const hash160 =
        ripemd160(
            sha256(publicKey)
        );


    /*
    Native SegWit v0

    witness version = 0
    witness program = HASH160
    */

    const words =
        bech32.toWords(hash160);

    words.unshift(0);


    /*
    Bitcoin mainnet prefix:
    bc
    */

    return bech32.encode(
        "bc",
        words,
        90
    );
}


/*
========================================================
GENERATE
========================================================
*/

async function generate(){

    button.disabled = true;

    btc.textContent = "---";
    sol.textContent = "---";

    status.className = "status";
    status.textContent = "";

    try{

        /*
        Normalize spaces
        */

        const mnemonic =
            input.value
            .trim()
            .replace(/\s+/g," ");


        if(!mnemonic){

            throw new Error(
                "عبارت را وارد کنید."
            );
        }


        /*
        Exactly 12 words
        */

        const words =
            mnemonic.split(" ");

        if(words.length !== 12){

            throw new Error(
                "عبارت باید دقیقاً ۱۲ کلمه باشد."
            );
        }


        /*
        BIP39 validation
        */

        if(
            !bip39.validateMnemonic(
                mnemonic,
                wordlist
            )
        ){

            throw new Error(
                "عبارت BIP-39 معتبر نیست یا Checksum صحیح نیست."
            );
        }


        /*
        BIP39 → 64-byte seed

        No passphrase
        */

        const seed =
            await bip39.mnemonicToSeed(
                mnemonic
            );


        /*
        Bitcoin
        */

        const bitcoinAddress =
            makeBitcoinAddress(seed);

        btc.textContent =
            bitcoinAddress;


        /*
        Solana
        */

        const solanaAddress =
            await makeSolanaAddress(seed);

        sol.textContent =
            solanaAddress;


        success(
            "هر دو آدرس با موفقیت ساخته شدند."
        );

    }
    catch(e){

        console.error(e);

        error(
            "خطا: " +
            (e?.message || String(e))
        );

    }
    finally{

        button.disabled = false;

    }
}


/*
========================================================
BUTTON
========================================================
*/

button.addEventListener(
    "click",
    generate
);


/*
========================================================
COPY
========================================================
*/

window.copyAddress =
async function(id){

    const element =
        document.getElementById(id);

    const value =
        element.textContent.trim();

    if(
        !value ||
        value === "---"
    ){
        return;
    }

    try{

        await navigator.clipboard.writeText(
            value
        );

        alert("آدرس کپی شد.");

    }
    catch(e){

        const area =
            document.createElement("textarea");

        area.value = value;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        alert("آدرس کپی شد.");
    }
};

</script>

</body>
</html>
