<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تبدیل BIP39 به آدرس بیت کوین</title>

<style>
body{
    margin:0;
    padding:20px;
    min-height:100vh;
    background:#1e3c72;
    font-family:Tahoma,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:100%;
    max-width:650px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    color:#1e3c72;
}

textarea{
    width:100%;
    height:100px;
    box-sizing:border-box;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    font-family:monospace;
    font-size:15px;
    direction:ltr;
    text-align:left;
    resize:vertical;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.99);
}

.error{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#fee2e2;
    color:#991b1b;
}

.error.show{
    display:block;
}

.result{
    display:none;
    margin-top:20px;
    background:#f1f5f9;
    padding:15px;
    border-radius:12px;
}

.result.show{
    display:block;
}

.address{
    margin-top:8px;
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    direction:ltr;
    text-align:left;
    word-break:break-all;
    font-family:monospace;
    color:#1d4ed8;
    user-select:all;
}

.copy{
    width:auto;
    padding:8px 15px;
    font-size:13px;
    background:#059669;
}

.status{
    text-align:center;
    font-size:13px;
    color:#555;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="box">

<h2>₿ تبدیل عبارت BIP-39 به آدرس بیت‌کوین</h2>

<div id="status" class="status">
در حال بارگذاری...
</div>

<textarea id="mnemonic" spellcheck="false">abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about</textarea>

<button id="convert">
تبدیل به آدرس بیت‌کوین
</button>

<div id="error" class="error"></div>

<div id="result" class="result">

    <b>آدرس Legacy بیت‌کوین:</b>

    <div id="address" class="address"></div>

    <button id="copy" class="copy">
        📋 کپی آدرس
    </button>

</div>

</div>


<script type="module">

/*
========================================================
کتابخانه‌ها
========================================================
*/

import * as bip39 from
"https://esm.sh/bip39@3.1.0";

import { secp256k1 } from
"https://esm.sh/@noble/curves@1.9.7/secp256k1";

import {
    sha256,
    ripemd160,
    hmac
} from
"https://esm.sh/@noble/hashes@1.8.0";


/*
========================================================
عناصر
========================================================
*/

const input =
document.getElementById("mnemonic");

const convert =
document.getElementById("convert");

const error =
document.getElementById("error");

const result =
document.getElementById("result");

const addressElement =
document.getElementById("address");

const copy =
document.getElementById("copy");

const status =
document.getElementById("status");


status.textContent =
"✅ آماده است";


/*
========================================================
اعداد بزرگ
========================================================
*/

const N =
BigInt(
"0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141"
);


/*
========================================================
بایت → عدد
========================================================
*/

function bytesToBigInt(bytes){

    let hex = "";

    for(const b of bytes){

        hex +=
        b.toString(16).padStart(2,"0");

    }

    return BigInt("0x" + hex);
}


/*
========================================================
عدد → 32 بایت
========================================================
*/

function bigIntTo32Bytes(num){

    let hex =
    num.toString(16).padStart(64,"0");

    const out =
    new Uint8Array(32);

    for(let i=0;i<32;i++){

        out[i] =
        parseInt(
            hex.substring(i*2,i*2+2),
            16
        );

    }

    return out;
}


/*
========================================================
HMAC-SHA512
========================================================
*/

function hmac512(key,data){

    return hmac(
        sha512,
        key,
        data
    );

}


/*
========================================================
SHA512
========================================================
*/

import {
    sha512
} from
"https://esm.sh/@noble/hashes@1.8.0";


/*
========================================================
BIP32 Master Key
========================================================
*/

function masterKey(seed){

    const I =
    hmac512(
        new TextEncoder().encode(
            "Bitcoin seed"
        ),
        seed
    );

    const IL =
    I.slice(0,32);

    const IR =
    I.slice(32,64);

    const privateKey =
    bytesToBigInt(IL);

    if(
        privateKey === 0n ||
        privateKey >= N
    ){

        throw new Error(
            "Master key نامعتبر است."
        );

    }

    return {
        key: privateKey,
        chainCode: IR
    };
}


/*
========================================================
BIP32 Child Key
========================================================
*/

function deriveChild(parent,index){

    const indexBytes =
    new Uint8Array(4);

    indexBytes[0] =
    (index >>> 24) & 255;

    indexBytes[1] =
    (index >>> 16) & 255;

    indexBytes[2] =
    (index >>> 8) & 255;

    indexBytes[3] =
    index & 255;


    /*
    Hardened
    */

    let data;

    if(index >= 0x80000000){

        const key =
        bigIntTo32Bytes(
            parent.key
        );

        data =
        new Uint8Array(
            1 + 32 + 4
        );

        data[0] = 0;

        data.set(
            key,
            1
        );

        data.set(
            indexBytes,
            33
        );

    }else{

        /*
        Public key compressed
        */

        const pub =
        secp256k1
            .getPublicKey(
                bigIntTo32Bytes(parent.key),
                true
            );

        data =
        new Uint8Array(
            33 + 4
        );

        data.set(
            pub,
            0
        );

        data.set(
            indexBytes,
            33
        );

    }


    const I =
    hmac512(
        parent.chainCode,
        data
    );

    const IL =
    I.slice(0,32);

    const IR =
    I.slice(32,64);


    const childInt =
    (
        bytesToBigInt(IL)
        +
        parent.key
    ) % N;


    if(
        bytesToBigInt(IL) >= N ||
        childInt === 0n
    ){

        throw new Error(
            "Child key نامعتبر است."
        );

    }


    return {
        key: childInt,
        chainCode: IR
    };
}


/*
========================================================
مشتق‌سازی مسیر
m/44'/0'/0'/0/0
========================================================
*/

function derivePath(root){

    /*
    44'
    */

    let node =
    deriveChild(
        root,
        44 + 0x80000000
    );


    /*
    0'
    */

    node =
    deriveChild(
        node,
        0 + 0x80000000
    );


    /*
    0'
    */

    node =
    deriveChild(
        node,
        0 + 0x80000000
    );


    /*
    0
    */

    node =
    deriveChild(
        node,
        0
    );


    /*
    0
    */

    node =
    deriveChild(
        node,
        0
    );


    return node;
}


/*
========================================================
Base58
========================================================
*/

const ALPHABET =
"123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";


function base58(bytes){

    let num = 0n;

    for(const b of bytes){

        num =
        num * 256n +
        BigInt(b);

    }

    let output = "";

    while(num > 0n){

        const remainder =
        Number(num % 58n);

        output =
        ALPHABET[remainder] +
        output;

        num =
        num / 58n;
    }


    /*
    صفرهای ابتدای بایت‌ها
    */

    for(const b of bytes){

        if(b === 0){

            output =
            "1" + output;

        }else{

            break;

        }

    }

    return output;
}


/*
========================================================
Hash160
RIPEMD160(SHA256(pubkey))
========================================================
*/

function hash160(data){

    return ripemd160(
        sha256(data)
    );

}


/*
========================================================
Base58Check
========================================================
*/

function base58Check(version,payload){

    const data =
    new Uint8Array(
        1 + payload.length
    );

    data[0] =
    version;

    data.set(
        payload,
        1
    );


    const hash =
    sha256(
        sha256(data)
    );


    const full =
    new Uint8Array(
        data.length + 4
    );

    full.set(
        data,
        0
    );

    full.set(
        hash.slice(0,4),
        data.length
    );


    return base58(full);
}


/*
========================================================
Private Key → Legacy Bitcoin Address
========================================================
*/

function privateKeyToAddress(privateKey){

    /*
    compressed public key
    */

    const publicKey =
    secp256k1.getPublicKey(
        bigIntTo32Bytes(privateKey),
        true
    );


    /*
    HASH160
    */

    const hashed =
    hash160(publicKey);


    /*
    Mainnet P2PKH version = 0x00
    */

    return base58Check(
        0x00,
        hashed
    );
}


/*
========================================================
دکمه تبدیل
========================================================
*/

convert.addEventListener(
"click",
function(){

    error.classList.remove("show");

    result.classList.remove("show");

    addressElement.textContent = "";


    /*
    عبارت
    */

    const mnemonic =
    input.value
        .trim()
        .replace(/\s+/g," ");


    /*
    تعداد کلمات
    */

    const words =
    mnemonic.split(" ");


    if(words.length !== 12){

        showError(
            "عبارت باید دقیقاً ۱۲ کلمه باشد."
        );

        return;
    }


    /*
    BIP39
    */

    let valid;

    try{

        valid =
        bip39.validateMnemonic(
            mnemonic
        );

    }catch(e){

        showError(
            e.message
        );

        return;
    }


    if(!valid){

        showError(
            "عبارت BIP-39 معتبر نیست یا checksum آن صحیح نیست."
        );

        return;
    }


    try{

        /*
        Seed
        */

        const seed =
        bip39.mnemonicToSeedSync(
            mnemonic
        );


        /*
        Master
        */

        const root =
        masterKey(seed);


        /*
        BIP44
        */

        const child =
        derivePath(root);


        /*
        آدرس
        */

        const address =
        privateKeyToAddress(
            child.key
        );


        addressElement.textContent =
        address;


        result.classList.add(
            "show"
        );


    }catch(e){

        console.error(e);

        showError(
            "خطا: " + e.message
        );

    }

});


/*
========================================================
خطا
========================================================
*/

function showError(message){

    error.textContent =
    "❌ " + message;

    error.classList.add(
        "show"
    );

}


/*
========================================================
کپی
========================================================
*/

copy.addEventListener(
"click",
async function(){

    const address =
    addressElement.textContent;

    if(!address) return;

    try{

        await navigator.clipboard.writeText(
            address
        );

    }catch{

        const t =
        document.createElement(
            "textarea"
        );

        t.value =
        address;

        document.body.appendChild(t);

        t.select();

        document.execCommand(
            "copy"
        );

        t.remove();

    }

    copy.textContent =
    "✅ کپی شد";

    setTimeout(
        ()=>{
            copy.textContent =
            "📋 کپی آدرس";
        },
        1500
    );

});

</script>

</body>
    </html>
