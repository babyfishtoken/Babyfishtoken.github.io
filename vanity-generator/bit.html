<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIP39 → Bitcoin & Solana</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#111827;
    color:#fff;
    font-family:Arial,sans-serif;
}
.container{
    max-width:700px;
    margin:auto;
}
h1{
    text-align:center;
}
textarea{
    width:100%;
    min-height:100px;
    box-sizing:border-box;
    padding:15px;
    border-radius:10px;
    border:1px solid #374151;
    background:#1f2937;
    color:white;
    font-size:16px;
    resize:vertical;
}
button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}
button:hover{
    background:#1d4ed8;
}
.card{
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#1f2937;
}
.label{
    color:#9ca3af;
    margin-bottom:8px;
}
.address{
    direction:ltr;
    text-align:left;
    word-break:break-all;
    background:#111827;
    padding:12px;
    border-radius:8px;
    font-family:monospace;
}
.error{
    color:#f87171;
    margin-top:15px;
}
.success{
    color:#4ade80;
}
</style>
</head>

<body>

<div class="container">

<h1>تبدیل BIP-39 به Bitcoin و Solana</h1>

<p>
عبارت ۱۲ کلمه‌ای خود را وارد کنید:
</p>

<textarea id="mnemonic"
placeholder="word1 word2 word3 ... word12"></textarea>

<button onclick="generate()">ساخت آدرس‌ها</button>

<div id="status"></div>

<div class="card">
    <div class="label">Bitcoin — BIP84</div>
    <div id="btc" class="address">---</div>
</div>

<div class="card">
    <div class="label">Solana — m/44'/501'/0'/0'</div>
    <div id="sol" class="address">---</div>
</div>

</div>

<!-- BIP39 -->
<script src="https://cdn.jsdelivr.net/npm/bip39@3.1.0/dist/index.browser.js"></script>

<!-- bitcoinjs -->
<script src="https://cdn.jsdelivr.net/npm/bitcoinjs-lib@6.1.7/dist/bitcoinjs-lib.min.js"></script>

<!-- tiny-secp256k1 -->
<script src="https://cdn.jsdelivr.net/npm/tiny-secp256k1@2.2.3/lib/index.js"></script>

<!-- bip32 -->
<script src="https://cdn.jsdelivr.net/npm/bip32@4.0.0/src/cjs/bip32.js"></script>

<!-- Solana -->
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.4/lib/index.iife.min.js"></script>

<!-- ed25519 -->
<script src="https://cdn.jsdelivr.net/npm/ed25519-hd-key@1.3.0/dist/index.js"></script>

<script>

async function generate(){

    const status = document.getElementById("status");

    const btc = document.getElementById("btc");
    const sol = document.getElementById("sol");

    btc.textContent = "---";
    sol.textContent = "---";
    status.innerHTML = "";

    try{

        let mnemonic =
            document.getElementById("mnemonic").value
            .trim()
            .replace(/\s+/g," ");

        const words = mnemonic.split(" ");

        if(words.length !== 12){
            throw new Error("عبارت باید دقیقاً ۱۲ کلمه داشته باشد.");
        }

        /*
         * -------------------------
         * BIP39 VALIDATION
         * -------------------------
         */

        if(!bip39.validateMnemonic(mnemonic)){
            throw new Error(
                "عبارت وارد شده BIP-39 معتبر نیست یا checksum آن صحیح نیست."
            );
        }

        /*
         * -------------------------
         * BITCOIN
         * -------------------------
         */

        const seed = await bip39.mnemonicToSeed(mnemonic);

        const network = bitcoinjsLib.networks.bitcoin;

        const ecc = tinysecp256k1;

        const bip32 = BIP32.BIP32Factory(ecc);

        const root = bip32.fromSeed(seed, network);

        /*
         * Bitcoin BIP84:
         *
         * m/84'/0'/0'/0/0
         */

        const child = root.derivePath(
            "m/84'/0'/0'/0/0"
        );

        const payment =
            bitcoinjsLib.payments.p2wpkh({
                pubkey: Buffer.from(child.publicKey),
                network: network
            });

        btc.textContent = payment.address;

        /*
         * -------------------------
         * SOLANA
         * -------------------------
         */

        /*
         * Solana common derivation:
         *
         * m/44'/501'/0'/0'
         */

        const derivationPath =
            "m/44'/501'/0'/0'";

        const derived =
            ed25519HdKey.derivePath(
                derivationPath,
                Buffer.from(seed).toString("hex")
            );

        const keypair =
            solanaWeb3.Keypair.fromSeed(
                Uint8Array.from(derived.key)
            );

        const solanaAddress =
            keypair.publicKey.toBase58();

        sol.textContent = solanaAddress;

        status.innerHTML =
            '<p class="success">هر دو آدرس با موفقیت ساخته شدند.</p>';

    }
    catch(error){

        console.error(error);

        status.innerHTML =
            '<p class="error">' +
            error.message +
            '</p>';

    }

}

</script>

</body>
</html>
