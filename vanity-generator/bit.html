<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبدیل عبارت ۱۲ کلمه‌ای به آدرس بیت‌کوین</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1e3c72;
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 25px;
            color: #856404;
            font-size: 14px;
            line-height: 1.6;
        }
        .warning strong { color: #d63031; }
        label {
            display: block;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 8px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
            direction: ltr;
            text-align: left;
        }
        textarea:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(42,82,152,0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }
        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-label {
            font-size: 13px;
            color: #636e72;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .result-address {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #1e3c72;
            word-break: break-all;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #dfe6e9;
            user-select: all;
        }
        .copy-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
            width: auto;
        }
        .copy-btn:hover { background: #00a381; }
        .error-message {
            color: #d63031;
            background: #ffeaa7;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
        .error-message.show { display: block; }
        .example {
            margin-top: 10px;
            font-size: 13px;
            color: #636e72;
        }
        .example span {
            color: #2a5298;
            cursor: pointer;
            text-decoration: underline;
        }
        .example span:hover { color: #1e3c72; }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            margin-top: 10px;
            padding: 8px 12px;
            background: #dfe6e9;
            border-radius: 8px;
            font-size: 13px;
            color: #2d3436;
            display: none;
        }
        .status.show { display: block; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔐 تبدیل به آدرس بیت‌کوین</h1>
        <p class="subtitle">عبارت ۱۲ کلمه‌ای (BIP-39) را وارد کنید</p>

        <div class="warning">
            ⚠️ <strong>هشدار امنیتی:</strong> این ابزار <strong>آفلاین</strong> است و عبارت شما به هیچ سروری ارسال نمی‌شود.
        </div>

        <div id="statusMessage" class="status">⏳ در حال بارگذاری کتابخانه‌ها...</div>

        <label for="mnemonic">عبارت ۱۲ کلمه‌ای:</label>
        <textarea id="mnemonic" placeholder="مثال: abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about">abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about</textarea>
        
        <div class="example">
            💡 مثال: <span onclick="setExample()">کلیک برای پر کردن</span>
        </div>

        <button id="convertBtn" onclick="convertMnemonic()">
            تبدیل به آدرس بیت‌کوین
        </button>

        <div id="errorMessage" class="error-message"></div>

        <div id="resultSection" class="result-section">
            <div class="result-label">✅ آدرس بیت‌کوین (Bech32):</div>
            <div id="resultAddress" class="result-address"></div>
            <button class="copy-btn" onclick="copyAddress()">📋 کپی آدرس</button>
        </div>

        <div style="margin-top: 20px; font-size: 12px; color: #b2bec3; text-align: center;">
            مبتنی بر استاندارد BIP-44 • مسیر: m/44'/0'/0'/0/0
        </div>
    </div>

    <!-- ===== بارگذاری کتابخانه‌ها با روش مطمئن ===== -->
    <script src="https://unpkg.com/bip39@3.1.0/dist/bip39.min.js"></script>
    <script src="https://unpkg.com/bitcoinjs-lib@6.1.3/dist/bitcoinjs-lib.min.js"></script>

    <script>
        // ============================================
        //  بررسی بارگذاری کتابخانه‌ها
        // ============================================
        let librariesLoaded = false;

        function checkLibraries() {
            const status = document.getElementById('statusMessage');
            
            if (typeof bip39 !== 'undefined' && typeof bitcoinjs !== 'undefined') {
                status.textContent = '✅ کتابخانه‌ها با موفقیت بارگذاری شدند';
                status.className = 'status show success';
                librariesLoaded = true;
                document.getElementById('convertBtn').disabled = false;
                return true;
            } else {
                status.textContent = '❌ خطا در بارگذاری کتابخانه‌ها. لطفاً اتصال اینترنت را بررسی کنید.';
                status.className = 'status show error';
                document.getElementById('convertBtn').disabled = true;
                return false;
            }
        }

        // ============================================
        //  تابع اصلی تبدیل
        // ============================================
        function mnemonicToBitcoinAddress(mnemonic) {
            // بررسی بارگذاری کتابخانه‌ها
            if (typeof bip39 === 'undefined') {
                throw new Error('کتابخانه bip39 بارگذاری نشده است. لطفاً اتصال اینترنت را بررسی کنید.');
            }
            if (typeof bitcoinjs === 'undefined') {
                throw new Error('کتابخانه bitcoinjs-lib بارگذاری نشده است.');
            }

            // اعتبارسنجی عبارت
            if (!bip39.validateMnemonic(mnemonic)) {
                throw new Error('عبارت ۱۲ کلمه‌ای نامعتبر است. لطفاً کلمات را با فاصله جدا کنید.');
            }

            // تولید Seed
            const seed = bip39.mnemonicToSeedSync(mnemonic);

            // ایجاد کیف پول HD
            const network = bitcoinjs.networks.bitcoin;
            const root = bitcoinjs.bip32.fromSeed(seed, network);

            // مسیر مشتق‌سازی BIP-44
            const path = "m/44'/0'/0'/0/0";
            const child = root.derivePath(path);

            // تولید آدرس (P2WPKH - Bech32)
            const { address } = bitcoinjs.payments.p2wpkh({
                pubkey: child.publicKey,
                network: network
            });

            return address;
        }

        // ============================================
        //  مدیریت UI
        // ============================================
        function convertMnemonic() {
            // بررسی بارگذاری کتابخانه‌ها
            if (!checkLibraries()) {
                return;
            }

            const input = document.getElementById('mnemonic');
            const btn = document.getElementById('convertBtn');
            const errorDiv = document.getElementById('errorMessage');
            const resultSection = document.getElementById('resultSection');
            const resultAddress = document.getElementById('resultAddress');

            resultSection.classList.remove('show');
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';

            const mnemonic = input.value.trim();

            if (!mnemonic) {
                showError('لطفاً عبارت ۱۲ کلمه‌ای را وارد کنید.');
                return;
            }

            const wordCount = mnemonic.split(/\s+/).length;
            if (wordCount !== 12) {
                showError(`تعداد کلمات وارد شده ${wordCount} است، در حالی که باید دقیقاً ۱۲ کلمه باشد.`);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'در حال پردازش <span class="loader"></span>';

            setTimeout(() => {
                try {
                    const address = mnemonicToBitcoinAddress(mnemonic);
                    resultAddress.textContent = address;
                    resultSection.classList.add('show');
                    errorDiv.classList.remove('show');
                } catch (error) {
                    showError(error.message || 'خطا در تبدیل عبارت.');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'تبدیل به آدرس بیت‌کوین';
                }
            }, 100);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
            document.getElementById('resultSection').classList.remove('show');
        }

        function copyAddress() {
            const address = document.getElementById('resultAddress').textContent;
            if (!address) return;

            navigator.clipboard.writeText(address).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '✅ کپی شد!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(() => {
                // روش جایگزین برای مرورگرهای قدیمی
                const textarea = document.createElement('textarea');
                textarea.value = address;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('آدرس کپی شد!');
            });
        }

        function setExample() {
            document.getElementById('mnemonic').value = 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about';
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');
        }

        // ============================================
        //  بررسی بارگذاری هنگام شروع
        // ============================================
        window.addEventListener('load', function() {
            // کمی تاخیر برای بارگذاری کتابخانه‌ها
            setTimeout(checkLibraries, 500);
        });

        // بررسی مجدد بعد از ۳ ثانیه
        setTimeout(checkLibraries, 3000);
    </script>

</body>
</html>
