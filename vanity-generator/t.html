<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Wallet Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>
body{
background:#111827;
color:white;
font-family:Arial;
padding:20px
}
.box{
max-width:600px;
margin:auto;
background:#1f2937;
padding:20px;
border-radius:15px
}
textarea,button{
width:100%;
padding:15px;
margin-top:10px;
border-radius:10px
}
textarea{
height:100px;
background:#111827;
color:white
}
button{
background:#2563eb;
color:white;
border:0
}
.card{
background:#111827;
padding:15px;
border-radius:12px;
margin-top:10px
}
.green{
color:#34d399
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 Wallet Scanner</h2>

<textarea id="mnemonic"
placeholder="۱۲ کلمه را وارد کنید"></textarea>

<button onclick="scan()">
بررسی موجودی
</button>

<div id="out"></div>

</div>


<script>

const chains=[

{
name:"Ethereum",
symbol:"ETH",
rpc:"https://ethereum.publicnode.com"
},

{
name:"Polygon",
symbol:"POL",
rpc:"https://polygon-rpc.com"
},

{
name:"BNB Chain",
symbol:"BNB",
rpc:"https://bsc-dataseed.binance.org"
},

{
name:"Arbitrum",
symbol:"ETH",
rpc:"https://arb1.arbitrum.io/rpc"
},

{
name:"Optimism",
symbol:"ETH",
rpc:"https://mainnet.optimism.io"
},

{
name:"Base",
symbol:"ETH",
rpc:"https://mainnet.base.org"
}

];


async function scan(){

const out=document.getElementById("out");

out.innerHTML="";


let phrase=
document.getElementById("mnemonic")
.value
.trim()
.replace(/\s+/g," ");


try{


if(!ethers.Mnemonic.isValidMnemonic(phrase)){
throw Error("عبارت معتبر نیست");
}


let wallet=
ethers.HDNodeWallet.fromPhrase(phrase);


out.innerHTML=
`
<div class="card">
آدرس:<br>
<span class="green">
${wallet.address}
</span>
</div>
`;


for(let c of chains){


try{


let provider=
new ethers.JsonRpcProvider(c.rpc);


let balance=
await provider.getBalance(wallet.address);


let amount=
ethers.formatEther(balance);



out.innerHTML+=`

<div class="card">

<b>${c.name}</b><br><br>

${c.symbol} :

<span class="green">
${amount}
</span>

</div>

`;



}catch(e){

out.innerHTML+=`

<div class="card">

${c.name} :
خطا

</div>

`;

}


}


}catch(e){

out.innerHTML=
`
<div class="card">
❌ ${e.message}
</div>
`;

}

}

</script>

</body>
</html>
