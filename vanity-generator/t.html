<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Wallet Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#111827;
color:#fff;
font-family:Arial
}

.container{
max-width:650px;
margin:auto
}

.card{
background:#1f2937;
padding:20px;
border-radius:18px;
margin-bottom:15px
}

h1{
text-align:center;
color:#60a5fa
}

textarea{
width:100%;
height:110px;
background:#111827;
color:white;
border:1px solid #374151;
border-radius:12px;
padding:14px;
font-size:16px;
direction:ltr
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px
}

.address{
margin-top:15px;
padding:15px;
background:#111827;
border-radius:12px;
direction:ltr;
word-break:break-all;
color:#34d399;
display:none
}

.network{
background:#111827;
padding:16px;
border-radius:14px;
margin-top:12px
}

.network h3{
color:#60a5fa;
margin:0 0 12px
}

.balance{
display:flex;
justify-content:space-between;
direction:ltr;
font-size:18px
}

.value{
color:#34d399;
font-weight:bold
}

.token{
display:flex;
justify-content:space-between;
direction:ltr;
background:#1e293b;
padding:10px;
border-radius:8px;
margin-top:7px
}

.tokenValue{
color:#34d399
}

.loading{
text-align:center;
color:#facc15;
margin:15px;
display:none
}

.error{
color:#f87171;
text-align:center;
margin:10px
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🔐 Wallet Scanner</h1>

<textarea
id="mnemonic"
placeholder="12 کلمه را وارد کنید..."
spellcheck="false"></textarea>

<button onclick="scan()">
بررسی کیف پول
</button>

<div id="error" class="error"></div>

<div id="address" class="address"></div>

<div id="loading" class="loading">
⏳ در حال بررسی موجودی...
</div>

</div>

<div id="results" class="card" style="display:none">
<h2>💰 موجودی</h2>
<div id="networks"></div>
</div>

</div>


<script>

/* ==========================================
   API KEY خودت را اینجا قرار بده
========================================== */

const API_KEY="alch_EFH_WhuW2jJ-hI5YxUJ88";


/* ==========================================
   شبکه‌ها
========================================== */

const NETWORKS=[

{
name:"Ethereum",
symbol:"ETH",
rpc:"https://ethereum-rpc.publicnode.com",
alchemy:`https://eth-mainnet.g.alchemy.com/v2/${API_KEY}`
},

{
name:"Polygon",
symbol:"POL",
rpc:"https://polygon-bor-rpc.publicnode.com",
alchemy:`https://polygon-mainnet.g.alchemy.com/v2/${API_KEY}`
},

{
name:"BNB Chain",
symbol:"BNB",
rpc:"https://bsc-rpc.publicnode.com",
alchemy:null
},

{
name:"Arbitrum",
symbol:"ETH",
rpc:"https://arbitrum-one-rpc.publicnode.com",
alchemy:`https://arb-mainnet.g.alchemy.com/v2/${API_KEY}`
},

{
name:"Optimism",
symbol:"ETH",
rpc:"https://optimism-rpc.publicnode.com",
alchemy:`https://opt-mainnet.g.alchemy.com/v2/${API_KEY}`
},

{
name:"Base",
symbol:"ETH",
rpc:"https://base-rpc.publicnode.com",
alchemy:`https://base-mainnet.g.alchemy.com/v2/${API_KEY}`
}

];


/* ==========================================
   RPC عمومی
========================================== */

async function rpc(url,method,params){

const r=await fetch(url,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
jsonrpc:"2.0",
id:1,
method:method,
params:params
})
});

const j=await r.json();

if(j.error)
throw new Error(j.error.message);

return j.result;
}


/* ==========================================
   موجودی Native
========================================== */

async function nativeBalance(network,address){

const balance=await rpc(
network.rpc,
"eth_getBalance",
[address,"latest"]
);

return ethers.formatEther(balance);
}


/* ==========================================
   ERC20
========================================== */

async function getTokens(network,address){

if(!network.alchemy)
return [];

try{

const data=await rpc(
network.alchemy,
"alchemy_getTokenBalances",
[address,"erc20"]
);

return data.tokenBalances || [];

}catch(e){

console.log(
"Token API:",
network.name,
e.message
);

return [];
}

}


/* ==========================================
   اطلاعات توکن
========================================== */

async function tokenInfo(network,address){

try{

return await rpc(
network.alchemy,
"alchemy_getTokenMetadata",
[address]
);

}catch(e){

return {
name:"Unknown",
symbol:"TOKEN",
decimals:18
};

}

}


/* ==========================================
   فرمت عدد
========================================== */

function fmt(x){

let n=Number(x);

if(!Number.isFinite(n))
return x;

return n.toLocaleString(
"en-US",
{
maximumFractionDigits:8
}
);

}


/* ==========================================
   اسکن
========================================== */

async function scan(){

const input=
document.getElementById("mnemonic");

const error=
document.getElementById("error");

const addressBox=
document.getElementById("address");

const loading=
document.getElementById("loading");

const results=
document.getElementById("results");

const networksBox=
document.getElementById("networks");


error.textContent="";
addressBox.style.display="none";
results.style.display="none";
networksBox.innerHTML="";


let mnemonic=
input.value
.trim()
.replace(/\s+/g," ");


if(!mnemonic){

error.textContent=
"❌ عبارت بازیابی را وارد کنید";

return;

}


if(typeof ethers==="undefined"){

error.textContent=
"❌ ethers بارگذاری نشده";

return;

}


if(mnemonic.split(" ").length!==12){

error.textContent=
"❌ باید دقیقاً ۱۲ کلمه وارد کنید";

return;

}


try{

if(!ethers.Mnemonic.isValidMnemonic(mnemonic)){

error.textContent=
"❌ عبارت بازیابی معتبر نیست";

return;

}


/* ساخت آدرس */

const wallet=
ethers.HDNodeWallet.fromPhrase(mnemonic);

const address=
wallet.address;


addressBox.innerHTML=
"آدرس کیف پول:<br><br>"+
address;

addressBox.style.display="block";

loading.style.display="block";


/* ==========================================
   بررسی شبکه‌ها
========================================== */

for(const network of NETWORKS){

const box=
document.createElement("div");

box.className="network";

box.innerHTML=`
<h3>${network.name}</h3>

<div class="balance">

<span>${network.symbol}</span>

<span class="value">
در حال بررسی...
</span>

</div>
`;

networksBox.appendChild(box);

results.style.display="block";


try{

const balance=
await nativeBalance(
network,
address
);

box.querySelector(".value")
.textContent=fmt(balance);


/* توکن‌ها */

if(network.alchemy){

const tokens=
await getTokens(
network,
address
);


/* فقط موجودی بیشتر از صفر */

const active=
tokens.filter(
t=>
t.tokenBalance &&
t.tokenBalance!=="0x0"
);


for(const token of active){

try{

const info=
await tokenInfo(
network,
token.contractAddress
);

const decimals=
Number(info.decimals??18);

const amount=
ethers.formatUnits(
token.tokenBalance,
decimals
);

if(Number(amount)<=0)
continue;


const row=
document.createElement("div");

row.className="token";

row.innerHTML=`

<span>
${info.name||"Unknown"}
<br>
<small>
${info.symbol||"TOKEN"}
</small>
</span>

<span class="tokenValue">
${fmt(amount)}
</span>

`;

box.appendChild(row);

}catch(e){

console.log(e);

}

}

}

}catch(e){

box.querySelector(".value")
.textContent="⚠️ "+e.message;

}

}


loading.style.display="none";


}catch(e){

loading.style.display="none";

error.textContent=
"❌ "+e.message;

}

}

</script>

</body>
    </html>
