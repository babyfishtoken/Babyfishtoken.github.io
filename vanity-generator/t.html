<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Multi Chain Wallet Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:20px;
background:#111827;
color:white;
font-family:Arial
}

.container{
max-width:700px;
margin:auto
}

.card{
background:#1f2937;
padding:20px;
border-radius:18px;
margin-bottom:15px
}

h1{
text-align:center;
color:#60a5fa
}

textarea{
width:100%;
height:110px;
background:#111827;
color:white;
border:1px solid #374151;
border-radius:12px;
padding:14px;
font-size:16px;
direction:ltr;
resize:none
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px
}

button:disabled{
background:#475569
}

.address{
display:none;
margin-top:15px;
padding:15px;
background:#111827;
border-radius:12px;
direction:ltr;
word-break:break-all;
color:#34d399;
font-family:monospace
}

.loading{
display:none;
text-align:center;
color:#facc15;
margin:15px
}

.error{
color:#f87171;
text-align:center;
margin:12px
}

.network{
background:#111827;
padding:16px;
border-radius:14px;
margin-top:12px
}

.network h3{
margin:0 0 12px;
color:#60a5fa
}

.token{
display:flex;
justify-content:space-between;
align-items:center;
direction:ltr;
background:#1e293b;
padding:11px;
border-radius:9px;
margin-top:7px
}

.tokenName{
color:#e5e7eb
}

.tokenValue{
color:#34d399;
font-family:monospace;
text-align:right
}

.symbol{
color:#94a3b8;
font-size:12px
}

.total{
font-size:13px;
color:#94a3b8;
margin-top:10px
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🔐 Wallet Scanner</h1>

<textarea
id="mnemonic"
placeholder="12 کلمه را وارد کنید..."
autocomplete="off"
spellcheck="false"></textarea>

<button id="scanBtn" onclick="scan()">
بررسی آدرس و تمام موجودی‌ها
</button>

<div id="error" class="error"></div>

<div id="address" class="address"></div>

<div id="loading" class="loading">
⏳ در حال بررسی شبکه‌ها و توکن‌ها...
</div>

</div>


<div id="results" class="card" style="display:none">

<h2>💰 موجودی کیف پول</h2>

<div id="networks"></div>

</div>

</div>


<script>

/* =========================================
   API KEY
========================================= */

const API_KEY="alch_EFH_WhuW2jJ-hI5YxUJ88";


/* =========================================
   شبکه‌هایی که بررسی می‌کنیم
========================================= */

const NETWORKS=[

"eth-mainnet",
"polygon-mainnet",
"bnb-mainnet",
"arb-mainnet",
"opt-mainnet",
"base-mainnet",
"avax-mainnet",
"linea-mainnet",
"zksync-mainnet",
"blast-mainnet",
"gnosis-mainnet",
"mantle-mainnet",
"zeta-mainnet",
"sonic-mainnet"

];


/* نام نمایشی شبکه‌ها */

const NAMES={

"eth-mainnet":"Ethereum",

"polygon-mainnet":"Polygon",

"bnb-mainnet":"BNB Chain",

"arb-mainnet":"Arbitrum",

"opt-mainnet":"Optimism",

"base-mainnet":"Base",

"avax-mainnet":"Avalanche",

"linea-mainnet":"Linea",

"zksync-mainnet":"zkSync",

"blast-mainnet":"Blast",

"gnosis-mainnet":"Gnosis",

"mantle-mainnet":"Mantle",

"zeta-mainnet":"ZetaChain",

"sonic-mainnet":"Sonic"

};


/* =========================================
   درخواست Portfolio API
========================================= */

async function getPortfolio(address){

let all=[];

let pageKey=null;

do{

let body={

addresses:[{

address:address,

networks:NETWORKS

}],

withMetadata:true,

withPrices:false,

includeNativeTokens:true,

includeErc20Tokens:true

};

if(pageKey)
body.pageKey=pageKey;


const response=await fetch(

`https://api.g.alchemy.com/data/v1/${API_KEY}/assets/tokens/by-address`,

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(body)

});


const json=await response.json();


if(!response.ok){

throw new Error(
json.message ||
"خطا در ارتباط با Alchemy"
);

}


if(json.data && json.data.tokens){

all.push(
...json.data.tokens
);

}


pageKey=
json.data?.pageKey || null;


}while(pageKey);


return all;

}


/* =========================================
   فرمت مقدار
========================================= */

function formatAmount(value){

const n=Number(value);

if(!Number.isFinite(n))
return value;

if(n===0)
return "0";

if(n<0.000001)
return n.toExponential(5);

return n.toLocaleString(
"en-US",
{
maximumFractionDigits:8
}
);

}


/* =========================================
   اسکن
========================================= */

async function scan(){

const input=
document.getElementById("mnemonic");

const error=
document.getElementById("error");

const addressBox=
document.getElementById("address");

const loading=
document.getElementById("loading");

const results=
document.getElementById("results");

const networksBox=
document.getElementById("networks");

const button=
document.getElementById("scanBtn");


error.textContent="";

addressBox.style.display="none";

results.style.display="none";

networksBox.innerHTML="";


const mnemonic=
input.value
.trim()
.replace(/\s+/g," ");


if(!mnemonic){

error.textContent=
"❌ عبارت بازیابی را وارد کنید.";

return;

}


if(typeof ethers==="undefined"){

error.textContent=
"❌ کتابخانه ethers بارگذاری نشده.";

return;

}


if(mnemonic.split(" ").length!==12){

error.textContent=
"❌ عبارت باید دقیقاً ۱۲ کلمه باشد.";

return;

}


try{


/* بررسی Mnemonic */

if(!ethers.Mnemonic.isValidMnemonic(mnemonic)){

error.textContent=
"❌ عبارت بازیابی معتبر نیست.";

return;

}


/* ساخت آدرس */

const wallet=
ethers.HDNodeWallet.fromPhrase(
mnemonic
);

const address=
wallet.address;


addressBox.innerHTML=
"آدرس کیف پول:<br><br>"+
address;

addressBox.style.display="block";


loading.style.display="block";

button.disabled=true;


/* =========================================
   دریافت تمام موجودی‌ها
========================================= */

const tokens=
await getPortfolio(address);


/* =========================================
   فقط موجودی‌های بیشتر از صفر
========================================= */

const active=tokens.filter(t=>{

try{

if(!t.tokenBalance)
return false;

return BigInt(t.tokenBalance)!==0n;

}catch{

return false;

}

});


/* =========================================
   گروه‌بندی بر اساس شبکه
========================================= */

const groups={};


for(const token of active){

const network=
token.network || "unknown";


if(!groups[network])
groups[network]=[];


groups[network].push(token);

}


/* =========================================
   نمایش
========================================= */

if(Object.keys(groups).length===0){

networksBox.innerHTML=
"<p>موجودی پیدا نشد.</p>";

}else{


for(const network of NETWORKS){

if(!groups[network])
continue;


const box=
document.createElement("div");

box.className="network";


const title=
document.createElement("h3");

title.textContent=
NAMES[network] || network;

box.appendChild(title);


/* توکن‌ها */

for(const token of groups[network]){

const meta=
token.tokenMetadata || {};

const decimals=
Number(meta.decimals ?? 18);


let amount;


try{

amount=
ethers.formatUnits(
token.tokenBalance,
decimals
);

}catch{

continue;

}


if(Number(amount)===0)
continue;


const row=
document.createElement("div");

row.className="token";


const name=
meta.name ||
"Unknown Token";


const symbol=
meta.symbol ||
"";


row.innerHTML=`

<div class="tokenName">

${name}

<div class="symbol">
${symbol}
</div>

</div>

<div class="tokenValue">

${formatAmount(amount)}

<br>

<span class="symbol">
${symbol}
</span>

</div>

`;


box.appendChild(row);

}


networksBox.appendChild(box);

}

}


results.style.display="block";

loading.style.display="none";

button.disabled=false;


}catch(e){

console.error(e);

loading.style.display="none";

button.disabled=false;

error.textContent=
"❌ "+e.message;

}

}

</script>

</body>
   </html>
