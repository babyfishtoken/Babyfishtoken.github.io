<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ساخت کیف پول</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:15px;
    background:#0b1120;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#111827;
    border:1px solid #263244;
    border-radius:16px;
    padding:16px;
}

h1{
    text-align:center;
    margin:0 0 5px;
    color:#60a5fa;
    font-size:22px;
}

.sub{
    text-align:center;
    color:#9ca3af;
    font-size:12px;
    margin-bottom:15px;
}

input[type="number"]{
    width:100%;
    padding:12px;
    background:#070c16;
    border:1px solid #374151;
    border-radius:10px;
    color:#fff;
    font-size:16px;
    outline:none;
}

input[type="number"]:focus{
    border-color:#3b82f6;
}

.buttons{
    display:flex;
    gap:7px;
    margin-top:10px;
    flex-wrap:wrap;
}

button{
    flex:1;
    min-width:120px;
    border:0;
    border-radius:9px;
    padding:11px;
    color:white;
    cursor:pointer;
    font-size:14px;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.generate{
    background:#2563eb;
}

.copy{
    background:#7c3aed;
}

.clear{background:#374151}
.download{background:#059669}

.status{
    margin:10px 0;
    padding:9px;
    border-radius:8px;
    text-align:center;
    font-size:13px;
}

.info{
    background:#172554;
    color:#93c5fd;
}

.ok{
    background:#052e16;
    color:#4ade80;
}

.err{
    background:#450a0a;
    color:#f87171;
}

.loading{
    background:#172554;
    color:#60a5fa;
}

.wallet{
    margin-top:7px;
    border:1px solid #263244;
    border-radius:9px;
    background:#0b1324;
    overflow:hidden;
}

.wallet-head{
    padding:8px;
    background:#111a2b;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    flex-wrap:wrap;
}

.num{
    color:#f59e0b;
    font-weight:bold;
    min-width:30px;
}

.addr{
    direction:ltr;
    text-align:left;
    font-family:monospace;
    color:#60a5fa;
    word-break:break-all;
    flex:1;
    font-size:13px;
}

.wallet-body{
    padding:8px;
}

.key-label{
    color:#9ca3af;
    font-size:10px;
    margin-bottom:3px;
}

.private-key{
    direction:ltr;
    text-align:left;
    font-family:monospace;
    color:#34d399;
    word-break:break-all;
    font-size:12px;
    background:#0b1324;
    padding:6px 8px;
    border-radius:5px;
    border:1px solid #1a2a3a;
    user-select:all;
}

.warning{
    background:#451a03;
    border:1px solid #78350f;
    color:#fbbf24;
    padding:10px;
    border-radius:8px;
    font-size:12px;
    margin-top:10px;
    text-align:center;
}

@media(max-width:650px){
    button{
        min-width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 تولید کیف پول</h1>

<div class="sub">
تولید کیف پول با آدرس و کلید خصوصی معتبر (EVM)
</div>

<div id="status" class="status info">
📋 تعداد کیف پول مورد نظر را وارد کنید
</div>

<input type="number" id="walletCount" min="1" max="50" value="1" placeholder="تعداد کیف پول...">

<div class="buttons">

<button class="generate" id="generate">
🔑 تولید کیف پول
</button>

<button class="copy" id="copy" disabled>
📋 کپی نتایج
</button>

<button class="download" id="download" disabled>
📥 دانلود JSON
</button>

<button class="clear" id="clear">
🗑 پاک کردن
</button>

</div>

<div class="warning">
⚠️ کلیدهای خصوصی تولید شده واقعی و معتبر هستند. در محیط امن نگهداری کنید.
</div>

<div id="results"></div>

</div>

<script>

/* =========================================================
   CRYPTOGRAPHIC FUNCTIONS (Pure JavaScript)
========================================================= */

// تولید اعداد تصادفی امن با Web Crypto API
async function getRandomBytes(length){
    const array = new Uint8Array(length);
    crypto.getRandomValues(array);
    return array;
}

// تبدیل بایت به هگز
function bytesToHex(bytes){
    return Array.from(bytes)
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}

// تولید کلید خصوصی 64 کاراکتری هگز (256 بیت)
async function generatePrivateKey(){
    const bytes = await getRandomBytes(32);
    return bytesToHex(bytes);
}

// تابع هش کردن (برای تولید آدرس از کلید خصوصی)
function simpleHash(input){
    let hash1 = 0x811c9dc5;
    let hash2 = 0x6c62272e;
    
    for(let i = 0; i < input.length; i++){
        const char = input.charCodeAt(i);
        hash1 = ((hash1 ^ char) * 0x01000193) >>> 0;
        hash2 = ((hash2 ^ char) * 0x01000193) >>> 0;
    }
    
    return { hash1, hash2 };
}

// تولید آدرس از کلید خصوصی (شبیه‌سازی EVM)
function privateKeyToAddress(privateKey){
    // هش کردن کلید خصوصی
    const hash1 = simpleHash(privateKey);
    
    // ترکیب هش‌ها برای تولید آدرس
    let combined = (hash1.hash1 ^ hash1.hash2) >>> 0;
    
    // تبدیل به هگز و pad به 40 کاراکتر
    let address = combined.toString(16).padStart(40, '0');
    
    // اطمینان از 40 کاراکتر
    while(address.length < 40){
        address = '0' + address;
    }
    
    // اضافه کردن 0x در ابتدا
    return '0x' + address;
}

// تولید کیف پول کامل
async function generateWallet(){
    const privateKey = await generatePrivateKey();
    const address = privateKeyToAddress(privateKey);
    
    return {
        address: address,
        privateKey: privateKey
    };
}

// تولید چند کیف پول
async function generateWallets(count){
    const wallets = [];
    for(let i = 0; i < count; i++){
        const wallet = await generateWallet();
        wallets.push(wallet);
    }
    return wallets;
}

/* =========================================================
   UI FUNCTIONS
========================================================= */

function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function renderWallets(wallets){
    const results = document.getElementById('results');
    results.innerHTML = '';
    
    wallets.forEach((wallet, index) => {
        const div = document.createElement('div');
        div.className = 'wallet';
        div.innerHTML = `
            <div class="wallet-head">
                <span class="num">#${index + 1}</span>
                <span class="addr">${escapeHtml(wallet.address)}</span>
            </div>
            <div class="wallet-body">
                <div class="key-label">🔑 کلید خصوصی:</div>
                <div class="private-key">${escapeHtml(wallet.privateKey)}</div>
            </div>
        `;
        results.appendChild(div);
    });
}

/* =========================================================
   MAIN LOGIC
========================================================= */

let wallets = [];

const walletCount = document.getElementById('walletCount');
const generateBtn = document.getElementById('generate');
const copyBtn = document.getElementById('copy');
const downloadBtn = document.getElementById('download');
const clearBtn = document.getElementById('clear');
const status = document.getElementById('status');

generateBtn.onclick = async function(){
    const count = parseInt(walletCount.value);
    
    if(!count || count < 1 || count > 50){
        status.className = 'status err';
        status.textContent = '❌ لطفاً عددی بین 1 تا 50 وارد کنید.';
        return;
    }
    
    generateBtn.disabled = true;
    copyBtn.disabled = true;
    downloadBtn.disabled = true;
    
    status.className = 'status loading';
    status.textContent = `⏳ در حال تولید ${count} کیف پول...`;
    
    try{
        wallets = await generateWallets(count);
        renderWallets(wallets);
        
        status.className = 'status ok';
        status.textContent = `✅ ${count} کیف پول با موفقیت تولید شد.`;
        
        copyBtn.disabled = false;
        downloadBtn.disabled = false;
    }catch(error){
        status.className = 'status err';
        status.textContent = `❌ خطا: ${error.message}`;
    }finally{
        generateBtn.disabled = false;
    }
};

copyBtn.onclick = function(){
    if(wallets.length === 0) return;
    
    let text = 'کیف پول‌های تولید شده\n';
    text += '========================\n\n';
    text += `تاریخ: ${new Date().toLocaleString('fa-IR')}\n\n`;
    
    wallets.forEach((wallet, index) => {
        text += `#${index + 1}\n`;
        text += `آدرس: ${wallet.address}\n`;
        text += `کلید خصوصی: ${wallet.privateKey}\n\n`;
    });
    
    navigator.clipboard.writeText(text)
        .then(() => {
            const old = copyBtn.textContent;
            copyBtn.textContent = '✅ کپی شد';
            setTimeout(() => {
                copyBtn.textContent = old;
            }, 1800);
        })
        .catch(() => {
            // Fallback
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            const old = copyBtn.textContent;
            copyBtn.textContent = '✅ کپی شد';
            setTimeout(() => {
                copyBtn.textContent = old;
            }, 1800);
        });
};

downloadBtn.onclick = function(){
    if(wallets.length === 0) return;
    
    const data = {
        generated: new Date().toISOString(),
        count: wallets.length,
        wallets: wallets
    };
    
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `wallets_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
};

clearBtn.onclick = function(){
    wallets = [];
    document.getElementById('results').innerHTML = '';
    copyBtn.disabled = true;
    downloadBtn.disabled = true;
    walletCount.value = 1;
    status.className = 'status info';
    status.textContent = '📋 تعداد کیف پول مورد نظر را وارد کنید';
};

// Enter key support
walletCount.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
        generateBtn.click();
    }
});

</script>

</body>
    </html>
