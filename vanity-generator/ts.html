<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>پیدا کردن کلید از آدرس (شبیهسازی)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js">
    </script>
</head>
<body>
    <h2>جستجوی کلید خصوصی برای یک آدرس (غیرعملی)</h2>
    <p style="color: red;">⚠️ این فقط یک شبیهسازی است و هرگز به نتیجه نمیرسد!</p>
    
    <label>آدرس مورد نظر:</label><br>
    <input type="text" id="targetAddress" style="width: 100%; direction: ltr;" 
           placeholder="مثلاً: 0x742d35Cc6634C0532925a3b844Bc454e4438f44e">
    <br><br>
    
    <label>تعداد تلاش (برای شبیهسازی):</label><br>
    <input type="number" id="attempts" value="1000" style="width: 200px;">
    <br><br>
    
    <button onclick="searchPrivateKey()">شروع جستجو (شبیهسازی)</button>
    <br><br>
    
    <div id="result"></div>
    <div id="progress"></div>

    <script>
        let isSearching = false;
        
        function searchPrivateKey() {
            if (isSearching) return;
            
            const targetAddress = document.getElementById('targetAddress').value.trim();
            const maxAttempts = parseInt(document.getElementById('attempts').value) || 1000;
            const resultDiv = document.getElementById('result');
            const progressDiv = document.getElementById('progress');
            
            if (!targetAddress) {
                resultDiv.innerHTML = '❌ لطفاً یک آدرس وارد کنید.';
                return;
            }
            
            // اعتبارسنجی آدرس
            if (!targetAddress.match(/^0x[a-fA-F0-9]{40}$/)) {
                resultDiv.innerHTML = '❌ آدرس نامعتبر است. فرمت صحیح: 0x... (۴۰ کاراکتر هگز)';
                return;
            }
            
            isSearching = true;
            resultDiv.innerHTML = '🔍 در حال جستجو... (این عملاً غیرممکن است!)';
            progressDiv.innerHTML = '';
            
            let found = false;
            let attempts = 0;
            
            function tryRandomKey() {
                if (found || attempts >= maxAttempts) {
                    isSearching = false;
                    if (!found) {
                        resultDiv.innerHTML = `
                            ❌ پس از ${attempts} تلاش، کلیدی پیدا نشد.<br>
                            <span style="color: orange;">⚠️ برای پیدا کردن یک آدرس خاص، به طور میانگین به ۲^۱۶۰ ≈ ۱۰^۴۸ تلاش نیاز است!</span>
                        `;
                    }
                    return;
                }
                
                attempts++;
                
                // تولید کلید خصوصی تصادفی (۲۵۶ بیت)
                const randomBytes = new Uint8Array(32);
                crypto.getRandomValues(randomBytes);
                const privateBigInt = BigInt('0x' + Array.from(randomBytes).map(b => b.toString(16).padStart(2, '0')).join(''));
                
                // بررسی محدوده معتبر
                const n = BigInt('115792089237316195423570985008687907853269984665640564039457584007913129639935');
                if (privateBigInt >= n) {
                    // اگر خارج از محدوده بود، دوباره تلاش کن
                    setTimeout(tryRandomKey, 0);
                    return;
                }
                
                // تبدیل به هگز
                const hex = '0x' + privateBigInt.toString(16).padStart(64, '0');
                
                try {
                    const wallet = new ethers.Wallet(hex);
                    
                    // به‌روزرسانی وضعیت
                    if (attempts % 10 === 0) {
                        progressDiv.innerHTML = `تلاش: ${attempts} | آخرین آدرس: ${wallet.address.substring(0, 10)}...`;
                    }
                    
                    // بررسی تطابق آدرس
                    if (wallet.address.toLowerCase() === targetAddress.toLowerCase()) {
                        found = true;
                        isSearching = false;
                        resultDiv.innerHTML = `
                            🎉 <strong>پیدا شد!</strong><br><br>
                            <strong>آدرس:</strong> ${wallet.address}<br>
                            <strong>کلید خصوصی:</strong><br>
                            <code style="word-break: break-all; background: #e8f5e9; padding: 8px; display: block;">${hex}</code>
                            <br>
                            <span style="color: green;">پس از ${attempts} تلاش پیدا شد!</span>
                        `;
                        return;
                    }
                    
                    // ادامه جستجو
                    setTimeout(tryRandomKey, 0);
                    
                } catch (error) {
                    setTimeout(tryRandomKey, 0);
                }
            }
            
            // شروع جستجو
            tryRandomKey();
        }
    </script>
</body>
</html>
