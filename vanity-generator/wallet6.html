<script>

/* =====================================================
   تنظیمات Polygon
===================================================== */

const CHAIN_ID = 137;


/*
 * RPCهای عمومی Polygon
 *
 * برای خواندن اطلاعات از چند RPC استفاده می‌شود.
 */

const RPC_URLS = [

    "https://polygon-rpc.com",

    "https://polygon-bor-rpc.publicnode.com",

    "https://1rpc.io/poly"

];


/* =====================================================
   متغیرها
===================================================== */

let wallet = null;

let provider = null;

let wordList = [];

let isLoaded = false;


/* =====================================================
   ساخت Provider
===================================================== */

function createProvider(url){

    return new ethers.JsonRpcProvider(
        url,
        {
            name:"Polygon",
            chainId:137
        },
        {
            staticNetwork:true
        }
    );
}


/* =====================================================
   پیدا کردن RPC سالم
===================================================== */

async function getWorkingProvider(){

    for(
        const url of RPC_URLS
    ){

        try{

            const p =
                createProvider(url);

            const network =
                await p.getNetwork();

            if(
                Number(network.chainId) === CHAIN_ID
            ){

                return p;
            }

        }catch(e){

            console.log(
                "RPC failed:",
                url,
                e.message
            );

        }
    }

    throw new Error(
        "هیچ RPC سالمی برای Polygon در دسترس نیست."
    );
}


/* =====================================================
   بارگذاری key.txt
===================================================== */

async function loadWordList(){

    try{

        const response =
            await fetch("key.txt",{
                cache:"no-store"
            });

        if(!response.ok){

            throw new Error(
                "فایل key.txt پیدا نشد."
            );

        }

        const text =
            await response.text();

        wordList =
            text
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(x => x.length > 0);


        if(
            wordList.length === 0
        ){

            throw new Error(
                "فایل key.txt خالی است."
            );

        }


        isLoaded = true;

        document
        .getElementById("randomBtn")
        .disabled = false;


        console.log(
            "Words loaded:",
            wordList.length
        );


    }catch(e){

        console.error(e);

        document
        .getElementById("randomBtn")
        .disabled = true;

        alert(
            "❌ خطا در بارگذاری key.txt\n\n" +
            e.message
        );

    }

}


loadWordList();


/* =====================================================
   تولید تصادفی
===================================================== */

function generateRandomPhrase(){

    if(
        !isLoaded ||
        wordList.length === 0
    ){

        alert(
            "⏳ لیست کلمات هنوز آماده نیست."
        );

        return;
    }


    const selected = [];


    /*
     * استفاده از crypto برای انتخاب تصادفی
     */

    const randomArray =
        new Uint32Array(6);

    crypto
        .getRandomValues(randomArray);


    for(
        let i = 0;
        i < 6;
        i++
    ){

        const index =
            randomArray[i] %
            wordList.length;

        selected.push(
            wordList[index]
        );

    }


    document
    .getElementById("phraseInput")
    .value =
        selected.join(" ");

}


/* =====================================================
   ساخت Wallet
===================================================== */

function createWallet(){

    const phrase =
        document
        .getElementById("phraseInput")
        .value
        .trim();


    const words =
        phrase
        .split(/\s+/)
        .filter(Boolean);


    if(
        words.length !== 6
    ){

        alert(
            "❌ باید دقیقاً ۶ کلمه وارد کنید."
        );

        return;
    }


    try{

        /*
         * توجه:
         *
         * این BIP39 نیست.
         *
         * عبارت ۶ کلمه‌ای مستقیماً
         * با Keccak256 تبدیل به Private Key می‌شود.
         */

        const privateKey =
            ethers.keccak256(
                ethers.toUtf8Bytes(
                    phrase
                )
            );


        wallet =
            new ethers.Wallet(
                privateKey
            );


        provider =
            createProvider(
                RPC_URLS[0]
            );


        document
        .getElementById("phraseDisplay")
        .textContent =
            phrase;


        document
        .getElementById("addressDisplay")
        .textContent =
            wallet.address;


        document
        .getElementById("privateKeyDisplay")
        .textContent =
            wallet.privateKey;


        document
        .getElementById("result")
        .style.display =
            "block";


        document
        .getElementById("txStatus")
        .style.display =
            "none";


        document
        .getElementById("balanceDisplay")
        .style.display =
            "none";


        setTimeout(
            checkBalance,
            500
        );


    }catch(e){

        alert(
            "❌ خطا:\n" +
            e.message
        );

    }

}


/* =====================================================
   بررسی موجودی
===================================================== */

async function checkBalance(){

    if(!wallet){

        alert(
            "ابتدا کیف پول را بسازید."
        );

        return;
    }


    try{

        const p =
            await getWorkingProvider();


        provider = p;


        const balance =
            await p.getBalance(
                wallet.address
            );


        const box =
            document
            .getElementById(
                "balanceDisplay"
            );


        box.style.display =
            "block";


        box.innerHTML =

            "💰 موجودی: " +

            "<strong>" +

            ethers.formatEther(
                balance
            ) +

            " POL</strong>";


    }catch(e){

        const box =
            document
            .getElementById(
                "balanceDisplay"
            );


        box.style.display =
            "block";


        box.innerHTML =

            "<span class='error'>" +

            "❌ خطا: " +

            e.message +

            "</span>";

    }

}


/* =====================================================
   دریافت Fee مطمئن Polygon
===================================================== */

async function getPolygonFees(p){

    /*
     * آخرین بلاک را می‌گیریم
     * تا baseFee واقعی شبکه مشخص شود.
     */

    const block =
        await p.getBlock(
            "latest"
        );


    if(!block){

        throw new Error(
            "آخرین بلاک Polygon دریافت نشد."
        );

    }


    let baseFee =
        block.baseFeePerGas;


    /*
     * اگر RPC مقدار baseFee نداشت،
     * از getFeeData استفاده می‌کنیم.
     */

    if(
        baseFee === null ||
        baseFee === undefined
    ){

        const fd =
            await p.getFeeData();


        if(
            fd.maxFeePerGas !== null &&
            fd.maxFeePerGas !== undefined
        ){

            /*
             * مقدار تقریبی
             */

            baseFee =
                fd.maxFeePerGas / 2n;

        }else{

            throw new Error(
                "قیمت گس Polygon دریافت نشد."
            );

        }

    }


    /*
     * اول priority fee شبکه را می‌گیریم.
     */

    let priority = null;


    try{

        priority =
            await p.send(
                "eth_maxPriorityFeePerGas",
                []
            );

        priority =
            BigInt(priority);

    }catch(e){

        priority = null;

    }


    /*
     * اگر RPC مقدار عجیب بدهد،
     * آن را محدود می‌کنیم.
     *
     * 30 Gwei برای Polygon
     * مقدار محافظه‌کارانه‌ای است.
     */

    const MAX_PRIORITY =
        ethers.parseUnits(
            "30",
            "gwei"
        );


    if(
        priority === null ||
        priority <= 0n ||
        priority > MAX_PRIORITY
    ){

        priority =
            MAX_PRIORITY;

    }


    /*
     * EIP-1559
     *
     * maxFee = 2 × baseFee + priority
     */

    let maxFee =
        baseFee * 2n +
        priority;


    /*
     * حداقل maxFee باید از priority
     * بیشتر باشد.
     */

    if(
        maxFee < priority
    ){

        maxFee =
            priority;

    }


    return {

        baseFee,
        maxFee,
        priority

    };

}


/* =====================================================
   ارسال تراکنش
===================================================== */

async function sendTransaction(){

    if(!wallet){

        alert(
            "ابتدا کیف پول را بسازید."
        );

        return;
    }


    const to =
        document
        .getElementById(
            "toAddress"
        )
        .value
        .trim();


    const amount =
        document
        .getElementById(
            "amount"
        )
        .value
        .trim();


    /* -------------------------
       بررسی آدرس
    ------------------------- */

    if(
        !ethers.isAddress(to)
    ){

        alert(
            "❌ آدرس مقصد نامعتبر است."
        );

        return;
    }


    /* -------------------------
       مقدار
    ------------------------- */

    let value;


    try{

        if(
            !amount ||
            Number(amount) <= 0
        ){

            throw new Error();

        }


        value =
            ethers.parseEther(
                amount
            );


    }catch(e){

        alert(
            "❌ مقدار POL نامعتبر است."
        );

        return;

    }


    /* -------------------------
       تایید
    ------------------------- */

    if(
        !confirm(

            "⚠️ ارسال تراکنش\n\n" +

            "مبلغ: " +
            amount +
            " POL\n\n" +

            "مقصد:\n" +
            to +
            "\n\n" +

            "آیا مطمئن هستید؟"

        )
    ){

        return;
    }


    const sendBtn =
        document
        .getElementById(
            "sendBtn"
        );


    const status =
        document
        .getElementById(
            "txStatus"
        );


    try{

        sendBtn.disabled =
            true;


        status.style.display =
            "block";


        status.innerHTML =
            "⏳ در حال اتصال به Polygon...";


        /* =================================================
           پیدا کردن RPC
        ================================================= */

        const p =
            await getWorkingProvider();


        provider = p;


        /* =================================================
           بررسی Chain
        ================================================= */

        const network =
            await p.getNetwork();


        if(
            Number(network.chainId) !==
            CHAIN_ID
        ){

            throw new Error(
                "شبکه Polygon PoS پیدا نشد."
            );

        }


        /* =================================================
           موجودی
        ================================================= */

        const balance =
            await p.getBalance(
                wallet.address
            );


        /* =================================================
           Fee
        ================================================= */

        status.innerHTML =
            "⏳ در حال محاسبه کارمزد واقعی شبکه...";


        const fees =
            await getPolygonFees(
                p
            );


        /* =================================================
           Gas Estimate
        ================================================= */

        const estimatedGas =
            await p.estimateGas({

                from:
                    wallet.address,

                to:
                    to,

                value:
                    value

            });


        /*
         * کمی حاشیه
         */

        const gasLimit =
            estimatedGas *
            110n /
            100n;


        /* =================================================
           محاسبه هزینه
        ================================================= */

        const estimatedFee =
            gasLimit *
            fees.maxFee;


        const total =
            value +
            estimatedFee;


        /* =================================================
           بررسی موجودی
        ================================================= */

        if(
            balance < total
        ){

            const missing =
                total -
                balance;


            status.innerHTML = `

                <div class="tx-info">

                <span class="error">

                ❌ موجودی کافی نیست

                </span>

                <br><br>

                💰 موجودی:
                ${ethers.formatEther(
                    balance
                )}
                POL

                <br>

                💸 مبلغ:
                ${ethers.formatEther(
                    value
                )}
                POL

                <br>

                ⛽ حداکثر کارمزد:
                ${ethers.formatEther(
                    estimatedFee
                )}
                POL

                <br>

                💰 مجموع مورد نیاز:
                ${ethers.formatEther(
                    total
                )}
                POL

                <br>

                🔻 کسری:
                ${ethers.formatEther(
                    missing
                )}
                POL

                </div>

            `;


            sendBtn.disabled =
                false;


            return;

        }


        /* =================================================
           Nonce
        ================================================= */

        const nonce =
            await p.getTransactionCount(
                wallet.address,
                "pending"
            );


        /* =================================================
           نمایش اطلاعات
        ================================================= */

        status.innerHTML = `

            <div class="tx-info">

            <strong>
            📊 تراکنش آماده ارسال
            </strong>

            <br>

            💸 مبلغ:
            ${ethers.formatEther(
                value
            )}
            POL

            <br>

            ⛽ Gas Limit:
            ${gasLimit}

            <br>

            🔥 Max Fee:
            ${ethers.formatUnits(
                fees.maxFee,
                "gwei"
            )}
            Gwei

            <br>

            ⚡ Priority Fee:
            ${ethers.formatUnits(
                fees.priority,
                "gwei"
            )}
            Gwei

            <br>

            ⛽ حداکثر کارمزد:
            ${ethers.formatEther(
                estimatedFee
            )}
            POL

            <br>

            🔢 Nonce:
            ${nonce}

            </div>

            ⏳ در حال امضای تراکنش...

        `;


        /* =================================================
           ساخت تراکنش EIP-1559
        ================================================= */

        const txRequest = {

            type: 2,

            chainId:
                CHAIN_ID,

            nonce:
                nonce,

            to:
                to,

            value:
                value,

            gasLimit:
                gasLimit,

            maxFeePerGas:
                fees.maxFee,

            maxPriorityFeePerGas:
                fees.priority

        };


        /* =================================================
           امضا
        ================================================= */

        const signedTx =
            await wallet.signTransaction(
                txRequest
            );


        status.innerHTML =
            "⏳ تراکنش امضا شد؛ در حال انتشار روی Polygon...";


        /* =================================================
           Broadcast
        ================================================= */

        let txHash = null;

        let broadcastError = null;


        for(
            const rpcUrl of RPC_URLS
        ){

            try{

                const sendProvider =
                    createProvider(
                        rpcUrl
                    );


                txHash =
                    await sendProvider.send(
                        "eth_sendRawTransaction",
                        [
                            signedTx
                        ]
                    );


                console.log(
                    "Broadcast success:",
                    rpcUrl,
                    txHash
                );


                break;


            }catch(e){

                console.log(
                    "Broadcast failed:",
                    rpcUrl,
                    e.message
                );


                broadcastError =
                    e;

            }

        }


        if(!txHash){

            throw new Error(
                "تراکنش به RPCهای Polygon ارسال نشد.\n\n" +
                (
                    broadcastError?.message ||
                    ""
                )
            );

        }


        /* =================================================
           Hash نمایش داده شود
        ================================================= */

        status.innerHTML = `

            <div class="tx-info">

            <strong>
            📤 تراکنش ارسال شد
            </strong>

            <br><br>

            💸 مبلغ:
            ${ethers.formatEther(
                value
            )}
            POL

            <br>

            ⛽ Gas Limit:
            ${gasLimit}

            <br>

            🔥 Max Fee:
            ${ethers.formatUnits(
                fees.maxFee,
                "gwei"
            )}
            Gwei

            <br>

            <br>

            🔗 Hash:

            <br>

            ${txHash}

            <br><br>

            <a
                href="https://polygonscan.com/tx/${txHash}"
                target="_blank"
            >
            🔍 مشاهده در PolygonScan
            </a>

            </div>

            <span class="pending">

            ⏳ در حال بررسی تایید شبکه...

            </span>

        `;


        /* =================================================
           بررسی Receipt بدون wait()
        ================================================= */

        await waitForReceipt(
            txHash,
            status,
            value,
            gasLimit,
            fees
        );


    }catch(e){

        console.error(e);


        status.style.display =
            "block";


        status.innerHTML = `

            <div class="tx-info">

            <span class="error">

            ❌ خطا

            </span>

            <br><br>

            ${
                e.shortMessage ||
                e.reason ||
                e.message ||
                "خطای ناشناخته"
            }

            </div>

        `;

    }finally{

        sendBtn.disabled =
            false;

    }

}


/* =====================================================
   بررسی دستی Receipt
===================================================== */

async function waitForReceipt(
    txHash,
    status,
    value,
    gasLimit,
    fees
){

    /*
     * حداکثر ۶۰ ثانیه
     */

    const maxTime =
        60000;


    const start =
        Date.now();


    while(
        Date.now() - start <
        maxTime
    ){

        /*
         * چند RPC را بررسی می‌کنیم.
         */

        for(
            const rpcUrl of RPC_URLS
        ){

            try{

                const p =
                    createProvider(
                        rpcUrl
                    );


                const receipt =
                    await p.getTransactionReceipt(
                        txHash
                    );


                if(receipt){

                    if(
                        receipt.status === 1
                    ){

                        const gasUsed =
                            receipt.gasUsed;


                        const actualGasPrice =
                            receipt.gasPrice;


                        const actualFee =
                            gasUsed *
                            actualGasPrice;


                        status.innerHTML = `

                            <div class="tx-info">

                            <strong class="success">

                            ✅ تراکنش با موفقیت تایید شد

                            </strong>

                            <br><br>

                            💸 مبلغ:
                            ${ethers.formatEther(
                                value
                            )}
                            POL

                            <br>

                            ⛽ Gas مصرف‌شده:
                            ${gasUsed}

                            <br>

                            🔥 Gas Price واقعی:
                            ${ethers.formatUnits(
                                actualGasPrice,
                                "gwei"
                            )}
                            Gwei

                            <br>

                            💰 کارمزد واقعی:
                            ${ethers.formatEther(
                                actualFee
                            )}
                            POL

                            <br>

                            📦 بلاک:
                            ${receipt.blockNumber}

                            <br><br>

                            🔗 Hash:

                            <br>

                            ${txHash}

                            <br><br>

                            <a
                                href="https://polygonscan.com/tx/${txHash}"
                                target="_blank"
                            >
                            🔍 مشاهده در PolygonScan
                            </a>

                            </div>

                        `;


                        setTimeout(
                            checkBalance,
                            3000
                        );


                        return;

                    }


                    /*
                     * Receipt وجود دارد اما failed
                     */

                    status.innerHTML = `

                        <div class="tx-info">

                        <span class="error">

                        ❌ تراکنش توسط شبکه رد شد

                        </span>

                        <br><br>

/* =====================================================
   Sleep
===================================================== */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}
