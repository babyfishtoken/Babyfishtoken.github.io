<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>کیف پول Polygon - ۶ کلمه</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<style>

body{

<body>

<div class="container">

<h2>🔐 کیف پول Polygon — ۶ کلمه</h2>

<label>عبارت ۶ کلمه‌ای:</label>

<input
    type="text"
    id="phraseInput"
    placeholder="کلمه1 کلمه2 کلمه3 کلمه4 کلمه5 کلمه6"
>

<button onclick="createWallet()">
🔑 ساخت کیف پول
</button>

<button
    class="btn-warning"
    id="randomBtn"
    onclick="generateRandomPhrase()"
    disabled
>
🎲 تولید تصادفی
</button>


<div id="result" style="display:none;">

<h3>🔐 اطلاعات کیف پول</h3>

<div class="output">
<strong>عبارت:</strong>
<span id="phraseDisplay"></span>
</div>

<div class="output">
<strong>آدرس:</strong>
<span
    id="addressDisplay"
    style="color:#4CAF50;"
></span>
</div>

<div class="output">
<strong>کلید خصوصی:</strong>
<span
    id="privateKeyDisplay"
    style="color:#ffa500;"
></span>
</div>


<button onclick="checkBalance()">
💰 بررسی موجودی POL
</button>

<div
    id="balanceDisplay"
    class="output"
    style="display:none;"
></div>


<h3>📤 انتقال POL</h3>

<input
    type="text"
    id="toAddress"
    placeholder="آدرس مقصد 0x..."
>

<input
    type="text"
    id="amount"
    placeholder="مقدار POL مثلا 0.1"
>

<button
    id="sendBtn"
    onclick="sendTransaction()"
>
💸 ارسال تراکنش
</button>

<div
    id="txStatus"
    class="output"
    style="display:none;"
></div>


<button
    class="btn-danger"
    onclick="clearWallet()"
>
🗑️ پاک کردن اطلاعات
</button>

</div>

</div>


<script>

/* =====================================================
   تنظیمات
===================================================== */

const CHAIN_ID = 137;

const RPC_URLS = [

    "https://polygon-rpc.com",

    "https://polygon-bor-rpc.publicnode.com",

    "https://1rpc.io/poly"

];


/* =====================================================
   متغیرها
===================================================== */

let wallet = null;
let provider = null;

let wordList = [];
let isLoaded = false;


/* =====================================================
   ساخت Provider
===================================================== */

/*
 * مهم:
 * اینجا عمداً staticNetwork استفاده نشده است.
 * این مشکل نسخه قبلی را برطرف می‌کند.
 */

function createProvider(url){

    return new ethers.JsonRpcProvider(url);

}


/* =====================================================
   پیدا کردن RPC سالم
===================================================== */

async function getWorkingProvider(){

    for(
        const url of RPC_URLS
    ){

        try{

            const p =
                createProvider(url);

            const network =
                await p.getNetwork();

            if(
                Number(network.chainId) === CHAIN_ID
            ){

                return p;

            }

        }catch(e){

            console.log(
                "RPC Error:",
                url,
                e.message
            );

        }

    }

    throw new Error(
        "هیچ RPC سالمی برای Polygon پیدا نشد."
    );

}


/* =====================================================
   بارگذاری key.txt
===================================================== */

async function loadWordList(){

    try{

        const response =
            await fetch(
                "key.txt",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "فایل key.txt پیدا نشد."
            );

        }


        const text =
            await response.text();


        wordList =
            text
            .split(/\r?\n/)
            .map(
                word => word.trim()
            )
            .filter(
                word => word.length > 0
            );


        if(
            wordList.length === 0
        ){

            throw new Error(
                "فایل key.txt خالی است."
            );

        }


        isLoaded = true;


        document
        .getElementById("randomBtn")
        .disabled = false;


        console.log(
            "تعداد کلمات:",
            wordList.length
        );


    }catch(e){

        console.error(e);


        document
        .getElementById("randomBtn")
        .disabled = true;


        alert(
            "❌ خطا در بارگذاری key.txt\n\n" +
            e.message
        );

    }

}


loadWordList();


/* =====================================================
   تولید عبارت تصادفی
===================================================== */

function generateRandomPhrase(){

    if(
        !isLoaded ||
        wordList.length === 0
    ){

        alert(
            "⏳ لیست کلمات هنوز آماده نیست."
        );

        return;

    }


    const selected = [];


    /*
     * تصادفی امن‌تر از Math.random
     */

    const randomValues =
        new Uint32Array(6);


    crypto.getRandomValues(
        randomValues
    );


    for(
        let i = 0;
        i < 6;
        i++
    ){

        const index =
            randomValues[i] %
            wordList.length;


        selected.push(
            wordList[index]
        );

    }


    document
    .getElementById("phraseInput")
    .value =
        selected.join(" ");

}


/* =====================================================
   ساخت کیف پول
===================================================== */

function createWallet(){

    const phrase =
        document
        .getElementById("phraseInput")
        .value
        .trim();


    const words =
        phrase
        .split(/\s+/)
        .filter(Boolean);


    if(
        words.length !== 6
    ){

        alert(
            "❌ لطفاً دقیقاً ۶ کلمه وارد کنید."
        );

        return;

    }


    try{

        /*
         * روش ساخت کیف پول تغییر نکرده است.
         *
         * عبارت ۶ کلمه‌ای
         * -> UTF-8
         * -> Keccak256
         * -> Private Key
         */

        const privateKey =
            ethers.keccak256(
                ethers.toUtf8Bytes(
                    phrase
                )
            );


        wallet =
            new ethers.Wallet(
                privateKey
            );


        /*
         * RPC اولیه فقط برای خواندن است.
         */

        provider =
            createProvider(
                RPC_URLS[0]
            );


        document
        .getElementById("phraseDisplay")
        .textContent =
            phrase;


        document
        .getElementById("addressDisplay")
        .textContent =
            wallet.address;


        document
        .getElementById("privateKeyDisplay")
        .textContent =
            wallet.privateKey;


        document
        .getElementById("result")
        .style.display =
            "block";


        document
        .getElementById("txStatus")
        .style.display =
            "none";


        document
        .getElementById("balanceDisplay")
        .style.display =
            "none";


        setTimeout(
            checkBalance,
            500
        );


    }catch(e){

        alert(
            "❌ خطا در ساخت کیف پول:\n\n" +
            e.message
        );

    }

}


/* =====================================================
   بررسی موجودی
===================================================== */

async function checkBalance(){

    if(!wallet){

        alert(
            "ابتدا کیف پول را بسازید."
        );

        return;

    }


    try{

        const p =
            await getWorkingProvider();


        provider = p;


        const balance =
            await p.getBalance(
                wallet.address
            );


        const box =
            document
            .getElementById(
                "balanceDisplay"
            );


        box.style.display =
            "block";


        box.innerHTML =

            "💰 موجودی: " +

            "<strong>" +

            ethers.formatEther(
                balance
            ) +

            " POL</strong>";


    }catch(e){

        const box =
            document
            .getElementById(
                "balanceDisplay"
            );


        box.style.display =
            "block";


        box.innerHTML =

            "<span class='error'>" +

            "❌ خطا در دریافت موجودی: " +

            e.message +

            "</span>";

    }

}


/* =====================================================
   دریافت Gas Price
===================================================== */

async function getGasPrice(p){

    /*
     * اول Gas Price معمولی RPC
     */

    const feeData =
        await p.getFeeData();


    let gasPrice =
        feeData.gasPrice;


    /*
     * اگر موجود نبود، از latest block
     * استفاده می‌کنیم.
     */

    if(
        gasPrice === null ||
        gasPrice === undefined
    ){

        const block =
            await p.getBlock(
                "latest"
            );


        if(
            block &&
            block.baseFeePerGas
        ){

            /*
             * مقدار منطقی برای ارسال
             */

            gasPrice =
                block.baseFeePerGas * 2n;

        }

    }


    if(
        gasPrice === null ||
        gasPrice === undefined ||
        gasPrice <= 0n
    ){

        throw new Error(
            "قیمت گس از شبکه دریافت نشد."
        );

    }


    /*
     * اگر RPC مقدار کاملاً غیرعادی
     * برگرداند، آن را محدود نمی‌کنیم
     * بلکه به RPC بعدی اجازه می‌دهیم.
     *
     * چون ممکن است شرایط شبکه تغییر کند.
     */


    return gasPrice;

}


/* =====================================================
   تخمین Gas
===================================================== */

async function estimateTransaction(
    p,
    from,
    to,
    value
){

    return await p.estimateGas({

        from: from,

        to: to,

        value: value

    });

}


/* =====================================================
   ارسال تراکنش
===================================================== */

async function sendTransaction(){

    if(!wallet){

        alert(
            "ابتدا کیف پول را بسازید."
        );

        return;

    }


    const to =
        document
        .getElementById(
            "toAddress"
        )
        .value
        .trim();


    const amount =
        document
        .getElementById(
            "amount"
        )
        .value
        .trim();


    /* -----------------------------
       بررسی آدرس
    ----------------------------- */

    if(
        !ethers.isAddress(to)
    ){

        alert(
            "❌ آدرس مقصد نامعتبر است."
        );

        return;

    }


    /* -----------------------------
       مقدار
    ----------------------------- */

    let value;


    try{

        if(
            !amount ||
            Number(amount) <= 0
        ){

            throw new Error();

        }


        value =
            ethers.parseEther(
                amount
            );


    }catch(e){

        alert(
            "❌ مقدار POL نامعتبر است."
        );

        return;

    }


    /* -----------------------------
       تایید
    ----------------------------- */

    if(
        !confirm(

            "⚠️ تأیید ارسال\n\n" +

            "مبلغ: " +
            amount +
            " POL\n\n" +

            "مقصد:\n" +
            to +
            "\n\n" +

            "آیا مطمئن هستید؟"

        )
    ){

        return;

    }


    const sendBtn =
        document
        .getElementById(
            "sendBtn"
        );


    const status =
        document
        .getElementById(
            "txStatus"
        );


    try{

        sendBtn.disabled =
            true;


        status.style.display =
            "block";


        status.innerHTML =
            "⏳ اتصال به شبکه Polygon...";


        /* =========================
           RPC سالم
        ========================= */

        const p =
            await getWorkingProvider();


        provider = p;


        /* =========================
           بررسی شبکه
        ========================= */

        const network =
            await p.getNetwork();


        if(
            Number(network.chainId) !==
            CHAIN_ID
        ){

            throw new Error(
                "RPC به شبکه Polygon متصل نیست."
            );

        }


        /* =========================
           موجودی
        ========================= */

        const balance =
            await p.getBalance(
                wallet.address
            );


        /* =========================
           Gas Price
        ========================= */

        status.innerHTML =
            "⏳ در حال محاسبه کارمزد...";


        const gasPrice =
            await getGasPrice(p);


        /* =========================
           Gas Estimate
        ========================= */

        const estimatedGas =
            await estimateTransaction(
                p,
                wallet.address,
                to,
                value
            );


        /*
         * 10 درصد حاشیه
         */

        const gasLimit =
            estimatedGas *
            110n /
            100n;


        /* =========================
           هزینه
        ========================= */

        const estimatedFee =
            gasLimit *
            gasPrice;


        const totalCost =
            value +
            estimatedFee;


        /* =========================
           بررسی موجودی
        ========================= */

        if(
            balance <
            totalCost
        ){

            const missing =
                totalCost -
                balance;


            status.innerHTML = `

                <div class="tx-info">

                <strong class="error">
                ❌ موجودی کافی نیست
                </strong>

                <br><br>

                💰 موجودی:
                ${ethers.formatEther(
                    balance
                )}
                POL

                <br>

                💸 مبلغ:
                ${ethers.formatEther(
                    value
                )}
                POL

                <br>

                ⛽ حداکثر کارمزد:
                ${ethers.formatEther(
                    estimatedFee
                )}
                POL

                <br>

                💰 مجموع مورد نیاز:
                ${ethers.formatEther(
                    totalCost
                )}
                POL

                <br>

                🔻 کسری:
                ${ethers.formatEther(
                    missing
                )}
                POL

                </div>
            `;


            return;

        }


        /* =========================
           Nonce
        ========================= */

        const nonce =
            await p.getTransactionCount(
                wallet.address,
                "pending"
            );


        /* =========================
           جزئیات
        ========================= */

        status.innerHTML = `

            <div class="tx-info">

            <strong>
            📊 جزئیات تراکنش
            </strong>

            <br>

            💸 مبلغ:
            ${ethers.formatEther(
                value
            )}
            POL

            <br>

            ⛽ Gas Limit:
            ${gasLimit}

            <br>

            🔥 Gas Price:
            ${ethers.formatUnits(
                gasPrice,
                "gwei"
            )}
            Gwei

            <br>

            💰 حداکثر کارمزد:
            ${ethers.formatEther(
                estimatedFee
            )}
            POL

            <br>

            🔢 Nonce:
            ${nonce}

            </div>

            ⏳ در حال امضای تراکنش...

        `;


        /* =========================
           تراکنش
        ========================= */

        const transaction = {

            to: to,

            value: value,

            gasLimit: gasLimit,

            gasPrice: gasPrice,

            nonce: nonce,

            chainId: CHAIN_ID

        };


        /* =========================
           امضا
        ========================= */

        const signedTransaction =
            await wallet.signTransaction(
                transaction
            );


        status.innerHTML =
            "⏳ تراکنش امضا شد؛ در حال ارسال به Polygon...";


        /* =========================
           ارسال به RPCها
        ========================= */

        let txHash = null;

        let lastError = null;


        for(
            const rpcUrl of RPC_URLS
        ){

            try{

                const sendProvider =
                    createProvider(
                        rpcUrl
                    );


                txHash =
                    await sendProvider.send(
                        "eth_sendRawTransaction",
                        [
                            signedTransaction
                        ]
                    );


                console.log(
                    "Transaction sent:",
                    rpcUrl,
                    txHash
                );


                break;


            }catch(e){

                console.log(
                    "Send failed:",
                    rpcUrl,
                    e.message
                );


                lastError =
                    e;

            }

        }


        if(!txHash){

            throw new Error(

                "❌ تراکنش به شبکه ارسال نشد.\n\n" +

                (
                    lastError?.message ||
                    "خطای ناشناخته"
                )

            );

        }


        /* =========================
           نمایش Hash
        ========================= */

        status.innerHTML = `

            <div class="tx-info">

            <strong>
            📤 تراکنش ارسال شد
            </strong>

            <br><br>

            💸 مبلغ:
            ${ethers.formatEther(
                value
            )}
            POL

            <br>

            ⛽ Gas Limit:
            ${gasLimit}

            <br>

            🔥 Gas Price:
            ${ethers.formatUnits(
                gasPrice,
                "gwei"
            )}
            Gwei

            <br><br>

            🔗 هش تراکنش:

            <br>

            ${txHash}

            <br><br>

            <a
                href="https://polygonscan.com/tx/${txHash}"
                target="_blank"
            >
            🔍 مشاهده در PolygonScan
            </a>

            </div>

            <span class="pending">
            ⏳ در حال بررسی وضعیت شبکه...
            </span>

        `;


        /* =========================
           بررسی Receipt
        ========================= */

        await monitorTransaction(
            txHash,
            status,
            value
        );


    }catch(e){

        console.error(e);


        status.style.display =
            "block";


        status.innerHTML = `

            <div class="tx-info">

            <strong class="error">
            ❌ خطا
            </strong>

            <br><br>

            ${
                e.shortMessage ||
                e.reason ||
                e.message ||
                "خطای ناشناخته"
            }

            </div>

        `;

    }finally{

        sendBtn.disabled =
            false;

    }

}


/* =====================================================
   مانیتور تراکنش
===================================================== */

async function monitorTransaction(
    txHash,
    status,
    value
){

    /*
     * حداکثر ۶۰ ثانیه بررسی می‌کنیم.
     */

    const timeout =
        60000;


    const start =
        Date.now();


    while(
        Date.now() - start <
        timeout
    ){

        for(
            const rpcUrl of RPC_URLS
        ){

            try{

                const p =
                    createProvider(
                        rpcUrl
                    );


                const receipt =
                    await p.getTransactionReceipt(
                        txHash
                    );


                if(receipt){

                    /* =====================
                       موفق
                    ===================== */

                    if(
                        receipt.status === 1
                    ){

                        const gasUsed =
                            receipt.gasUsed;


                        const actualGasPrice =
                            receipt.gasPrice;


                        const actualFee =
                            gasUsed *
                            actualGasPrice;


                        status.innerHTML = `

                            <div class="tx-info">

                            <strong class="success">

                            ✅ تراکنش با موفقیت تایید شد

                            </strong>

                            <br><br>

                            💸 مبلغ:

                            ${ethers.formatEther(
                                value
                            )}

                            POL

                            <br>

                            ⛽ Gas مصرف‌شده:

                            ${gasUsed}

                            <br>

                            🔥 Gas Price واقعی:

                            ${ethers.formatUnits(
                                actualGasPrice,
                                "gwei"
                            )}

                            Gwei

                            <br>

                            💰 کارمزد واقعی:

                            ${ethers.formatEther(
                                actualFee
                            )}

                            POL

                            <br>

                            📦 شماره بلاک:

                            ${receipt.blockNumber}

                            <br><br>

                            🔗 Hash:

                            <br>

                            ${txHash}

                            <br><br>

                            <a
                                href="https://polygonscan.com/tx/${txHash}"
                                target="_blank"
                            >
                            🔍 مشاهده در PolygonScan
                            </a>

                            </div>

                        `;


                        setTimeout(
                            checkBalance,
                            3000
                        );


                        return;

                    }


                    /* =====================
                       شکست
                    ===================== */

                    status.innerHTML = `

                        <div class="tx-info">

                        <strong class="error">

                        ❌ تراکنش شکست خورد

                        </strong>

                        <br><br>

                        تراکنش روی شبکه ثبت شده،
                        اما موفق نبوده است.

                        <br><br>

                        Hash:

                        <br>

                        ${txHash}

                        <br><br>

                        <a
                            href="https://polygonscan.com/tx/${txHash}"
                            target="_blank"
                        >
                        🔍 مشاهده در PolygonScan
                        </a>

                        </div>

                    `;


                    return;

                }

            }catch(e){

                console.log(
                    "Receipt error:",
                    e.message
                );

            }

        }


        await sleep(3000);

    }


    /* =====================================================
       Timeout
    ===================================================== */

    status.innerHTML = `

        <div class="tx-info">

        <strong class="warning">

        ⚠️ هنوز تایید نشده

        </strong>

        <br><br>

        تراکنش ارسال شده، اما در ۶۰ ثانیه
        Receipt دریافت نشد.

        <br><br>

        این صفحه دیگر منتظر نمی‌ماند.

        <br><br>

        🔗 Hash:

        <br>

        ${txHash}

        <br><br>

        <a
            href="https://polygonscan.com/tx/${txHash}"
            target="_blank"
        >
        🔍 بررسی در PolygonScan
        </a>

        </div>

        <div class="small">

        اگر PolygonScan هنوز Hash را پیدا نمی‌کند،

/* =====================================================

===================================================== */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}
