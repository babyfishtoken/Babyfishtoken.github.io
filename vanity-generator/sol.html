<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Solana 12 Words Wallet</title>


<script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bip39@3.1.0/dist/bip39.browser.min.js"></script>


<style>

body{
    background:#111827;
    color:white;
    font-family:Arial;
    padding:30px;
    text-align:center;
}


button{
    background:#9945FF;
    color:white;
    border:0;
    padding:15px 35px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}


.box{
    background:#1f2937;
    margin:30px auto;
    padding:20px;
    border-radius:12px;
    max-width:900px;
    text-align:left;
    word-break:break-all;
}


.title{
    color:#14F195;
    font-weight:bold;
    margin-top:20px;
}


.value{
    font-family:monospace;
}


.words{
    color:#facc15;
    font-size:18px;
    line-height:2;
}


</style>

</head>


<body>


<h1>🚀 Solana Wallet Generator</h1>


<button onclick="createWallet()">
🎲 ساخت کیف پول
</button>


<div class="box" id="output">
دکمه را بزنید...
</div>



<script>


async function createWallet(){

try{


if(typeof solanaWeb3 === "undefined"){
    throw new Error("Solana Library Load نشد");
}


if(typeof bip39 === "undefined"){
    throw new Error("BIP39 Load نشد");
}


// ساخت ۱۲ کلمه
const mnemonic = bip39.generateMnemonic(128);


// تبدیل به Seed
const seed = await bip39.mnemonicToSeed(mnemonic);


// گرفتن ۳۲ بایت اول برای Solana
const seed32 = seed.slice(0,32);


// ساخت کیف پول
const wallet = solanaWeb3.Keypair.fromSeed(seed32);


// کلید خصوصی
let privateKey = Array.from(wallet.secretKey)
.map(x=>x.toString(16).padStart(2,"0"))
.join("");



document.getElementById("output").innerHTML = `


<div class="title">
📝 عبارت بازیابی ۱۲ کلمه‌ای
</div>

<div class="words">
${mnemonic}
</div>


<div class="title">
📍 آدرس سولانا
</div>

<div class="value">
${wallet.publicKey.toString()}
</div>


<div class="title">
🔑 کلید خصوصی ۶۴ بایت
</div>

<div class="value" style="color:#facc15;font-size:12px">
${privateKey}
</div>


<br>

<div style="color:#9ca3af">
⚠️ این ۱۲ کلمه کل مالکیت کیف پول است.
<br>
آن را ذخیره و منتشر نکنید.
</div>


`;



}catch(e){

console.error(e);

document.getElementById("output").innerHTML=
`
<div style="color:red">
❌ خطا:
${e.message}
</div>
`;

}


}


</script>


</body>
</html>
