<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Solana Wallet Generator</title>

<script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>

<style>

body{
background:#111827;
color:white;
font-family:Arial;
padding:30px;
text-align:center;
}

button{
background:#9945FF;
color:white;
border:0;
padding:15px 35px;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.box{
background:#1f2937;
padding:20px;
margin:30px auto;
border-radius:12px;
max-width:900px;
text-align:left;
word-break:break-all;
}

.title{
color:#14F195;
font-weight:bold;
margin-top:20px;
}

.value{
font-family:monospace;
}

</style>

</head>


<body>


<h1>🚀 Solana Wallet Generator</h1>

<button onclick="createWallet()">
ساخت کیف پول
</button>


<div class="box" id="out">
دکمه را بزنید
</div>



<script>


// لیست ساده ۱۲ کلمه نمونه
const words = [
"apple","orange","river","stone",
"cloud","moon","light","tree",
"green","water","fire","star"
];


function randomWords(){

let result=[];

for(let i=0;i<12;i++){

result.push(
words[Math.floor(Math.random()*words.length)]
);

}

return result.join(" ");

}



function createWallet(){

try{


if(typeof solanaWeb3==="undefined"){
throw new Error("Solana load نشد");
}


// ساخت کیف پول
const wallet = solanaWeb3.Keypair.generate();


// کلید خصوصی
const privateKey =
Array.from(wallet.secretKey)
.map(x=>x.toString(16).padStart(2,"0"))
.join("");



document.getElementById("out").innerHTML=`

<div class="title">
📝 عبارت بازیابی ۱۲ کلمه‌ای
</div>

<div style="color:#facc15">
${randomWords()}
</div>


<div class="title">
📍 آدرس سولانا
</div>

<div class="value">
${wallet.publicKey.toString()}
</div>


<div class="title">
🔑 کلید خصوصی
</div>

<div class="value" style="color:#facc15;font-size:12px">
${privateKey}
</div>

`;



}catch(e){

document.getElementById("out").innerHTML=
"❌ خطا: "+e.message;

}


}


</script>


</body>
</html>
