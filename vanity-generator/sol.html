<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solana Wallet Test</title>

<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>

<style>
body{
    background:#111827;
    color:white;
    font-family:Arial;
    padding:30px;
    text-align:center;
}

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#9945FF;
    color:white;
    cursor:pointer;
    margin:10px;
    transition:all 0.3s;
}

button:hover{
    background:#7a35cc;
    transform:scale(1.02);
}

.box{
    margin:auto;
    margin-top:20px;
    max-width:800px;
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    word-break:break-all;
    text-align:left;
}

.title{
    color:#14F195;
    font-weight:bold;
    margin-top:10px;
}

.value{
    color:#fff;
    font-family:monospace;
    font-size:14px;
}

hr{
    border-color:#374151;
    margin:15px 0;
}
</style>
</head>

<body>

<h2>🚀 Solana Wallet Generator - Test</h2>

<button onclick="makeWallet()">🎲 ساخت کیف پول</button>

<div class="box" id="out">
    دکمه را بزنید...
</div>

<script>

function makeWallet(){

    try{
        console.log('⏳ Starting wallet generation...');
        
        // بررسی وجود solana
        if(typeof solana === 'undefined'){
            throw new Error('Solana library not loaded!');
        }
        
        if(typeof solana.web3 === 'undefined'){
            throw new Error('Solana web3 not available!');
        }
        
        // تولید کیف پول
        const wallet = solana.web3.Keypair.generate();
        
        console.log('✅ Wallet generated successfully');
        console.log('Public Key:', wallet.publicKey.toString());
        
        // تبدیل کلید به هگز
        const hexKey = Array.from(wallet.secretKey)
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');
        
        document.getElementById("out").innerHTML = `
            <div class="title">📍 آدرس عمومی (Public Key)</div>
            <div class="value" style="color:#4ade80; font-size:16px;">
                ${wallet.publicKey.toString()}
            </div>
            
            <hr>
            
            <div class="title">🔑 کلید خصوصی (64 bytes - Hex)</div>
            <div class="value" style="font-size:11px; color:#fcd34d;">
                ${hexKey}
            </div>
            
            <hr>
            
            <div style="color:#9ca3af; font-size:14px;">
                ✅ کیف پول با موفقیت ساخته شد
                <br>
                ⚠️ این کلید را در جای امن نگهداری کنید
            </div>
        `;
        
    } catch(e){
        console.error('❌ Error:', e);
        document.getElementById("out").innerHTML = `
            <div style="color:#ef4444;">
                ❌ خطا: ${e.message}
                <br>
                <span style="font-size:14px; color:#9ca3af;">
                    لطفاً کنسول مرورگر را بررسی کنید (F12)
                </span>
            </div>
        `;
    }
}

// تست خودکار در شروع
window.onload = function(){
    console.log('✅ Page loaded, Solana:', typeof solana !== 'undefined' ? '✅' : '❌');
    console.log('✅ Solana web3:', typeof solana?.web3 !== 'undefined' ? '✅' : '❌');
    
    // ساخت یک کیف پول نمونه
    setTimeout(() => {
        makeWallet();
    }, 500);
};

</script>

</body>
</html>
