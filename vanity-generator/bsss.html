<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multichain Wallet Scanner</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    padding:15px;
    background:#0b1120;
    color:#fff;
    font-family:Arial,sans-serif;
}
.container{
    max-width:1000px;
    margin:auto;
    background:#111827;
    border:1px solid #263244;
    border-radius:16px;
    padding:16px;
}
h1{
    text-align:center;
    margin:0 0 5px;

    font-size:22px;
}
.sub{
    text-align:center;
    color:#9ca3af;

    margin-bottom:15px;
}
textarea{
    width:100%;
    height:150px;
    resize:vertical;
    padding:12px;

    border:1px solid #374151;
    border-radius:10px;

    direction:ltr;

}

.buttons{

button{

}

}

.scan{background:#059669}

}

}

    font-size:10px;
}

.wallet{

    border:1px solid #263244;
    border-radius:9px;

    overflow:hidden;
}

.wallet-head{

    display:flex;
    align-items:center;

}

}
.addr{

    flex:1;
}
.wstatus{

    white-space:nowrap;
}

.networks{

}

    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 6px;

}
.net:last-child{border-bottom:0}

.netname{
    width:95px;
    color:#d1d5db;
    font-size:11px;

}

.native{
    color:#fbbf24;
    font:11px monospace;
    direction:ltr;
    white-space:nowrap;
}

.tokens{

    gap:4px;
    flex-wrap:wrap;
    flex:1;
}

    background:#182235;
    border:1px solid #293548;
    border-radius:5px;

    font-size:10px;
    direction:ltr;
    white-space:nowrap;
}
.token b{color:#fbbf24}
.token small{color:#9ca3af}

.nothing{

}
.retry{

    font-size:10px;
}
.fail{

    font-size:10px;
}

    white-space:nowrap;
}

    color:#f87171;
    font-size:11px;
    margin-top:7px;
}

@media(max-width:650px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .netname{width:80px}
    .wallet-head{align-items:flex-start}
    .wstatus{display:none}
    button{min-width:100%}
}
</style>
</head>

<body>

<div class="container">

<h1>💰 Multichain Wallet Scanner</h1>

<div class="sub">
بررسی موجودی Native + ERC-20 / BEP-20 با APIهای عمومی
</div>

<div id="status" class="status info">
📋 آدرس‌ها را وارد کنید
</div>

<textarea id="addresses"
placeholder="هر آدرس در یک خط:

0x0000000000000000000000000000000000000000
0x1111111111111111111111111111111111111111"></textarea>

<div id="count" class="count">
تعداد آدرس‌ها: 0
</div>

<div class="buttons">
<button class="parse" id="parse">📋 بررسی آدرس‌ها</button>
<button class="scan" id="scan" disabled>🔍 شروع استعلام</button>
<button class="copy" id="copy" disabled>📋 کپی نتایج</button>
<button class="clear" id="clear">🗑 پاک کردن</button>
</div>

<div class="error-list" id="errors"></div>

<div class="progress" id="progress">
<div id="progressFill"></div>
</div>

<div class="stats" id="stats">
<div class="stat">
<b id="s1">0</b>

</div>
<div class="stat">
<b id="s2">0</b>
<span>دارای موجودی</span>
</div>
<div class="stat">
<b id="s3">0</b>
<span>توکن</span>
</div>
<div class="stat">
<b id="s4">0</b>
<span>خطا</span>
</div>
</div>

<div id="results"></div>

</div>

<script>

/* =========================================================
   NETWORKS
   Blockscout public APIs are used where available.
   RPC is used for native balances.
========================================================= */

const NETWORKS = [

{
    id:"eth",
    name:"Ethereum",
    symbol:"ETH",
    rpc:"https://ethereum-rpc.publicnode.com",
    explorer:"https://eth.blockscout.com"
},

{

    name:"Polygon",
    symbol:"POL",
    rpc:"https://polygon-bor-rpc.publicnode.com",
    explorer:"https://polygon.blockscout.com"
},

{

    name:"Arbitrum",
    symbol:"ETH",
    rpc:"https://arbitrum-one-rpc.publicnode.com",
    explorer:"https://arbitrum.blockscout.com"
},

{
    id:"optimism",
    name:"Optimism",
    symbol:"ETH",
    rpc:"https://optimism-rpc.publicnode.com",
    explorer:"https://optimism.blockscout.com"
},

{

    name:"Base",
    symbol:"ETH",
    rpc:"https://base-rpc.publicnode.com",
    explorer:"https://base.blockscout.com"
},

{
    id:"gnosis",
    name:"Gnosis",
    symbol:"xDAI",
    rpc:"https://gnosis-rpc.publicnode.com",
    explorer:"https://gnosis.blockscout.com"
},

{
    id:"celo",
    name:"Celo",
    symbol:"CELO",
    rpc:"https://celo-rpc.publicnode.com",
    explorer:"https://celo.blockscout.com"
},

{
    id:"zksync",
    name:"zkSync",
    symbol:"ETH",
    rpc:"https://zksync-era-rpc.publicnode.com",
    explorer:"https://zksync.blockscout.com"
},

{
    id:"scroll",
    name:"Scroll",
    symbol:"ETH",
    rpc:"https://scroll-rpc.publicnode.com",
    explorer:"https://scroll.blockscout.com"
},

{
    id:"bnb",
    name:"BNB Chain",
    symbol:"BNB",
    rpc:"https://bsc-dataseed.binance.org",
    explorer:null
},

{
    id:"avalanche",
    name:"Avalanche",
    symbol:"AVAX",
    rpc:"https://avalanche-c-chain-rpc.publicnode.com",
    explorer:null
},

{
    id:"linea",
    name:"Linea",
    symbol:"ETH",
    rpc:"https://linea-rpc.publicnode.com",
    explorer:null
},

{
    id:"mantle",
    name:"Mantle",
    symbol:"MNT",
    rpc:"https://mantle-rpc.publicnode.com",
    explorer:null
},

{
    id:"blast",
    name:"Blast",
    symbol:"ETH",
    rpc:"https://blast-rpc.publicnode.com",
    explorer:null
}

];


/* =========================================================
   SETTINGS
========================================================= */

const RETRIES = 3;
const CONCURRENT = 4;

let addresses = [];
let results = [];

const $ = id => document.getElementById(id);

const addressBox = $("addresses");
const countBox = $("count");
const statusBox = $("status");
const errorsBox = $("errors");
const progress = $("progress");
const progressFill = $("progressFill");
const resultsBox = $("results");
const stats = $("stats");

const parseBtn = $("parse");
const scanBtn = $("scan");
const copyBtn = $("copy");
const clearBtn = $("clear");


/* =========================================================
   HELPERS
========================================================= */

function sleep(ms){
    return new Promise(r => setTimeout(r,ms));
}

function shortAddress(a){
    return a.slice(0,8)+"..."+a.slice(-6);
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatUnits(value,decimals){

    try{

        let n = Number(value) /
                Math.pow(10,decimals);

        if(!Number.isFinite(n))
            return String(value);

        if(n === 0)
            return "0";

        if(n < 0.000001)
            return n.toExponential(5);

        if(n < 1)
            return n.toFixed(8);

        return n.toLocaleString(
            "en-US",
            {
                maximumFractionDigits:8
            }
        );

    }catch{
        return String(value);
    }
}


/* =========================================================
   ADDRESS PARSING
========================================================= */

addressBox.addEventListener("input",()=>{

    const lines =
        addressBox.value
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);

    const valid =
        lines.filter(
            x=>/^0x[a-fA-F0-9]{40}$/.test(x)
        );

    countBox.textContent =
        `تعداد آدرس‌های معتبر: ${valid.length} | کل خطوط: ${lines.length}`;

});


parseBtn.onclick = ()=>{

    const lines =
        addressBox.value
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);

    addresses = [];
    const invalid = [];

    for(let i=0;i<lines.length;i++){

        const a = lines[i];

        if(/^0x[a-fA-F0-9]{40}$/.test(a)){

            if(
                !addresses.some(
                    x=>x.toLowerCase()===a.toLowerCase()
                )
            ){
                addresses.push(a);
            }

        }else{

            invalid.push(
                `خط ${i+1}: آدرس نامعتبر`
            );

        }

    }

    errorsBox.innerHTML =
        invalid.join("<br>");

    countBox.textContent =
        `تعداد آدرس‌های معتبر: ${addresses.length}`;

    resultsBox.innerHTML="";
    stats.style.display="none";
    copyBtn.disabled=true;

    if(!addresses.length){

        scanBtn.disabled=true;

        statusBox.className="status err";
        statusBox.textContent=
            "❌ هیچ آدرس معتبر پیدا نشد.";

        return;
    }

    scanBtn.disabled=false;

    statusBox.className="status ok";
    statusBox.textContent=
        `✅ ${addresses.length} آدرس آماده است.`;

};


/* =========================================================
   FETCH WITH RETRY
========================================================= */

async function fetchRetry(
    url,
    options={}
){

    let lastError;

    for(let attempt=1;attempt<=RETRIES;attempt++){

        try{

            const controller =
                new AbortController();

            const timer =
                setTimeout(
                    ()=>controller.abort(),
                    15000
                );

            const response =
                await fetch(
                    url,
                    {
                        ...options,
                        signal:controller.signal
                    }
                );

            clearTimeout(timer);

            if(!response.ok){

                throw new Error(
                    "HTTP "+response.status
                );

            }

            return {
                ok:true,
                data:await response.json(),
                attempt
            };

        }catch(error){

            lastError=error;

            if(attempt<RETRIES){

                await sleep(
                    500 * attempt
                );

            }

        }

    }

    return {
        ok:false,
        error:lastError,
        attempt:RETRIES
    };

}


/* =========================================================
   NATIVE BALANCE
========================================================= */

async function getNative(
    network,
    address
){

    const body = {

        jsonrpc:"2.0",
        id:1,
        method:"eth_getBalance",
        params:[
            address,
            "latest"
        ]

    };

    const result =
        await fetchRetry(
            network.rpc,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify(body)
            }
        );

    if(!result.ok)
        throw result.error;

    if(result.data.error)
        throw new Error(
            result.data.error.message ||
            "RPC error"
        );

    const wei =
        BigInt(result.data.result);

    return {
        wei,
        attempt:result.attempt
    };

}


/* =========================================================
   BLOCKSCOUT TOKEN BALANCES
========================================================= */

async function getTokens(
    network,
    address
){

    if(!network.explorer){

        return {
            supported:false,
            tokens:[]
        };

    }

    const url =
        network.explorer +
        "/api/v2/addresses/" +
        encodeURIComponent(address) +
        "/token-balances";

    const result =
        await fetchRetry(url);

    if(!result.ok)
        throw result.error;

    const raw =
        Array.isArray(result.data)
        ? result.data
        : (
            result.data.items ||
            result.data.result ||
            []
        );

    const tokens = [];

    for(const item of raw){

        /*
          Blockscout response format can contain:
          token
          value
          token_instance
        */

        const token =
            item.token ||
            item;

        const type =
            String(
                token.type ||
                token.token_type ||
                ""
            ).toUpperCase();

        /*
          فقط ERC-20
        */

        if(
            type &&
            !type.includes("ERC-20")
        ){
            continue;
        }

        const value =
            item.value ??
            item.balance ??
            token.balance ??
            "0";

        const decimals =
            Number(
                token.decimals ??
                item.decimals ??
                18
            );

        let numeric;

        try{
            numeric =
                BigInt(String(value));
        }catch{
            continue;
        }

        /*
          توکن صفر را حذف کن
        */

        if(numeric === 0n)
            continue;

        const symbol =
            token.symbol ||
            item.symbol ||
            "TOKEN";

        const name =
            token.name ||
            item.name ||
            symbol;

        const addressHash =
            token.address_hash ||
            token.contract_address ||
            item.token_address ||
            "";

        tokens.push({

            name,
            symbol,
            decimals,
            value:String(value),
            address:addressHash

        });

    }

    return {
        supported:true,
        tokens,
        attempt:result.attempt
    };

}


/* =========================================================
   CREATE EMPTY WALLET RESULT
========================================================= */

function createWallet(address){

    const wallet={
        address,
        networks:{}
    };

    for(const n of NETWORKS){

        wallet.networks[n.id]={
            network:n,
            native:null,
            tokens:[],
            nativeError:null,
            tokenError:null,
            nativeRetry:0,
            tokenRetry:0,
            tokenSupported:false
        };

    }

    return wallet;

}


/* =========================================================
   RENDER WALLET IMMEDIATELY
========================================================= */

function createWalletElement(
    wallet,
    index
){

    const div =
        document.createElement("div");

    div.className="wallet";

    div.id=
        "wallet-"+index;

    div.innerHTML=`

        <div class="wallet-head">

            <span class="num">
                #${index+1}
            </span>

            <span class="addr">
                ${escapeHtml(wallet.address)}
            </span>

            <span class="wstatus">
                در حال بررسی...
            </span>

        </div>

        <div class="networks"></div>
    `;

    resultsBox.appendChild(div);

    return div;

}


/* =========================================================
   RENDER ONE NETWORK
========================================================= */

function renderNetwork(
    walletElement,
    data
){

    const network =
        data.network;

    const networksBox =
        walletElement.querySelector(
            ".networks"
        );

    let row =
        networksBox.querySelector(
            `[data-network="${network.id}"]`
        );

    if(!row){

        row =
            document.createElement("div");

        row.className="net";

        row.dataset.network =
            network.id;

        networksBox.appendChild(row);

    }

    let nativeHtml="";

    if(data.nativeError){

        nativeHtml=
            `<span class="fail">
                ❌ ${escapeHtml(
                    data.nativeError
                )}
             </span>`;

    }else if(data.native !== null){

        nativeHtml=
            `<span class="native">
                ${formatUnits(
                    data.native,
                    18
                )}
                ${network.symbol}
             </span>`;

    }else{

        nativeHtml=
            `<span class="retry">
                ⏳
             </span>`;

    }


    let tokenHtml="";

    if(data.tokenError){

        tokenHtml=
            `<span class="fail">
                توکن: ❌
             </span>`;

    }else if(
        data.tokenSupported &&
        data.tokens.length
    ){

        tokenHtml =
            data.tokens.map(t=>`

                <span
                    class="token"
                    title="${escapeHtml(
                        t.name+
                        " | "+
                        t.address
                    )}"
                >

                    ${escapeHtml(t.symbol)}

                    <b>
                        ${formatUnits(
                            t.value,
                            t.decimals
                        )}
                    </b>

                </span>

            `).join("");

    }else if(
        data.tokenSupported
    ){

        tokenHtml =
            `<span class="nothing">
                بدون توکن
             </span>`;

    }else{

        tokenHtml =
            `<span class="nothing">
                Token API ندارد
             </span>`;

    }


    row.innerHTML=`

        <span class="netname">
            ${escapeHtml(network.name)}
        </span>

        ${nativeHtml}

        <span class="tokens">
            ${tokenHtml}
        </span>

    `;

}


/* =========================================================
   UPDATE WALLET STATUS
========================================================= */

function updateWalletStatus(
    wallet,
    element
){

    let done=0;
    let errors=0;
    let has=false;

    for(const id in wallet.networks){

        const d =
            wallet.networks[id];

        if(
            d.native !== null ||
            d.nativeError
        ){
            done++;
        }

        if(
            d.nativeError ||
            d.tokenError
        ){
            errors++;
        }

        if(
            d.native &&
            d.native !== 0n
        ){
            has=true;
        }

        if(d.tokens.length){
            has=true;
        }

    }

    const status =
        element.querySelector(
            ".wstatus"
        );

    if(done === NETWORKS.length){

        status.textContent =
            errors
            ? `⚠️ ${errors} خطا`
            : (
                has
                ? "● دارای موجودی"
                : "○ بدون موجودی"
            );

        status.style.color =
            errors
            ? "#fbbf24"
            : (
                has
                ? "#34d399"
                : "#9ca3af"
            );

    }else{

        status.textContent =
            `${done}/${NETWORKS.length}`;

    }

}


/* =========================================================
   SCAN
========================================================= */

scanBtn.onclick =
async function(){

    if(!addresses.length)
        return;

    scanBtn.disabled=true;
    parseBtn.disabled=true;
    copyBtn.disabled=true;

    resultsBox.innerHTML="";
    results=[];

    progress.style.display="block";
    progressFill.style.width="0%";

    stats.style.display="grid";

    $("s1").textContent=
        addresses.length;

    $("s2").textContent="0";
    $("s3").textContent="0";
    $("s4").textContent="0";


    /*
       اول کارت کیف پول‌ها را فوراً بساز
       تا نتایج به‌صورت زنده داخل آن‌ها بیاید.
    */

    const elements=[];

    addresses.forEach(
        (address,index)=>{

            const wallet =
                createWallet(address);

            results.push(wallet);

            elements.push(
                createWalletElement(
                    wallet,
                    index
                )
            );

        }
    );


    const tasks=[];

    for(
        let i=0;
        i<results.length;
        i++
    ){

        const wallet=results[i];

        for(const network of NETWORKS){

            tasks.push(
                async()=>{

                    const data =
                        wallet.networks[
                            network.id
                        ];

                    statusBox.className=
                        "status loading";

                    statusBox.textContent=
                        `⏳ ${network.name} — ${shortAddress(wallet.address)}`;


                    /*
                       Native
                    */

                    try{

                        const native =
                            await getNative(
                                network,
                                wallet.address
                            );

                        data.native =
                            native.wei;

                        data.nativeRetry =
                            native.attempt;

                    }catch(error){

                        data.nativeError =
                            error?.message ||
                            "RPC Error";

                    }


                    renderNetwork(
                        elements[i],
                        data
                    );


                    /*
                       Token balances
                    */

                    try{

                        const tokenResult =
                            await getTokens(
                                network,
                                wallet.address
                            );

                        data.tokenSupported =
                            tokenResult.supported;

                        data.tokens =
                            tokenResult.tokens ||
                            [];

                        data.tokenRetry =
                            tokenResult.attempt ||
                            0;

                    }catch(error){

                        data.tokenError =
                            error?.message ||
                            "Token API Error";

                    }


                    renderNetwork(
                        elements[i],
                        data
                    );

                    updateWalletStatus(
                        wallet,
                        elements[i]
                    );


                    updateStats();

                }
            );

        }

    }


    /*
       اجرای هم‌زمان کنترل‌شده
    */

    let pointer=0;
    let completed=0;

    async function worker(){

        while(true){

            const i=pointer++;

            if(i>=tasks.length)
                return;

            try{
                await tasks[i]();
            }catch(error){
                console.error(error);
            }

            completed++;

            progressFill.style.width =
                (
                    completed /
                    tasks.length *
                    100
                )+"%";

        }

    }


    const workers=[];

    for(
        let i=0;
        i<Math.min(
            CONCURRENT,
            tasks.length
        );
        i++
    ){
        workers.push(worker());
    }

    await Promise.all(workers);


    progressFill.style.width="100%";

    scanBtn.disabled=false;
    parseBtn.disabled=false;
    copyBtn.disabled=false;

    statusBox.className=
        "status ok";

    statusBox.textContent=
        `✅ استعلام کامل شد — ${addresses.length} آدرس بررسی شد.`;

};


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    let walletsWithBalance=0;
    let tokenCount=0;
    let errors=0;

    for(const wallet of results){

        let has=false;

        for(const id in wallet.networks){

            const d =
                wallet.networks[id];

            if(
                d.native &&
                d.native !== 0n
            ){
                has=true;
            }

            tokenCount +=
                d.tokens.length;

            if(
                d.nativeError ||
                d.tokenError
            ){
                errors++;
            }

        }

        if(has)
            walletsWithBalance++;

    }

    $("s2").textContent=
        walletsWithBalance;

    $("s3").textContent=
        tokenCount;

    $("s4").textContent=
        errors;

}


/* =========================================================
   COPY
========================================================= */

copyBtn.onclick=()=>{

    let text=
        "MULTICHAIN WALLET REPORT\n"+
        "========================\n\n";

    for(const wallet of results){

        text+=
            wallet.address+"\n";

        for(const network of NETWORKS){

            const d =
                wallet.networks[
                    network.id
                ];

            if(
                d.native !== null &&
                !d.nativeError
            ){

                text +=
                    `${network.name}: `+
                    `${formatUnits(
                        d.native,
                        18
                    )} ${network.symbol}\n`;

            }else{

                text +=
                    `${network.name}: ERROR\n`;

            }


            for(const t of d.tokens){

                text +=
                    `  ${t.symbol}: `+
                    `${formatUnits(
                        t.value,
                        t.decimals
                    )}`+
                    ` | ${t.address}\n`;

            }

        }

        text+="\n";

    }

    navigator.clipboard
        .writeText(text)
        .then(()=>{

            const old=
                copyBtn.textContent;

            copyBtn.textContent=
                "✅ کپی شد";

            setTimeout(
                ()=>copyBtn.textContent=old,
                1800
            );

        });

};


/* =========================================================
   CLEAR
========================================================= */

clearBtn.onclick=()=>{

    addressBox.value="";
    addresses=[];
    results=[];

    countBox.textContent=
        "تعداد آدرس‌ها: 0";

    resultsBox.innerHTML="";
    errorsBox.innerHTML="";
    stats.style.display="none";

    progress.style.display="none";

    scanBtn.disabled=true;
    copyBtn.disabled=true;

    statusBox.className=
        "status info";

    statusBox.textContent=
        "📋 آدرس‌ها را وارد کنید";

};

</script>
